<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crossy Stabi Character Gameplay Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031922;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block}.tag{position:fixed;left:12px;top:10px;z-index:10;padding:8px 10px;border:1px solid #4ce9df;border-radius:9px;background:#03161ddd;color:#fff;font:900 11px monospace}.tag b{color:#5cf4ea}.hint{position:fixed;left:50%;bottom:12px;z-index:10;transform:translateX(-50%);padding:8px 11px;border:1px solid #2c837e;border-radius:9px;background:#031417dd;color:#b6e8e3;font:800 10px monospace;white-space:nowrap}.pad{position:fixed;left:14px;bottom:56px;z-index:11;width:150px;height:110px}.pad button{position:absolute;width:46px;height:42px;border:1px solid #4ce9df;border-radius:8px;background:#08242a;color:#fff;font-size:20px;font-weight:900}.up{left:52px;top:0}.left{left:0;top:52px}.down{left:52px;top:52px}.right{left:104px;top:52px}@media(max-width:700px){.tag{font-size:9px}.hint{font-size:8px}.pad{transform:scale(.9);transform-origin:left bottom}}</style></head><body><div class="tag">CROSSY STABI • <b>3D CHARACTER GAMEPLAY TEST</b></div><div class="hint">WASD / arrows / touch • gameplay utama belum disentuh</div><div class="pad"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x031922);scene.fog=new THREE.Fog(0x031922,55,120);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.OrthographicCamera(-14,14,10,-10,.1,200);camera.position.set(17,24,22);scene.add(new THREE.HemisphereLight(0xc8fffb,0x021114,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-20,35,20);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);const TILE=3.1,HALF=4,WIDTH=28;function mat(c,r=.58){return new THREE.MeshStandardMaterial({color:c,roughness:r,flatShading:true})}function add(g,o,x,y,z){o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}function box(g,w,h,d,c,x,y,z){return add(g,new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)),x,y,z)}function sph(g,r,c,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),mat(c));m.scale.set(sx,sy,sz);return add(g,m,x,y,z)}function cyl(g,rt,rb,h,c,x,y,z){return add(g,new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,10),mat(c)),x,y,z)}function makeStabi(){const g=new THREE.Group(),SKIN=0xf2b99d,HAIR=0x102d88,HAIR2=0x1a43a9,CYAN=0x52c9cf,CYAN2=0x85e0df,WHITE=0xf7f8f5,SHOE=0x4ac7d1,SOLE=0xffffff,EYE=0x1778df,DARK=0x081d54,PINK=0xe27682;const head=new THREE.Group();g.add(head);sph(head,.70,SKIN,0,2.42,.03,1.02,.93,.9);sph(head,.76,HAIR,0,2.60,-.13,1.08,.91,.96);for(const [x,y,w,h]of[[-.48,2.67,.24,.52],[-.25,2.78,.27,.58],[0,2.82,.30,.62],[.25,2.78,.27,.58],[.48,2.67,.24,.52]])box(head,w,h,.20,HAIR2,x,y,.48);for(const x of[-.25,.25]){sph(head,.19,0xffffff,x,2.43,.66,1,.95,.28);sph(head,.145,EYE,x,2.42,.69,1,.95,.25);sph(head,.075,DARK,x,2.39,.715,1,.95,.23);sph(head,.04,0xffffff,x-.035,2.49,.73,1,.9,.2)}sph(head,.09,PINK,0,2.20,.69,1.2,.4,.22);const body=new THREE.Group();g.add(body);box(body,1.00,.68,.62,CYAN,0,1.47,0);box(body,1.06,.11,.65,CYAN2,0,1.79,0);box(body,1.08,.25,.70,WHITE,0,.98,0);box(body,1.10,.045,.72,CYAN2,0,1.08,0);const cv=document.createElement('canvas');cv.width=cv.height=128;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.font='900 88px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('S',64,68);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const frontLogo=new THREE.Mesh(new THREE.PlaneGeometry(.38,.46),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));add(body,frontLogo,0,1.50,.316);const backLogo=frontLogo.clone();backLogo.rotation.y=Math.PI;add(body,backLogo,0,1.50,-.316);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s]of[[armL,-1],[armR,1]]){sph(a,.20,CYAN,0,-.04,0,1,.95,.9);cyl(a,.15,.14,.38,CYAN,0,-.24,0);sph(a,.14,SKIN,0,-.48,.02,1,.9,.9);a.position.set(s*.64,1.57,0);a.rotation.z=s*.08;g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s]of[[legL,-1],[legR,1]]){cyl(l,.14,.13,.34,WHITE,0,-.03,0);box(l,.42,.23,.56,SHOE,0,-.30,.09);box(l,.44,.075,.59,SOLE,0,-.43,.09);box(l,.28,.07,.58,WHITE,0,-.22,.10);l.position.set(s*.27,.73,0);g.add(l)}for(const x of[-.58,.58])box(g,.16,.54,.27,HAIR,x,2.39,-.18);for(const x of[-.39,-.13,.14,.40])box(g,.24,.70,.24,HAIR,x,2.41,-.54);g.scale.setScalar(1.03);g.userData={armL,armR,legL,legR};return g}const player=makeStabi();world.add(player);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.55,24),new THREE.MeshBasicMaterial({color:0x00e5dc,transparent:true,opacity:.18}));shadow.rotation.x=-Math.PI/2;world.add(shadow);for(let r=-5;r<32;r++){const z=-r*TILE;const road=r>0&&r%3!==0;const tile=new THREE.Mesh(new THREE.BoxGeometry(WIDTH,.22,TILE-.03),mat(road?0x061923:(r%2?0x0a5756:0x0b6360)));tile.position.set(0,-.12,z);world.add(tile);if(road){for(let x=-12;x<13;x+=4.2){const dash=new THREE.Mesh(new THREE.BoxGeometry(1.5,.025,.06),mat(0x2d7780));dash.position.set(x,.02,z);world.add(dash)}}}const cars=[];for(let r=2;r<30;r++)if(r%3!==0){const dir=r%2?1:-1;for(let j=0;j<3;j++){const g=new THREE.Group();box(g,2.7,.55,1.15,j%2?0x6544af:0xc9363d,0,.45,0);box(g,1.0,.55,.95,j%2?0x301c61:0x781823,-dir*.18,.86,0);g.position.set((j-1)*10.5,.02,-r*TILE);world.add(g);cars.push({g,dir,v:2.8+(r%4)*.35})}}let gx=0,gr=0,moving=false,queued=null,hopStart=0,from=new THREE.Vector3(),to=new THREE.Vector3(),last=performance.now();function face(d){player.rotation.y=d==='up'?Math.PI:d==='left'?-Math.PI/2:d==='right'?Math.PI/2:0}function move(d){if(moving){queued=d;return}let nx=gx,nr=gr;if(d==='up')nr++;if(d==='down')nr--;if(d==='left')nx--;if(d==='right')nx++;if(nx<-HALF||nx>HALF||nr<0)return;face(d);gx=nx;gr=nr;moving=true;hopStart=performance.now();from.copy(player.position);to.set(gx*TILE,.2,-gr*TILE)}function loop(now){requestAnimationFrame(loop);const dt=Math.min(.034,(now-last)/1000||.016);last=now;for(const c of cars){c.g.position.x+=c.v*dt*c.dir;if(c.g.position.x>20)c.g.position.x=-20;if(c.g.position.x<-20)c.g.position.x=20}if(moving){const p=Math.min(1,(now-hopStart)/180),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,sw=Math.sin(p*Math.PI*2),u=player.userData;player.position.lerpVectors(from,to,s);player.position.y=.2+Math.sin(Math.PI*p)*.58;u.armL.rotation.x=sw*.5;u.armR.rotation.x=-sw*.5;u.legL.rotation.x=-sw*.4;u.legR.rotation.x=sw*.4;if(p>=1){moving=false;player.position.copy(to);u.armL.rotation.x=u.armR.rotation.x=u.legL.rotation.x=u.legR.rotation.x=0;if(queued){const q=queued;queued=null;move(q)}}}shadow.position.set(player.position.x,.02,player.position.z);camera.position.lerp(new THREE.Vector3(player.position.x+15,25,player.position.z+20),1-Math.exp(-dt*5));camera.lookAt(player.position.x,.5,player.position.z-7);renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();document.querySelectorAll('button[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.d)}));addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(k){e.preventDefault();move(k)}});player.position.set(0,.2,0);face('down');loop(performance.now());</script></body></html>
