<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crossy Stabi 2D Direction Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031922;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block}.tag{position:fixed;left:12px;top:10px;z-index:30;padding:8px 10px;border:1px solid #4ce9df;border-radius:9px;background:#03161ddd;color:#fff;font:900 11px monospace}.tag b{color:#5cf4ea}.hint{position:fixed;left:50%;bottom:12px;z-index:30;transform:translateX(-50%);padding:8px 11px;border:1px solid #2c837e;border-radius:9px;background:#031417dd;color:#b6e8e3;font:800 10px monospace;white-space:nowrap}.pad{position:fixed;left:14px;bottom:56px;z-index:31;width:150px;height:110px}.pad button{position:absolute;width:46px;height:42px;border:1px solid #4ce9df;border-radius:8px;background:#08242a;color:#fff;font-size:20px;font-weight:900}.up{left:52px;top:0}.left{left:0;top:52px}.down{left:52px;top:52px}.right{left:104px;top:52px}.player{position:fixed;z-index:25;width:auto;height:132px;object-fit:contain;object-position:center bottom;pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 8px 7px #0009);will-change:left,top,transform,opacity}.hidden{visibility:hidden;opacity:0}.shown{visibility:visible;opacity:1}#dot{position:fixed;z-index:24;width:42px;height:14px;border-radius:50%;background:#00e5dc33;filter:blur(4px);pointer-events:none;transform:translate(-50%,-50%)}@media(max-width:700px){.tag{font-size:9px}.hint{font-size:8px}.player{height:122px}.pad{transform:scale(.9);transform-origin:left bottom}}</style></head><body><img id="front" class="player shown" src="./assets/stabi-front-fixed.webp?v=dir9" alt="Stabi front"><img id="back" class="player hidden" src="./assets/stabi-sprite-back.webp?v=dir9" alt="Stabi back"><img id="side" class="player hidden" src="./assets/stabi-sprite-side.webp?v=dir9" alt="Stabi side"><div id="dot"></div><div class="tag">CROSSY STABI • <b>2D DIRECTION TEST V9</b></div><div class="hint">UP = back • DOWN = front • LEFT/RIGHT = side</div><div class="pad"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x031922);scene.fog=new THREE.Fog(0x031922,55,120);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.OrthographicCamera(-14,14,10,-10,.1,200);camera.position.set(17,24,22);scene.add(new THREE.HemisphereLight(0xc8fffb,0x021114,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-20,35,20);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);const TILE=3.1,HALF=4,WIDTH=28;function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.58,flatShading:true})}function box(g,w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}for(let r=-5;r<32;r++){const z=-r*TILE,road=r>0&&r%3!==0;box(world,WIDTH,.22,TILE-.03,road?0x061923:(r%2?0x0a5756:0x0b6360),0,-.12,z);if(road)for(let x=-12;x<13;x+=4.2)box(world,1.5,.025,.06,0x2d7780,x,.02,z)}const cars=[];for(let r=2;r<30;r++)if(r%3!==0){const dir=r%2?1:-1;for(let j=0;j<3;j++){const g=new THREE.Group();box(g,2.7,.55,1.15,j%2?0x6544af:0xc9363d,0,.45,0);box(g,1,.55,.95,j%2?0x301c61:0x781823,-dir*.18,.86,0);g.position.set((j-1)*10.5,.02,-r*TILE);world.add(g);cars.push({g,dir,v:2.8+(r%4)*.35})}}const playerPos=new THREE.Vector3(0,.2,0),screenPos=new THREE.Vector3();let gx=0,gr=0,moving=false,queued=null,hopStart=0,from=new THREE.Vector3(),to=new THREE.Vector3(),last=performance.now(),facing='down';const front=document.getElementById('front'),back=document.getElementById('back'),side=document.getElementById('side'),dot=document.getElementById('dot');const all=[front,back,side];let active=front;for(const el of all){el.decoding='sync';el.loading='eager'}function setTransform(rot=0,bob=0){const flip=(facing==='right')?-1:1;active.style.transform=`translate(-50%,-100%) translateY(${bob}px) rotate(${rot}deg) scaleX(${flip})`}function face(d){facing=d;for(const el of all){el.classList.remove('shown');el.classList.add('hidden');el.style.transform='translate(-50%,-100%)'}active=d==='up'?back:d==='down'?front:side;active.classList.remove('hidden');active.classList.add('shown');setTransform()}function move(d){if(moving){queued=d;return}let nx=gx,nr=gr;if(d==='up')nr++;if(d==='down')nr--;if(d==='left')nx--;if(d==='right')nx++;if(nx<-HALF||nx>HALF||nr<0)return;face(d);gx=nx;gr=nr;moving=true;hopStart=performance.now();from.copy(playerPos);to.set(gx*TILE,.2,-gr*TILE)}function project(){screenPos.copy(playerPos);screenPos.y+=.12;screenPos.project(camera);const x=(screenPos.x*.5+.5)*innerWidth,y=(-screenPos.y*.5+.5)*innerHeight;for(const el of all){el.style.left=x+'px';el.style.top=y+'px'}dot.style.left=x+'px';dot.style.top=(y+3)+'px'}function loop(now){requestAnimationFrame(loop);const dt=Math.min(.034,(now-last)/1000||.016);last=now;for(const c of cars){c.g.position.x+=c.v*dt*c.dir;if(c.g.position.x>20)c.g.position.x=-20;if(c.g.position.x<-20)c.g.position.x=20}if(moving){const p=Math.min(1,(now-hopStart)/180),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;playerPos.lerpVectors(from,to,s);playerPos.y=.2+Math.sin(Math.PI*p)*.58;setTransform(Math.sin(p*Math.PI*2)*2.5,0);if(p>=1){moving=false;playerPos.copy(to);setTransform();if(queued){const q=queued;queued=null;move(q)}}}else setTransform(0,Math.sin(now*.004)*-2);camera.position.lerp(new THREE.Vector3(playerPos.x+15,25,playerPos.z+20),1-Math.exp(-dt*5));camera.lookAt(playerPos.x,.5,playerPos.z-7);renderer.render(scene,camera);project()}function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();document.querySelectorAll('button[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.d)}));addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(k){e.preventDefault();move(k)}});face('down');project();loop(performance.now());</script></body></html>
