<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stabi 2D Character Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 28%,#123c48 0,#061a25 45%,#020b12 100%);font-family:Arial;color:#eafffb}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:16px;top:14px;padding:10px 12px;border:1px solid #35e8dd;border-radius:10px;background:#03161ddd;font:900 12px monospace}.tag b{color:#63f2e9}.badge{position:absolute;right:16px;top:14px;padding:8px 10px;border:1px solid #286a7a;border-radius:9px;background:#03141ddd;color:#9be8ee;font:800 10px monospace}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 13px;border:1px solid #277f85;border-radius:9px;background:#021217dd;color:#9cd8db;font:700 11px monospace;white-space:nowrap}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:900px}.halo{position:absolute;width:min(70vw,460px);aspect-ratio:1;border-radius:50%;border:1px solid #2be2d9;box-shadow:0 0 45px #1fd8cf33,inset 0 0 45px #1fd8cf22;transform:rotateX(70deg) translateY(190px)}.char{position:relative;width:min(52vw,330px);height:min(70vh,560px);display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 20px 22px #0009);animation:bob 1.2s ease-in-out infinite}.char img{display:block;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom}.shadow{position:absolute;bottom:4%;width:48%;height:5%;border-radius:50%;background:#0008;filter:blur(8px)}@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.01)}}@media(max-width:600px){.char{width:64vw;height:60vh}.halo{width:78vw;transform:rotateX(70deg) translateY(155px)}} </style></head><body><div class="stage"><div class="halo"></div><div class="char"><div class="shadow"></div><img id="stabi" src="assets/stabi-front-fixed.webp" alt="Stabi 2D" onerror="this.onerror=null;this.src='assets/stabi-front-cutout.webp'"></div></div><div class="ui"><div class="tag">STABI <b>2D TEST</b></div><div class="badge">GAMEPLAY SPRITE PREVIEW</div><div class="hint">2D mascot • transparent sprite • gameplay-ready preview</div></div></body></html>
