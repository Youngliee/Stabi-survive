<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus 512px Portrait Test</title></head><body style="margin:0;background:#031214"><script>
(async()=>{try{
 const sourceUrl='assets/maps/nexus-portrait-941x1672-q80.webp?v=nexus-512-bg2';
 const source=await new Promise((ok,fail)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>fail(new Error('Nexus source map failed'));im.src=sourceUrl});
 const map512=document.createElement('canvas');map512.width=512;map512.height=910;const mc=map512.getContext('2d');mc.imageSmoothingEnabled=true;mc.imageSmoothingQuality='high';mc.drawImage(source,0,0,512,910);
 const blob=await new Promise((ok,fail)=>map512.toBlob(b=>b?ok(b):fail(new Error('512 map encode failed')),'image/webp',0.92));
 const mapObjectUrl=URL.createObjectURL(blob);
 const r=await fetch('play-fixed-base.html?v=nexus-512-bg2-base',{cache:'no-store'});if(!r.ok)throw new Error('Base '+r.status);let src=await r.text();
 const re=/async function loadStaticMap\(\)\{[\s\S]*?\n\}\nloadStaticMap\(\)\.catch\(\(\)=>\{window\.__STABI_MAP_READY__=false\}\);/;
 if(!re.test(src))throw new Error('Static map marker');
 const bgValue='url("'+mapObjectUrl+'")';
 const loader="async function loadStaticMap(){document.documentElement.style.background='transparent';document.body.style.backgroundColor='#031214';document.body.style.backgroundImage="+JSON.stringify(bgValue)+";document.body.style.backgroundPosition='center';document.body.style.backgroundSize='cover';document.body.style.backgroundRepeat='no-repeat';document.body.style.backgroundAttachment='fixed';window.__STABI_MAP_READY__=true}\nloadStaticMap().catch(()=>{window.__STABI_MAP_READY__=false});";
 src=src.replace(re,loader);
 document.open();document.write(src);document.close();
}catch(e){document.body.innerHTML='<pre style="color:#9ff;padding:18px;font-family:monospace;white-space:pre-wrap">Nexus 512px portrait test error: '+e.message+'</pre>'}})();
</script></body></html>
