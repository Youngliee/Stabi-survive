<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus Direct Runtime</title></head><body style="margin:0;background:#031214"><script>
(async()=>{try{
 let b64='';
 for(let i=0;i<10;i++){
   const n=String(i).padStart(2,'0');
   const r=await fetch('assets/maps/stabilizer-nexus-map-'+n+'.b64?v=nexus-textconcat4',{cache:'no-store'});
   if(!r.ok)throw new Error('Map part '+n+' '+r.status);
   b64+=(await r.text()).replace(/\s+/g,'');
 }
 if(!b64.startsWith('UklG'))throw new Error('Map source header invalid');
 const bin=atob(b64),u=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const mapUrl=URL.createObjectURL(new Blob([u],{type:'image/webp'}));
 await new Promise((ok,fail)=>{const im=new Image();im.onload=ok;im.onerror=()=>fail(new Error('Final Nexus map image invalid'));im.src=mapUrl});
 const r=await fetch('play-logo-bg-runtime.html?v=nexus-textconcat4-base',{cache:'no-store'});if(!r.ok)throw new Error('Runtime '+r.status);let src=await r.text();
 const old='assets/logo.webp?v=20260905-logobg1';
 if(!src.includes(old))throw new Error('Background marker missing');
 src=src.replace(old,mapUrl);
 src=src.replace("document.body.style.backgroundSize='contain';","document.body.style.backgroundSize='cover';");
 src=src.replace("document.body.style.backgroundAttachment='fixed';","document.body.style.backgroundAttachment='scroll';");
 src=src.replace("document.body.style.backgroundPosition='center center';","document.body.style.backgroundPosition='center center';");
 document.open();document.write(src);document.close();
}catch(e){document.body.innerHTML='<pre style="color:#9ff;padding:18px;font-family:monospace;white-space:pre-wrap">Nexus direct test error: '+e.message+'</pre>'}})();
</script></body></html>
