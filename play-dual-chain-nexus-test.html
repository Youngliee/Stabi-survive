<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus Portrait Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}#host{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="host" src="play-logo-bg-test.html?v=nexus-fullchunks2" title="Stabi Survive Nexus Portrait Test" allow="autoplay"></iframe><script>(()=>{const host=document.getElementById('host');let mapUrl='';let mapReady=false;async function loadMap(){let b='',count=0;for(let i=0;i<40;i++){const n=String(i).padStart(2,'0');const r=await fetch('assets/maps/stabilizer-nexus-map-'+n+'.b64?v=fullchunks2',{cache:'no-store'});if(!r.ok){if(i===0)throw new Error('no map chunks');break}const t=(await r.text()).trim();if(!t)break;b+=t;count++}if(count<2)throw new Error('incomplete map chunks: '+count);const url='data:image/webp;base64,'+b;await new Promise((ok,fail)=>{const im=new Image();im.onload=()=>ok();im.onerror=()=>fail(new Error('decoded map invalid'));im.src=url});mapUrl=url;mapReady=true;apply()}function apply(){try{const shell=host.contentDocument;if(!shell)return false;const game=shell.getElementById('game');if(!game)return false;const d=game.contentDocument;if(!d||!d.body)return false;d.documentElement.style.background='#031214';d.body.style.backgroundColor='#031214';if(mapReady){d.body.style.backgroundImage='linear-gradient(rgba(0,12,15,.035),rgba(0,12,15,.035)),url("'+mapUrl+'")';d.body.style.backgroundSize='cover';d.body.style.backgroundPosition='center center';d.body.style.backgroundRepeat='no-repeat';d.body.style.backgroundAttachment='scroll'}d.body.dataset.nexusFullChunks=mapReady?'ready':'loading';return true}catch(_){return false}}host.addEventListener('load',()=>setTimeout(apply,120));setInterval(apply,250);loadMap().catch(e=>console.error('Nexus full map failed',e))})();</script></body></html>
