<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus Portrait Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}#host{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="host" src="play-logo-bg-test.html?v=nexus-real-map1" title="Stabi Survive Nexus Portrait Test" allow="autoplay"></iframe><script>(()=>{const host=document.getElementById('host');let mapUrl='';let mapReady=false;async function loadMap(){let b='';for(let i=0;i<4;i++){const n=String(i).padStart(2,'0');const r=await fetch('assets/maps/nexus-real-'+n+'.b64?v=realmap1',{cache:'no-store'});if(!r.ok)throw new Error('chunk '+n+' '+r.status);b+=(await r.text()).trim()}const url='data:image/webp;base64,'+b;await new Promise((ok,fail)=>{const im=new Image();im.onload=ok;im.onerror=fail;im.src=url});mapUrl=url;mapReady=true;apply()}function apply(){try{const shell=host.contentDocument;if(!shell)return false;const game=shell.getElementById('game');if(!game)return false;const d=game.contentDocument;if(!d||!d.body)return false;d.documentElement.style.background='#031214';d.body.style.backgroundColor='#031214';if(mapReady){d.body.style.backgroundImage='linear-gradient(rgba(0,12,15,.04),rgba(0,12,15,.04)),url("'+mapUrl+'")';d.body.style.backgroundSize='cover';d.body.style.backgroundPosition='center center';d.body.style.backgroundRepeat='no-repeat';d.body.style.backgroundAttachment='scroll'}d.body.dataset.nexusRealMap=mapReady?'ready':'loading';return true}catch(_){return false}}host.addEventListener('load',()=>setTimeout(apply,120));setInterval(apply,250);loadMap().catch(e=>console.error('Nexus verified map failed',e))})();</script></body></html>
