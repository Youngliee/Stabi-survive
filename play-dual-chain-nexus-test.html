<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus Portrait Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}#host{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="host" src="play-logo-bg-test.html?v=nexus-direct-9beddc8" title="Stabi Survive Nexus Portrait Test" allow="autoplay"></iframe><script>(()=>{const host=document.getElementById('host');const map='assets/maps/dual-chain-nexus-portrait-test.webp?v=9beddc8';let ready=false;const pre=new Image();pre.onload=()=>{ready=true;apply()};pre.onerror=()=>console.error('Nexus portrait map failed to load');pre.src=map;function apply(){try{const shell=host.contentDocument;if(!shell)return false;const game=shell.getElementById('game');if(!game)return false;const d=game.contentDocument;if(!d||!d.body)return false;d.documentElement.style.background='#031214';d.body.style.backgroundColor='#031214';if(ready){d.body.style.backgroundImage='linear-gradient(rgba(0,12,15,.04),rgba(0,12,15,.04)),url("'+map+'")';d.body.style.backgroundSize='cover';d.body.style.backgroundPosition='center center';d.body.style.backgroundRepeat='no-repeat';d.body.style.backgroundAttachment='scroll'}d.body.dataset.nexusPortraitDirect='1';return true}catch(_){return false}}host.addEventListener('load',()=>setTimeout(apply,120));setInterval(apply,250)})();</script></body></html>
