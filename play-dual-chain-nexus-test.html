<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus Map Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}#host{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="host" src="play-logo-bg-test.html?v=nexus-map-chunks1" title="Stabi Survive Nexus Map Test" allow="autoplay"></iframe><script>(()=>{const host=document.getElementById('host');let mapUrl='';async function loadMap(){let b='';for(let i=0;i<10;i++){const n=String(i).padStart(2,'0');const r=await fetch('assets/maps/stabilizer-nexus-map-'+n+'.b64?v=chunkmap1',{cache:'no-store'});if(!r.ok)throw new Error('map chunk '+n);b+=(await r.text()).trim()}mapUrl='data:image/webp;base64,'+b;apply()}function apply(){try{const shell=host.contentDocument;if(!shell)return false;const game=shell.getElementById('game');if(!game)return false;const d=game.contentDocument;if(!d||!d.body)return false;d.documentElement.style.background='#031214';d.body.style.backgroundColor='#031214';if(mapUrl)d.body.style.backgroundImage='linear-gradient(rgba(0,12,15,.05),rgba(0,12,15,.05)),url("'+mapUrl+'")';d.body.style.backgroundSize='cover';d.body.style.backgroundPosition='center center';d.body.style.backgroundRepeat='no-repeat';d.body.style.backgroundAttachment='fixed';d.body.dataset.nexusChunkMap='1';return true}catch(_){return false}}host.addEventListener('load',()=>setTimeout(apply,120));setInterval(apply,300);loadMap().catch(e=>console.error('Nexus map load failed',e))})();</script></body></html>
