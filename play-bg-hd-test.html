<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • HD BG Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061718}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="shell" src="play-game-shell.html?v=3a9d8bd" title="Stabi Survive HD Background Test"></iframe><script>(async()=>{try{const r=await fetch('assets/maps/nexus-hd-test.b64?v=f9817e5');if(!r.ok)throw new Error('BG '+r.status);const raw=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');const bg='data:image/webp;base64,'+raw;const shell=document.getElementById('shell');function patch(){try{const sd=shell.contentDocument;if(!sd)return;const g=sd.getElementById('game');if(!g||!g.contentWindow||!g.contentDocument)return;const w=g.contentWindow,d=g.contentDocument;if(!d.body)return;d.documentElement.style.background='#061718';d.body.style.backgroundImage='url("'+bg+'")';d.body.style.backgroundSize='cover';d.body.style.backgroundPosition='center';d.body.style.backgroundRepeat='no-repeat';d.body.style.backgroundColor='#061718';const cv=d.querySelector('canvas');if(cv)cv.style.background='transparent';try{w.eval("bg=function(){ctx.clearRect(0,0,W(),H())}")}catch(e){}window.__BG_PATCH_OK__=true}catch(e){}}shell.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,900);setTimeout(patch,1800)});setInterval(patch,1000)}catch(e){document.body.innerHTML='<pre style="color:#fff;padding:18px">BG test error: '+e.message+'</pre>'}})();</script></body></html>
