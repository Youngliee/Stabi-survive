<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crossy Stabi Loading Mascot Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03100f;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(108,211,195,.18),transparent 34%),linear-gradient(180deg,#071c1b,#020b0b);color:#effffc}.stage{position:relative;width:min(78vw,390px);aspect-ratio:1}.ring,.ring2,.ring3{position:absolute;border-radius:50%;inset:0;border:2px solid rgba(108,211,195,.32);box-shadow:0 0 45px rgba(108,211,195,.17),inset 0 0 45px rgba(108,211,195,.08)}.ring:before{content:"";position:absolute;inset:-3px;border-radius:50%;border-top:3px solid #7af3e4;border-right:3px solid transparent;border-bottom:3px solid transparent;border-left:3px solid transparent;animation:spin 1.4s linear infinite;filter:drop-shadow(0 0 7px #7af3e4)}.ring2{inset:28px;border-style:dashed;animation:spinBack 7s linear infinite}.ring3{inset:62px;border-color:rgba(255,215,95,.22);animation:pulse 1.8s ease-in-out infinite alternate}.mascot{position:absolute;inset:8% 14% 6%;display:flex;align-items:center;justify-content:center;z-index:2}.mascot img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(0,0,0,.68)) drop-shadow(0 0 22px rgba(108,211,195,.38));animation:bob 1.25s ease-in-out infinite alternate}.label{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);text-align:center;white-space:nowrap}.title{font-size:12px;font-weight:1000;letter-spacing:.16em;color:#b0ffef}.sub{margin-top:8px;font-size:9px;color:#6faaa1;letter-spacing:.12em}.dots:after{content:"";animation:dots 1.4s steps(4,end) infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}@keyframes pulse{to{transform:scale(1.035);opacity:.62}}@keyframes bob{to{transform:translateY(-9px)}}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}@media(max-width:520px){.stage{width:min(74vw,310px)}.ring2{inset:22px}.ring3{inset:50px}.label{bottom:-58px}.mascot{inset:7% 12% 5%}}</style></head><body><div class="loader"><div class="stage"><div class="ring"></div><div class="ring2"></div><div class="ring3"></div><div class="mascot"><img src="./assets/stabi-front-fixed.webp?v=loader1" alt="Stabi mascot" onerror="this.onerror=null;this.src='./assets/stabi-voxel.webp?v=loader1'"></div><div class="label"><div class="title">CROSSY STABI</div><div class="sub">ENTERING STABILITY FRONTIER<span class="dots"></span></div></div></div></div></body></html>
