<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crossy Stabi</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031922;font-family:Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.topBtn{position:fixed;z-index:30;left:12px;top:72px;border:1px solid #52e7df;background:#03161ddd;color:#fff;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.panel{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;background:#031922e8;padding:16px}.card{width:min(440px,94vw);max-height:88vh;overflow:auto;padding:22px;border:1px solid #39ddd5;border-radius:18px;background:#061820;color:#fff;text-align:center}.card h2{margin:0 0 8px}.accent{color:#4ee8df}.score{font-size:18px;font-weight:900;margin:10px 0}.row{display:flex;gap:8px;margin:10px 0}.row input{flex:1;min-width:0;padding:12px;border-radius:9px;border:1px solid #416c70;background:#03161d;color:#fff;font-size:16px}.btn{padding:11px 14px;border-radius:9px;border:1px solid #8ff5ee;background:#4ce2d8;color:#042125;font-weight:1000;cursor:pointer}.btn.alt{background:#111f27;color:#fff;border-color:#446b72}.btn.x{background:#050505;color:#fff;border-color:#666}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.board{margin-top:14px;text-align:left;border-top:1px solid #21444a;padding-top:10px}.entry{display:grid;grid-template-columns:36px 1fr auto;gap:8px;padding:8px 4px;border-bottom:1px solid #17343a;align-items:center}.entry b{color:#7ff3ec}.small{font-size:11px;color:#9ab8bc;line-height:1.45}.badge{display:inline-block;margin:4px 0 8px;padding:5px 8px;border-radius:999px;background:#0d2d31;color:#7ff3ec;font-size:10px;font-weight:900}</style></head><body><iframe id="gameFrame" src="crossy-stabi-playtest.html" title="Crossy Stabi game"></iframe><button id="boardBtn" class="topBtn">🏆 LEADERBOARD</button><section id="scorePanel" class="panel"><div class="card"><div class="badge">RUN COMPLETE</div><h2>CROSSY <span class="accent">STABI</span></h2><div id="runScore" class="score">Distance: 0m • USDZ: 0</div><div class="row"><input id="playerName" maxlength="16" placeholder="Player name"><button id="saveScore" class="btn">SAVE</button></div><div class="actions"><button id="shareX" class="btn x">𝕏 SHARE SCORE</button><button id="playAgain" class="btn">RUN AGAIN</button><button id="closeScore" class="btn alt">CLOSE</button></div><div class="small" style="margin-top:12px">Scores are saved on this device for now. Global real-time sync activates after Supabase is connected.</div><div id="scoreBoard" class="board"></div></div></section><section id="boardPanel" class="panel"><div class="card"><div class="badge">TOP PLAYERS</div><h2>🏆 LEADERBOARD</h2><div id="boardOnly" class="board"></div><div class="actions"><button id="closeBoard" class="btn alt">CLOSE</button></div></div></section><script>(()=>{const frame=document.getElementById('gameFrame'),scorePanel=document.getElementById('scorePanel'),boardPanel=document.getElementById('boardPanel'),runScore=document.getElementById('runScore'),nameInput=document.getElementById('playerName');let lastDistance=0,lastUSDZ=0,lastSeen='';const KEY='crossy_stabi_scores_v1';function scores(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveScores(v){localStorage.setItem(KEY,JSON.stringify(v.slice(0,50)))}function cleanName(v){return(v||'Player').replace(/[^a-zA-Z0-9_\- ]/g,'').trim().slice(0,16)||'Player'}function render(target){const data=scores().sort((a,b)=>b.distance-a.distance||b.usdz-a.usdz).slice(0,10);target.innerHTML=data.length?data.map((s,i)=>`<div class="entry"><b>#${i+1}</b><span>${escapeHtml(s.name)}</span><strong>${s.distance}m · ${s.usdz} USDZ</strong></div>`).join(''):'<div class="small">No scores yet. Finish a run and be the first.</div>'}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function openResult(d,u){lastDistance=d;lastUSDZ=u;runScore.textContent=`Distance: ${d}m • USDZ: ${u}`;scorePanel.style.display='flex';render(document.getElementById('scoreBoard'))}function inspect(){try{const doc=frame.contentDocument;if(!doc)return;const result=doc.getElementById('result'),text=doc.getElementById('resultText');if(result&&text&&getComputedStyle(result).display==='flex'){const t=text.textContent||'';if(t&&t!==lastSeen){lastSeen=t;const d=Number((t.match(/Distance:\s*(\d+)m/i)||[])[1]||0),u=Number((t.match(/USDZ:\s*(\d+)/i)||[])[1]||0);openResult(d,u)}}else if(result&&getComputedStyle(result).display!=='flex'){lastSeen=''}}catch{}requestAnimationFrame(inspect)}frame.addEventListener('load',()=>requestAnimationFrame(inspect));document.getElementById('saveScore').onclick=()=>{const name=cleanName(nameInput.value);nameInput.value=name;const data=scores();data.push({name,distance:lastDistance,usdz:lastUSDZ,ts:Date.now()});data.sort((a,b)=>b.distance-a.distance||b.usdz-a.usdz);saveScores(data);render(document.getElementById('scoreBoard'));render(document.getElementById('boardOnly'));document.getElementById('saveScore').textContent='SAVED ✓';setTimeout(()=>document.getElementById('saveScore').textContent='SAVE',900)};document.getElementById('shareX').onclick=()=>{const gameUrl=location.origin+location.pathname.replace(/play\.html$/,'');const text=`I survived the Stability Frontier ⚡\n🏁 Distance: ${lastDistance}m\n💰 USDZ: ${lastUSDZ}\n\nCan you beat my score?\nCrossy Stabi — built for Stabilizer`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(gameUrl),'_blank','noopener,noreferrer')};document.getElementById('playAgain').onclick=()=>{scorePanel.style.display='none';try{frame.contentDocument.getElementById('again').click()}catch{frame.contentWindow.location.reload()}};document.getElementById('closeScore').onclick=()=>scorePanel.style.display='none';document.getElementById('boardBtn').onclick=()=>{render(document.getElementById('boardOnly'));boardPanel.style.display='flex'};document.getElementById('closeBoard').onclick=()=>boardPanel.style.display='none';render(document.getElementById('boardOnly'));})();</script></body></html>
