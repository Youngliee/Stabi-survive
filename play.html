<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stabi Survive 2D - Test</title>
<style>
:root {
  --bg:#071919; --panel:#0c2d2d; --line:#4fb7b2; --text:#f4ffff; --muted:#a8c9c6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(circle at top,#103b3a,#061414 65%);font-family:Arial,Helvetica,sans-serif;color:var(--text);overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
#gameShell{position:relative;width:min(100vw,1100px);height:min(100vh,700px);border:1px solid #2f7773;border-radius:20px;overflow:hidden;background:#0a2222;box-shadow:0 20px 80px #0008}
canvas{width:100%;height:100%;display:block;background:linear-gradient(#103333,#0b2626)}
#hud{position:absolute;inset:14px 14px auto 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.hudbox{background:#071919cc;border:1px solid #3e8e89;border-radius:13px;padding:9px 12px;backdrop-filter:blur(6px);font-weight:700}
#hpWrap{min-width:220px}
#hpBar{height:12px;background:#213; border-radius:999px;overflow:hidden;margin-top:6px;border:1px solid #ffffff22}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#8ff0d2,#37b68d)}
#start,#gameover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#031010dd,#061d1de8);z-index:10}
.card{width:min(92%,520px);padding:28px;border-radius:24px;background:#0a2b2be8;border:1px solid #4b9b96;text-align:center;box-shadow:0 20px 60px #0008}
.logo{width:76px;height:76px;object-fit:contain;margin-bottom:8px}
h1{margin:6px 0 6px;font-size:clamp(32px,7vw,56px)}
p{color:var(--muted);line-height:1.45}
input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #417d79;background:#061d1d;color:white;font-size:16px;outline:none;margin:12px 0}
button{border:0;border-radius:13px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer}
.primary{background:#69c3bd;color:#06201e;width:100%}
.secondary{background:#173b3a;color:#dffffb;margin-top:9px;width:100%}
#gameover{display:none}
#mobileControls{position:absolute;left:16px;right:16px;bottom:16px;display:none;justify-content:space-between;align-items:flex-end;z-index:5}
.dpad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px}
.ctrl{width:58px;height:58px;border-radius:16px;background:#0a2222cc;color:white;border:1px solid #5aa9a5;font-size:23px;padding:0;touch-action:none}
.attack{width:78px;height:78px;border-radius:50%;background:#9f3f3fcc;border:1px solid #ff7777;color:#fff}
#tip{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#a7c8c5;background:#061919aa;padding:7px 10px;border-radius:10px;pointer-events:none}
@media (max-width:800px), (pointer:coarse) {
  #mobileControls{display:flex}
  #tip{display:none}
  #hud{font-size:12px}
  #hpWrap{min-width:150px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="gameShell">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hudbox" id="hpWrap">❤️ HP <span id="hpText">100</span>
        <div id="hpBar"><div id="hpFill"></div></div>
      </div>
      <div class="hudbox">🪙 <span id="coinText">0</span></div>
      <div class="hudbox">⏱ <span id="timeText">0</span>s</div>
    </div>

    <div id="start">
      <div class="card">
        <img class="logo" src="assets/logo.webp" alt="Stabilizer">
        <h1>Stabi Survive 2D</h1>
        <p>Survive the red enemies, collect coins, and face the boss.</p>
        <input id="nameInput" maxlength="16" placeholder="Player name" value="Zarrr">
        <button class="primary" id="playBtn">PLAY TEST</button>
        <button class="secondary" id="howBtn">HOW TO PLAY</button>
        <p id="howText" style="display:none;margin-bottom:0">Desktop: WASD / arrow keys. Mobile: use the direction buttons. Avoid enemies, collect coins, and survive until the boss appears.</p>
      </div>
    </div>

    <div id="gameover">
      <div class="card">
        <h1>Game Over</h1>
        <p id="resultText"></p>
        <button class="primary" id="restartBtn">RESTART</button>
      </div>
    </div>

    <div id="mobileControls">
      <div class="dpad">
        <span></span><button class="ctrl" data-key="up">▲</button><span></span>
        <button class="ctrl" data-key="left">◀</button><span></span><button class="ctrl" data-key="right">▶</button>
        <span></span><button class="ctrl" data-key="down">▼</button><span></span>
      </div>
      <button class="ctrl attack" id="dashBtn">DASH</button>
    </div>
    <div id="tip">Move: WASD / Arrows • Collect coins • Boss appears at 30s</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const shell = document.getElementById('gameShell');

function resize(){
  const r = shell.getBoundingClientRect();
  canvas.width = Math.max(640, Math.floor(r.width*devicePixelRatio));
  canvas.height = Math.max(420, Math.floor(r.height*devicePixelRatio));
}
addEventListener('resize', resize); resize();

const IMG = {};
function load(name,src){ const i=new Image(); i.src=src; IMG[name]=i; }
load('stabi', 'assets/stabi.webp');
load('coin', 'assets/coin.webp');
load('enemy', 'assets/enemy.webp');
load('boss', 'assets/boss.webp');

let running=false, last=0, elapsed=0, spawnTimer=0, coinTimer=0, bossSpawned=false;
let playerName='Player';
const keys={up:false,down:false,left:false,right:false};
const enemies=[], coins=[], bosses=[];

const player={x:320,y:240,r:30,hp:100,coins:0,speed:250,inv:0,dash:0};

function W(){return canvas.width/devicePixelRatio}
function H(){return canvas.height/devicePixelRatio}
function resetGame(){
  elapsed=0; spawnTimer=0; coinTimer=0; bossSpawned=false;
  enemies.length=0; coins.length=0; bosses.length=0;
  player.x=W()/2; player.y=H()/2; player.hp=100; player.coins=0; player.inv=0; player.dash=0;
  document.getElementById('hpText').textContent='100';
  document.getElementById('coinText').textContent='0';
  document.getElementById('timeText').textContent='0';
  document.getElementById('hpFill').style.width='100%';
}

function spawnEnemy(){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W();y=-40}
  if(edge===1){x=W()+40;y=Math.random()*H()}
  if(edge===2){x=Math.random()*W();y=H()+40}
  if(edge===3){x=-40;y=Math.random()*H()}
  enemies.push({x,y,r:24,speed:85+Math.min(elapsed*1.4,80),frame:0});
}
function spawnCoin(){
  coins.push({x:60+Math.random()*(W()-120),y:80+Math.random()*(H()-150),r:16,t:0});
}
function spawnBoss(){
  bosses.push({x:W()/2,y:-80,r:52,hp:250,speed:60});
  bossSpawned=true;
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function update(dt){
  elapsed+=dt;
  spawnTimer+=dt; coinTimer+=dt;
  player.inv=Math.max(0,player.inv-dt);
  player.dash=Math.max(0,player.dash-dt);

  const dx=(keys.right?1:0)-(keys.left?1:0);
  const dy=(keys.down?1:0)-(keys.up?1:0);
  const len=Math.hypot(dx,dy)||1;
  const mul=player.dash>0?2.25:1;
  player.x += dx/len*player.speed*mul*dt;
  player.y += dy/len*player.speed*mul*dt;
  player.x=clamp(player.x,35,W()-35); player.y=clamp(player.y,70,H()-35);

  const spawnRate=Math.max(.38,1.15-elapsed*.012);
  if(spawnTimer>spawnRate){ spawnTimer=0; spawnEnemy(); }
  if(coinTimer>2.2){ coinTimer=0; if(coins.length<6)spawnCoin(); }
  if(elapsed>30 && !bossSpawned) spawnBoss();

  for(const e of enemies){
    let vx=player.x-e.x, vy=player.y-e.y, l=Math.hypot(vx,vy)||1;
    e.x+=vx/l*e.speed*dt; e.y+=vy/l*e.speed*dt;
    e.frame += dt*6;
    if(dist(player,e)<player.r+e.r && player.inv<=0){
      player.hp-=12; player.inv=.7;
    }
  }
  for(const b of bosses){
    let vx=player.x-b.x, vy=player.y-b.y, l=Math.hypot(vx,vy)||1;
    b.x+=vx/l*b.speed*dt; b.y+=vy/l*b.speed*dt;
    if(dist(player,b)<player.r+b.r && player.inv<=0){
      player.hp-=24; player.inv=.9;
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i]; c.t+=dt;
    if(dist(player,c)<player.r+c.r+4){
      player.coins++; coins.splice(i,1);
    }
  }
  document.getElementById('hpText').textContent=Math.max(0,Math.ceil(player.hp));
  document.getElementById('coinText').textContent=player.coins;
  document.getElementById('timeText').textContent=Math.floor(elapsed);
  document.getElementById('hpFill').style.width=Math.max(0,player.hp)+'%';

  if(player.hp<=0) endGame();
}

function drawBg(){
  const w=W(),h=H();
  ctx.save(); ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.fillStyle='#0b2626';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#184a48';ctx.lineWidth=1;
  const grid=52;
  for(let x=0;x<w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  const g=ctx.createRadialGradient(w/2,h/2,30,w/2,h/2,Math.max(w,h)*.7);
  g.addColorStop(0,'#13413f00');g.addColorStop(1,'#00000055');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.restore();
}
function circleImage(img,x,y,r,sourceCrop=null){
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  if(sourceCrop){
    const [sx,sy,sw,sh]=sourceCrop;
    ctx.drawImage(img,sx,sy,sw,sh,x-r,y-r,r*2,r*2);
  } else {
    ctx.drawImage(img,x-r,y-r,r*2,r*2);
  }
  ctx.restore();
}
function render(){
  drawBg();
  ctx.save(); ctx.scale(devicePixelRatio,devicePixelRatio);

  for(const c of coins){
    const bob=Math.sin(c.t*4)*3;
    ctx.shadowColor='#7cd4cb';ctx.shadowBlur=15;
    circleImage(IMG.coin,c.x,c.y+bob,c.r);
    ctx.shadowBlur=0;
  }

  for(const e of enemies){
    circleImage(IMG.enemy,e.x,e.y,e.r);
  }

  for(const b of bosses){
    ctx.shadowColor='#ff3535';ctx.shadowBlur=24;
    circleImage(IMG.boss,b.x,b.y,b.r);
    ctx.shadowBlur=0;
    ctx.fillStyle='#220';ctx.fillRect(b.x-50,b.y-b.r-18,100,8);
    ctx.fillStyle='#d64d4d';ctx.fillRect(b.x-50,b.y-b.r-18,100*(b.hp/250),8);
  }

  ctx.globalAlpha=player.inv>0 && Math.floor(player.inv*12)%2===0 ? .35 : 1;
  ctx.shadowColor='#89ded5';ctx.shadowBlur=18;
  circleImage(IMG.stabi,player.x,player.y,player.r+4);
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  ctx.fillStyle='#ffffff';ctx.font='700 13px Arial';ctx.textAlign='center';
  ctx.fillText(playerName,player.x,player.y+player.r+20);

  if(bossSpawned){
    ctx.fillStyle='#ffdede';ctx.font='800 20px Arial';ctx.fillText('BOSS WAVE',W()/2,55);
  }
  ctx.restore();
}

function loop(ts){
  if(!running)return;
  if(!last)last=ts;
  const dt=Math.min(.033,(ts-last)/1000); last=ts;
  update(dt); render(); requestAnimationFrame(loop);
}

function startGame(){
  playerName=(document.getElementById('nameInput').value||'Player').trim().slice(0,16);
  document.getElementById('start').style.display='none';
  document.getElementById('gameover').style.display='none';
  resetGame(); running=true; last=0; requestAnimationFrame(loop);
}
function endGame(){
  running=false;
  document.getElementById('resultText').innerHTML =
    `<b>${playerName}</b><br>Survived: ${Math.floor(elapsed)}s<br>Coins: ${player.coins}`;
  document.getElementById('gameover').style.display='flex';
}

document.getElementById('playBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.getElementById('howBtn').onclick=()=>{
  const h=document.getElementById('howText'); h.style.display=h.style.display==='none'?'block':'none';
};

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup')keys.up=true;
  if(k==='s'||k==='arrowdown')keys.down=true;
  if(k==='a'||k==='arrowleft')keys.left=true;
  if(k==='d'||k==='arrowright')keys.right=true;
  if(k===' ' && running)player.dash=.18;
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup')keys.up=false;
  if(k==='s'||k==='arrowdown')keys.down=false;
  if(k==='a'||k==='arrowleft')keys.left=false;
  if(k==='d'||k==='arrowright')keys.right=false;
});

document.querySelectorAll('[data-key]').forEach(btn=>{
  const key=btn.dataset.key;
  const on=e=>{e.preventDefault();keys[key]=true};
  const off=e=>{e.preventDefault();keys[key]=false};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
});
document.getElementById('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();player.dash=.18});

render();
</script>
</body>
</html>
