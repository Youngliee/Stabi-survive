<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game" src="stabi-survive-2d-test.html" title="Stabi Survive"></iframe><script>(()=>{const f=document.getElementById('game');f.addEventListener('load',()=>{try{const d=f.contentDocument;const nick=d.getElementById('nameInput');if(nick){nick.value='Player';nick.style.display='none'}const card=nick&&nick.parentElement;if(card){const observer=new MutationObserver(()=>{const r=d.getElementById('resultText');if(r&&r.innerHTML.includes('<b>Player</b><br>'))r.innerHTML=r.innerHTML.replace('<b>Player</b><br>','')});observer.observe(d.body,{childList:true,subtree:true,characterData:true})}}catch(e){}})})();</script></body></html>
