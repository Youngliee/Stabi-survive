<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive 2D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;font-family:Arial,sans-serif;color:#fff}#g{display:block;width:100vw;height:100vh;background:radial-gradient(circle at center,#174342,#092526 65%,#061516)}#hud{position:fixed;inset:12px 12px auto;display:flex;gap:8px;justify-content:space-between;pointer-events:none;z-index:5}.box{background:#06191cdd;border:1px solid #4adbd2;border-radius:12px;padding:8px 10px;font-weight:900}.hp{width:170px}.bar{height:8px;background:#1e2930;border-radius:20px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#59e4b5}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#031113e8;z-index:20;padding:16px}.card{width:min(92vw,480px);padding:25px;border:1px solid #4adbd2;border-radius:20px;background:#082428;text-align:center;box-shadow:0 20px 70px #0009}.logo{width:68px;height:68px;object-fit:contain}.card h1{margin:8px 0 5px}.card p{color:#a6c8c8}.card input{width:100%;padding:12px;border:1px solid #44777a;border-radius:10px;background:#04191b;color:white;font-size:16px;margin:10px 0}.btn{width:100%;border:0;border-radius:11px;padding:12px;font-weight:900;font-size:16px;background:#63ddd5;color:#052022}.btn.alt{margin-top:8px;background:#183b3d;color:#fff}.hidden{display:none!important}#controls{position:fixed;left:15px;right:15px;bottom:15px;display:none;justify-content:space-between;align-items:end;z-index:8}.dpad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:4px}.c{width:54px;height:54px;border-radius:14px;border:1px solid #4adbd2;background:#06191cbb;color:white;font-size:22px;touch-action:none}.dash{width:78px;height:78px;border-radius:50%;font-size:13px;background:#134247cc}@media(max-width:800px),(pointer:coarse){#controls{display:flex}.box{font-size:12px}.hp{width:130px}}</style></head><body><canvas id="g"></canvas><div id="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">🪙 <span id="coins">0</span></div><div class="box">⏱ <span id="time">0</span>s</div><div class="box">⚔️ <span id="kills">0</span></div></div><section id="start" class="panel"><div class="card"><img class="logo" src="assets/logo.webp"><h1>STABI SURVIVE</h1><p>Move freely. Stabi auto-slashes the nearest enemy. Survive and collect USDZ.</p><input id="name" value="Zarrr" maxlength="16" placeholder="Player name"><button id="play" class="btn">PLAY</button><button id="how" class="btn alt">HOW TO PLAY</button><p id="help" class="hidden">Desktop: WASD / Arrow Keys. Mobile: direction buttons. Boss appears at 30 seconds.</p></div></section><section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="again" class="btn">RUN AGAIN</button></div></section><div id="controls"><div class="dpad"><span></span><button class="c" data-k="up">▲</button><span></span><button class="c" data-k="left">◀</button><span></span><button class="c" data-k="right">▶</button><span></span><button class="c" data-k="down">▼</button><span></span></div><button id="dash" class="c dash">DASH</button></div><script>
const c=document.getElementById('g'),x=c.getContext('2d');let DPR=devicePixelRatio||1;function rs(){c.width=innerWidth*DPR;c.height=innerHeight*DPR}addEventListener('resize',rs);rs();const W=()=>c.width/DPR,H=()=>c.height/DPR;
const I={};function ld(n,s){let i=new Image;i.src=s;I[n]=i}ld('p','assets/sprites/player/stabi-sprites.webp');ld('e','assets/sprites/enemies/red-slime-sprites.webp');ld('b','assets/sprites/boss/mech-boss-sprites.webp');ld('coin','assets/coin.webp');
const P={idle_down:[[8,35,92,125],[8,135,92,230]],idle_left:[[92,35,170,125],[92,135,170,230]],idle_right:[[170,35,250,125],[170,135,250,230]],idle_up:[[250,35,330,125],[250,135,330,230]],walk_down:[[345,35,430,130],[345,135,430,235]],walk_left:[[430,35,505,130],[430,135,505,235]],walk_right:[[505,35,585,130],[505,135,585,235]],walk_up:[[585,35,740,130],[585,135,740,235]],attack_down:[[8,285,78,415],[78,285,148,415],[148,285,220,415],[220,285,292,415],[292,285,365,415]],attack_left:[[385,285,460,415],[460,285,535,415],[535,285,620,415],[620,285,700,415],[700,285,775,415]],attack_right:[[790,285,865,415],[865,285,940,415],[940,285,1035,415],[1035,285,1120,415]],attack_up:[[1160,285,1240,420],[1240,285,1320,420],[1320,285,1410,420],[1410,285,1535,420]],hurt:[[935,485,1015,615],[1015,485,1090,615],[1090,485,1175,615]],death:[[1190,480,1270,620],[1270,480,1360,620],[1360,480,1450,620],[1450,480,1535,620]]};
function row(y0,y1,x0,n,x1){let a=[],w=(x1-x0)/n;for(let i=0;i<n;i++)a.push([x0+i*w,y0,x0+(i+1)*w,y1]);return a}const E={idle:row(20,190,25,6,780),walk:row(190,355,20,8,1430),attack:row(350,535,10,6,1435),hurt:row(535,730,15,4,880),death:row(720,910,10,6,1435),slash:row(900,1085,5,8,1435)},B={idle:row(40,225,110,6,1330),walk:row(210,385,100,8,1390),attack:row(370,535,105,6,1325),hurt:row(520,690,100,4,900),death:row(680,865,100,6,1375),slash:row(850,1085,105,8,1400)};
function sprite(img,box,px,py,w,h,flip=false,alpha=1){if(!img.complete)return;let [a,b,d,e]=box;x.save();x.globalAlpha=alpha;if(flip){x.translate(px+w,0);x.scale(-1,1);px=0}x.drawImage(img,a,b,d-a,e-b,px,py,w,h);x.restore()}
let run=false,last=0,t=0,spawn=0,ct=0,bossed=false,name='Player',ks={up:0,down:0,left:0,right:0},en=[],co=[],bo=[],fx=[];const p={x:300,y:300,r:28,hp:100,coins:0,kills:0,s:225,inv:0,dash:0,dir:'down',atk:0,atkcd:0,hurt:0,dead:0,anim:0};
function reset(){t=spawn=ct=0;bossed=false;en=[];co=[];bo=[];fx=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coins:0,kills:0,inv:0,dash:0,dir:'down',atk:0,atkcd:0,hurt:0,dead:0,anim:0});hud()}
function edge(){let q=Math.floor(Math.random()*4),a=Math.random();return q==0?[a*W(),-50]:q==1?[W()+50,a*H()]:q==2?[a*W(),H()+50]:[-50,a*H()]}
function spawnE(){let [a,b]=edge();en.push({x:a,y:b,r:25,hp:35,s:75+Math.min(t,60),anim:0,dead:0,hurt:0,atk:0})}function spawnC(X,Y){co.push({x:X,y:Y,r:16,a:0})}function boss(){bo.push({x:W()/2,y:-100,r:58,hp:320,s:52,anim:0,dead:0,hurt:0,atk:0});bossed=true}
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function nearest(){let all=[...en,...bo].filter(q=>!q.dead);all.sort((a,b)=>D(p,a)-D(p,b));return all[0]}function dirTo(q){let dx=q.x-p.x,dy=q.y-p.y;if(Math.abs(dx)>Math.abs(dy))return dx<0?'left':'right';return dy<0?'up':'down'}
function autoAttack(){if(p.atkcd>0||p.dead)return;let q=nearest();if(!q||D(p,q)>145)return;p.dir=dirTo(q);p.atk=.36;p.atkcd=.62;fx.push({x:p.x,y:p.y,dir:p.dir,a:0});for(let m of [...en,...bo])if(!m.dead&&D(p,m)<150){m.hp-=bo.includes(m)?38:28;m.hurt=.18;if(m.hp<=0){m.dead=.55;p.kills++;if(Math.random()<.78)spawnC(m.x,m.y)}}}
function update(dt){t+=dt;spawn+=dt;ct+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.atk=Math.max(0,p.atk-dt);p.atkcd=Math.max(0,p.atkcd-dt);p.hurt=Math.max(0,p.hurt-dt);p.anim+=dt*7;let dx=ks.right-ks.left,dy=ks.down-ks.up,m=Math.hypot(dx,dy)||1;if(dx||dy){if(Math.abs(dx)>Math.abs(dy))p.dir=dx<0?'left':'right';else p.dir=dy<0?'up':'down';let z=p.s*(p.dash?2.15:1);p.x+=dx/m*z*dt;p.y+=dy/m*z*dt}p.x=Math.max(30,Math.min(W()-30,p.x));p.y=Math.max(65,Math.min(H()-30,p.y));autoAttack();if(spawn>Math.max(.45,1.2-t*.012)){spawn=0;spawnE()}if(ct>2.4){ct=0;if(co.length<8)spawnC(70+Math.random()*(W()-140),90+Math.random()*(H()-150))}if(t>30&&!bossed)boss();for(let a of [...en,...bo]){a.anim+=dt*7;a.atk=Math.max(0,a.atk-dt);if(a.dead>0){a.dead-=dt;continue}a.hurt=Math.max(0,a.hurt-dt);let dx=p.x-a.x,dy=p.y-a.y,l=Math.hypot(dx,dy)||1;a.x+=dx/l*a.s*dt;a.y+=dy/l*a.s*dt;if(D(p,a)<p.r+a.r&&p.inv<=0){p.hp-=bo.includes(a)?24:11;p.inv=.65;p.hurt=.24;a.atk=.25}}en=en.filter(a=>a.dead>0||a.hp>0);bo=bo.filter(a=>a.dead>0||a.hp>0);for(let i=co.length-1;i>=0;i--){co[i].a+=dt*5;if(D(p,co[i])<45){p.coins++;co.splice(i,1)}}for(let i=fx.length-1;i>=0;i--){fx[i].a+=dt*12;if(fx[i].a>8)fx.splice(i,1)}hud();if(p.hp<=0){p.dead=.8;end()}}
function hud(){hpv.textContent=Math.max(0,Math.ceil(p.hp));hpb.style.width=Math.max(0,p.hp)+'%';coins.textContent=p.coins;time.textContent=Math.floor(t);kills.textContent=p.kills}
function bg(){x.save();x.scale(DPR,DPR);x.fillStyle='#0b2829';x.fillRect(0,0,W(),H());x.strokeStyle='#164445';for(let q=0;q<W();q+=48){x.beginPath();x.moveTo(q,0);x.lineTo(q,H());x.stroke()}for(let q=0;q<H();q+=48){x.beginPath();x.moveTo(0,q);x.lineTo(W(),q);x.stroke()}x.restore()}
function draw(){bg();x.save();x.scale(DPR,DPR);for(let q of co){let y=q.y+Math.sin(q.a)*3;sprite(I.coin,[0,0,I.coin.width||256,I.coin.height||256],q.x-16,y-16,32,32)}for(let a of en)drawMob(a,E,I.e,60);for(let a of bo)drawMob(a,B,I.b,118);for(let f of fx){let set=P['attack_'+f.dir],i=Math.min(set.length-1,Math.floor(f.a/2));sprite(I.p,set[i],p.x-58,p.y-58,116,116,false,.28)}let moving=ks.up||ks.down||ks.left||ks.right,set;if(p.hurt>0)set=P.hurt;else if(p.atk>0)set=P['attack_'+p.dir];else set=P[(moving?'walk_':'idle_')+p.dir];let fi=Math.floor(p.anim)%set.length;sprite(I.p,set[fi],p.x-42,p.y-48,84,96,false,p.inv>0&&Math.floor(p.inv*18)%2?.35:1);x.fillStyle='#fff';x.textAlign='center';x.font='700 12px Arial';x.fillText(name,p.x,p.y+42);if(bossed){x.font='900 18px Arial';x.fillStyle='#ffb0a8';x.fillText('BOSS WAVE',W()/2,55)}x.restore()}
function drawMob(a,set,img,size){let st=a.dead>0?'death':a.hurt>0?'hurt':a.atk>0?'attack':'walk',arr=set[st]||set.walk,fi=Math.min(arr.length-1,Math.floor(a.anim)%arr.length);sprite(img,arr[fi],a.x-size/2,a.y-size/2,size,size);if(bo.includes(a)){x.fillStyle='#300';x.fillRect(a.x-55,a.y-size/2-13,110,7);x.fillStyle='#f04b42';x.fillRect(a.x-55,a.y-size/2-13,110*Math.max(0,a.hp/320),7)}}
function loop(z){if(!run)return;if(!last)last=z;let dt=Math.min(.033,(z-last)/1000);last=z;update(dt);draw();requestAnimationFrame(loop)}function startGame(){name=(document.getElementById('name').value||'Player').trim().slice(0,16);start.classList.add('hidden');over.classList.add('hidden');reset();run=true;last=0;requestAnimationFrame(loop)}function end(){run=false;result.innerHTML=`<b>${name}</b><br>Survived: ${Math.floor(t)}s<br>Kills: ${p.kills}<br>USDZ: ${p.coins}`;over.classList.remove('hidden')}play.onclick=startGame;again.onclick=startGame;how.onclick=()=>help.classList.toggle('hidden');addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k=='w'||k=='arrowup')ks.up=1;if(k=='s'||k=='arrowdown')ks.down=1;if(k=='a'||k=='arrowleft')ks.left=1;if(k=='d'||k=='arrowright')ks.right=1;if(k==' ')p.dash=.2});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k=='w'||k=='arrowup')ks.up=0;if(k=='s'||k=='arrowdown')ks.down=0;if(k=='a'||k=='arrowleft')ks.left=0;if(k=='d'||k=='arrowright')ks.right=0});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();ks[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=e=>{e.preventDefault();ks[k]=0}});dash.onpointerdown=e=>{e.preventDefault();p.dash=.2};draw();
</script></body></html>
