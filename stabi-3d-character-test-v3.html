<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi 3D Character Test V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 34%,#0d3a3b 0,#071a20 42%,#020d12 100%);font-family:Arial,sans-serif;color:#eafffb}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:16px;top:14px;padding:9px 12px;border:1px solid #46e9df;border-radius:10px;background:#031a1ddd;font:800 12px monospace;letter-spacing:.08em}.tag b{color:#68f4e9}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 13px;border:1px solid #2c837e;border-radius:10px;background:#031417dd;color:#9ed8d3;font:700 11px monospace;white-space:nowrap}.badge{position:absolute;right:16px;top:14px;color:#ffd86a;font:800 10px monospace;letter-spacing:.12em}</style></head><body><div class="ui"><div class="tag">STABI <b>3D TEST V3</b></div><div class="badge">ROUNDED CHIBI</div><div class="hint">Drag to rotate • Pinch / wheel to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(5.6,4.6,7.4);scene.add(new THREE.HemisphereLight(0xe2fffb,0x06151b,2.6));const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(-4,8,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x43e8de,1.8);rim.position.set(5,4,-5);scene.add(rim);const root=new THREE.Group();scene.add(root);const C={skin:0xf6c7aa,hair:0x17265f,hair2:0x283d86,cyan:0x78cfe6,mint:0xb9f0d7,white:0xf7fbff,shoe:0x72d5e0,sole:0xf7fbff,eye:0x1686e7,dark:0x061534,mouth:0x6d2b2e,pink:0xf58f9d};function mat(c,r=.48){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.02})}function add(g,o,x,y,z,sx=1,sy=1,sz=1){o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}function sph(g,r,c,x,y,z,sx=1,sy=1,sz=1,seg=28){return add(g,new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg*.7),mat(c)),x,y,z,sx,sy,sz)}function box(g,w,h,d,c,x,y,z){return add(g,new THREE.Mesh(new THREE.BoxGeometry(w,h,d,3,3,3),mat(c)),x,y,z)}function cyl(g,r1,r2,h,c,x,y,z,seg=16){return add(g,new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat(c)),x,y,z)}function makeLogo(text,size=.42){const cv=document.createElement('canvas');cv.width=cv.height=128;const cx=cv.getContext('2d');cx.clearRect(0,0,128,128);cx.fillStyle='#fff';cx.font='900 88px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(text,64,68);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;return new THREE.Mesh(new THREE.PlaneGeometry(size,size*1.08),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}))}function makeStabi(){const g=new THREE.Group();const head=new THREE.Group();g.add(head);sph(head,.78,C.skin,0,2.48,.02,1.0,.93,.9);sph(head,.81,C.hair,0,2.63,-.10,1.07,.94,.96);for(const [x,y,z,sx,sy,rz] of [[-.55,2.57,.30,.38,.7,.28],[-.38,2.73,.43,.34,.72,.18],[-.17,2.79,.48,.31,.75,.08],[.08,2.8,.49,.31,.75,-.03],[.31,2.75,.45,.33,.73,-.12],[.52,2.61,.34,.36,.68,-.22]]){const strand=sph(head,.28,C.hair2,x,y,z,sx,sy,.35,18);strand.rotation.z=rz}for(const x of[-.27,.27]){sph(head,.20,0xffffff,x,2.45,.70,1,.95,.28);sph(head,.155,C.eye,x,2.43,.73,1,.96,.25);sph(head,.085,C.dark,x,2.40,.75,1,.95,.22);sph(head,.043,0xffffff,x-.035,2.50,.77,1,.9,.2)}sph(head,.12,C.mouth,0,2.20,.70,1.15,.55,.22);sph(head,.075,C.pink,-.47,2.28,.62,1.3,.35,.18);sph(head,.075,C.pink,.47,2.28,.62,1.3,.35,.18);const torso=new THREE.Group();g.add(torso);sph(torso,.53,C.cyan,0,1.49,0,1.05,.78,.72);box(torso,.76,.82,.58,C.cyan,0,1.42,0);box(torso,.84,.09,.60,C.mint,0,1.79,0);box(torso,.74,.68,.045,C.white,0,1.42,.305);const front=makeLogo('S',.31);add(torso,front,.31,1.52,.333);const back=makeLogo('S',.35);back.rotation.y=Math.PI;add(torso,back,0,1.47,-.333);const bow=new THREE.Group();g.add(bow);sph(bow,.17,C.mint,-.15,1.78,.34,1.25,.72,.3);sph(bow,.17,C.mint,.15,1.78,.34,1.25,.72,.3);sph(bow,.09,C.mint,0,1.78,.36,1,1,.5);for(const x of[-.44,-.15,.15,.44])box(g,.24,.26,.72,x===-.44||x===.44?C.white:C.mint,x,.96,0);box(g,1.08,.05,.74,C.cyan,0,1.08,0);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s] of [[armL,-1],[armR,1]]){sph(a,.20,C.cyan,0,-.02,0,1,.92,.92);cyl(a,.15,.13,.48,C.cyan,0,-.27,0,14);box(a,.31,.08,.31,C.mint,0,-.49,0);sph(a,.145,C.skin,0,-.61,.01,1,.92,.92);a.position.set(s*.66,1.60,0);a.rotation.z=s*.10;g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s] of [[legL,-1],[legR,1]]){cyl(l,.16,.14,.44,C.skin,0,-.05,0,14);box(l,.38,.14,.40,C.white,0,-.28,.03);box(l,.46,.25,.66,C.shoe,0,-.45,.09);box(l,.48,.08,.68,C.sole,0,-.58,.09);box(l,.30,.08,.67,C.white,0,-.37,.10);l.position.set(s*.29,.74,0);g.add(l)}g.scale.setScalar(1.02);g.userData={armL,armR,legL,legR};return g}const stabi=makeStabi();root.add(stabi);const ring=new THREE.Mesh(new THREE.RingGeometry(1.08,1.14,64),new THREE.MeshBasicMaterial({color:0x49e8df,transparent:true,opacity:.78,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;root.add(ring);const disc=new THREE.Mesh(new THREE.CircleGeometry(1.03,64),new THREE.MeshBasicMaterial({color:0x0a5352,transparent:true,opacity:.24}));disc.rotation.x=-Math.PI/2;disc.position.y=.025;root.add(disc);let drag=false,lastX=0,lastY=0,targetY=.32,rotY=.32,targetTilt=0,tilt=0,zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.012;targetTilt=Math.max(-.2,Math.min(.2,targetTilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.72,Math.min(1.3,zoom+e.deltaY*.0008))},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)zoom=Math.max(.72,Math.min(1.3,zoom-(d-pinch)*.002));pinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(!drag)targetY+=.0022;rotY+=(targetY-rotY)*.08;tilt+=(targetTilt-tilt)*.08;root.rotation.y=rotY;root.rotation.x=tilt;camera.position.set(5.6*zoom,4.6*zoom,7.4*zoom);camera.lookAt(0,1.55,0);const u=stabi.userData,sw=Math.sin(t*3.0);u.armL.rotation.x=sw*.12;u.armR.rotation.x=-sw*.12;u.legL.rotation.x=-sw*.08;u.legR.rotation.x=sw*.08;stabi.position.y=.07+Math.sin(t*2.2)*.035;ring.rotation.z=t*.42;renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);loop();</script></body></html>
