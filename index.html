<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crossy Stabi Playtest</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031922;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block}#ui{position:fixed;inset:0;z-index:10;pointer-events:none}.logo{position:absolute;left:12px;top:10px;color:#fff;font-weight:1000;font-size:28px}.logo b{color:#49e7dd;font-style:italic}.logo small{display:block;font-size:7px;letter-spacing:3px;color:#a5eeea}.hud{position:absolute;right:10px;top:10px;display:flex;gap:7px}.pill{min-width:58px;padding:6px;border:1px solid #52e7df;background:#03161ddd;border-radius:11px;text-align:center;color:#fff}.pill small{display:block;font-size:6px;color:#7ff3ec}.controls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) scale(.9);transform-origin:center bottom;width:205px;height:158px;pointer-events:auto}.ctrl{position:absolute;width:60px;height:52px;border-radius:8px;border:2px solid #55777d;background:#07151c;color:#fff;font-size:24px;font-weight:1000}.ctrl.up{left:72px;top:0;background:#48ded5;color:#042125}.ctrl.left{left:0;top:66px}.ctrl.down{left:72px;top:66px}.ctrl.right{right:0;top:66px}.timer{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);font:900 20px monospace;color:#45ece4}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#031922ee}.card{width:min(420px,92vw);padding:26px;text-align:center;background:#061820;border:1px solid #39ddd5;border-radius:18px;color:#fff}.card h1 span{color:#4ee8df}.play{padding:13px 24px;border-radius:10px;border:1px solid #9afff7;background:#4ce2d8;font-weight:1000}.result{display:none}</style></head><body><div id="ui" style="display:none"><div class="logo">CROSSY <b>STABI</b><small>STABLECOIN FRONTIER</small></div><div class="hud"><div class="pill"><small>DISTANCE</small><b id="dist">0m</b></div><div class="pill"><small>USDZ</small><b id="coins">0</b></div></div><div class="controls"><button class="ctrl up" data-dir="up">▲</button><button class="ctrl left" data-dir="left">◀</button><button class="ctrl down" data-dir="down">▼</button><button class="ctrl right" data-dir="right">▶</button><div class="timer" id="timer">00:60</div></div></div><section id="start" class="overlay"><div class="card"><h1>CROSSY <span>STABI</span></h1><p>Dodge SLIPPAGE, MEV and PRICE IMPACT. Collect USDZ.</p><button id="play" class="play">PLAY</button></div></section><section id="result" class="overlay result"><div class="card"><h1>RUN COMPLETE</h1><p id="resultText"></p><button id="again" class="play">RUN AGAIN</button></div></section><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x031922);scene.fog=new THREE.Fog(0x031922,55,125);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.OrthographicCamera(-18,18,11,-11,.1,220);camera.position.set(24,29,28);scene.add(new THREE.HemisphereLight(0xc8fffb,0x021114,2.05));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-20,38,24);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);const TILE=3.15,HALF=4,WIDTH=28.35,MAX=120;let cars=[],coins=[];function mat(c,r=.6){return new THREE.MeshStandardMaterial({color:c,roughness:r,flatShading:true})}function box(w,h,d,c){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.castShadow=true;o.receiveShadow=true;return o}function add(g,o,x,y,z){o.position.set(x,y,z);g.add(o);return o}function tree(x,z){const g=new THREE.Group();add(g,box(.25,.8,.25,0x163137),0,.4,0);const q=new THREE.Mesh(new THREE.ConeGeometry(.68,1.45,6),mat(0x087b78));add(g,q,0,1.25,0);g.position.set(x,0,z);world.add(g)}function makeStabi(){const g=new THREE.Group();const SKIN=0xf4bea6,HAIR=0x102a86,HAIR2=0x1c3ca0,CYAN=0x69ced7,CYAN2=0x8adfe5,WHITE=0xf5f7f2,SHOE=0x49bfd0,SOLE=0xf8fbf8,EYE=0x126bd6,DARK=0x071a4d,PINK=0xd96472;add(g,box(1.18,.98,.96,SKIN),0,2.14,0);add(g,box(1.3,.24,1.06,HAIR),0,2.76,-.02);for(const [x,z,w,d,h,y]of[[-.46,.37,.30,.25,.54,2.46],[-.16,.45,.29,.28,.60,2.48],[.16,.45,.29,.28,.60,2.48],[.46,.37,.30,.25,.54,2.46],[-.54,.06,.22,.46,.64,2.39],[.54,.06,.22,.46,.64,2.39],[-.38,-.39,.28,.25,.64,2.37],[0,-.45,.44,.24,.7,2.36],[.38,-.39,.28,.25,.64,2.37]])add(g,box(w,h,d,z>0?HAIR2:HAIR),x,y,z);for(const [x,w,h]of[[-.38,.25,.34],[-.12,.28,.42],[.14,.28,.40],[.4,.23,.32]])add(g,box(w,h,.16,HAIR2),x,2.48,.49);for(const x of[-.25,.25]){add(g,box(.23,.29,.045,0xffffff),x,2.15,.503);add(g,box(.17,.23,.05,EYE),x,2.14,.53);add(g,box(.09,.14,.052,DARK),x,2.11,.558);add(g,box(.05,.07,.055,0xffffff),x-.035,2.2,.573)}add(g,box(.12,.055,.045,PINK),0,1.91,.51);add(g,box(.11,.04,.043,0xf3a7aa),-.42,1.98,.51);add(g,box(.11,.04,.043,0xf3a7aa),.42,1.98,.51);add(g,box(.98,.73,.62,CYAN),0,1.28,0);add(g,box(.68,.15,.18,CYAN2),0,1.63,-.38);add(g,box(.26,.12,.12,CYAN2),-.26,1.55,-.42);add(g,box(.26,.12,.12,CYAN2),.26,1.55,-.42);const cv=document.createElement('canvas');cv.width=cv.height=128;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.font='bold 90px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('S',64,68);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const logo=new THREE.Mesh(new THREE.PlaneGeometry(.37,.43),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));add(g,logo,0,1.31,.316);add(g,box(1.0,.28,.7,WHITE),0,.82,0);add(g,box(1.02,.07,.72,CYAN2),0,.94,0);const armL=new THREE.Group(),armR=new THREE.Group(),legL=new THREE.Group(),legR=new THREE.Group();for(const [a,s]of[[armL,-1],[armR,1]]){add(a,box(.3,.38,.31,CYAN),0,0,0);add(a,box(.31,.09,.32,CYAN2),0,-.22,0);add(a,box(.23,.2,.24,SKIN),0,-.36,0);a.position.set(s*.64,1.38,0);a.rotation.z=s*.07;g.add(a)}for(const [l,s]of[[legL,-1],[legR,1]]){add(l,box(.27,.34,.3,WHITE),0,0,0);add(l,box(.43,.24,.57,SHOE),0,-.28,.08);add(l,box(.45,.08,.6,SOLE),0,-.43,.08);add(l,box(.27,.09,.59,WHITE),0,-.2,.09);l.position.set(s*.26,.57,0);g.add(l)}g.scale.setScalar(.88);g.userData={armL,armR,legL,legR};return g}const player=makeStabi();world.add(player);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.52,18),new THREE.MeshBasicMaterial({color:0x00e5dc,transparent:true,opacity:.16}));shadow.rotation.x=-Math.PI/2;world.add(shadow);function face(d){player.rotation.y=d==='up'?Math.PI:d==='left'?-Math.PI/2:d==='right'?Math.PI/2:0}function wheel(x,z){const w=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,12),mat(0x080a0c));w.rotation.x=Math.PI/2;w.position.set(x,.24,z);return w}const hazards=[{name:'SLIPPAGE',c:0xc9363d,d:0x781823},{name:'MEV',c:0x6544af,d:0x301c61},{name:'PRICE IMPACT',c:0x118d8d,d:0x075657}];function labelTex(text){const cv=document.createElement('canvas');cv.width=512;cv.height=192;const c=cv.getContext('2d');c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.font='900 62px Arial';if(text==='PRICE IMPACT'){c.font='900 54px Arial';c.fillText('PRICE',256,63);c.fillText('IMPACT',256,132)}else c.fillText(text,256,96);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t}function label(text,w,h,z,back=false){const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:labelTex(text),transparent:true,side:THREE.DoubleSide,depthWrite:false}));p.position.z=z;if(back)p.rotation.y=Math.PI;return p}function car(row,dir,x,v,i){const def=hazards[(row+i)%3],g=new THREE.Group(),truck=def.name==='PRICE IMPACT',w=truck?3.35:2.75,d=truck?1.3:1.18;const body=box(w,.58,d,def.c);body.position.y=.51;g.add(body);const cab=box(truck?.92:1.05,truck?.76:.63,d*.86,def.d);cab.position.set(truck?dir*1.08:-dir*.18,truck?.88:1.07,0);g.add(cab);const lw=def.name==='PRICE IMPACT'?1.48:def.name==='SLIPPAGE'?1.48:1;const a=label(def.name,lw,truck?.62:.36,d*.51+.01),b=label(def.name,lw,truck?.62:.36,-d*.51-.01,true);a.position.y=b.position.y=truck?1.1:.67;g.add(a,b);for(const sx of[-1,1])for(const sz of[-1,1])g.add(wheel(sx*w*.34,sz*d*.49));g.position.set(x,.02,-row*TILE);world.add(g);cars.push({g,dir,v,half:w*.51})}let coinTexture;function usdz(){if(coinTexture)return coinTexture;const cv=document.createElement('canvas');cv.width=cv.height=256;const c=cv.getContext('2d');c.beginPath();c.arc(128,128,100,0,Math.PI*2);c.fillStyle='#5f918d';c.fill();c.fillStyle='#fff';c.font='bold 145px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('$',128,134);coinTexture=new THREE.CanvasTexture(cv);return coinTexture}function coin(r,x){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:usdz(),transparent:true}));sp.scale.set(.9,.9,1);sp.position.set(x,.7,-r*TILE);world.add(sp);coins.push({g:sp,taken:false,s:Math.random()*6})}function road(r,z){const s=box(WIDTH,.24,TILE-.03,0x061923);s.position.set(0,-.12,z);world.add(s);for(let x=-12;x<13;x+=4.2){const d=box(1.55,.024,.055,0x2d7780);d.position.set(x+(r%2?1:0),.018,z);world.add(d)}}function grass(r,z){const s=box(WIDTH,.26,TILE-.04,r%3?0x0b5b5b:0x0a5052);s.position.set(0,-.13,z);world.add(s)}function type(r){if(r<2)return'grass';const p=((r-2)%7+7)%7;return[0,1,3,4].includes(p)?'road':'grass'}function build(){cars=[];coins=[];while(world.children.length)world.remove(world.children[0]);world.add(player,shadow);for(let r=-7;r<MAX;r++){const z=-r*TILE;if(type(r)==='road'){road(r,z);const dir=r%2?1:-1,count=r<12?2:r%3===0?4:3;for(let j=0;j<count;j++)car(r,dir,(j-(count-1)/2)*10.7*dir,2.8+(r%4)*.35,j)}else{grass(r,z);for(let i=0;i<3;i++)if(Math.random()<.62)tree((Math.floor(Math.random()*9)-4)*TILE,z+(Math.random()-.5)*.7);if(r>1&&Math.random()<.52)coin(r,(Math.floor(Math.random()*9)-4)*TILE)}}}let running=false,ended=false,timeLeft=60,startTime=0,last=performance.now(),gx=0,gr=0,maxRow=0,moving=false,queued=null,hopStart=0,from=new THREE.Vector3(),to=new THREE.Vector3(),cc=0;function hud(){$('dist').textContent=maxRow*3+'m';$('coins').textContent=cc;$('timer').textContent='00:'+String(Math.max(0,Math.ceil(timeLeft))).padStart(2,'0')}function reset(){build();gx=gr=maxRow=cc=0;timeLeft=60;moving=false;ended=false;running=true;startTime=performance.now();player.position.set(0,.2,0);face('down');$('result').style.display='none';$('ui').style.display='block';hud()}function move(d){if(!running||ended)return;if(moving){queued=d;return}let nx=gx,nr=gr;if(d==='up')nr++;if(d==='down')nr--;if(d==='left')nx--;if(d==='right')nx++;if(nx<-HALF||nx>HALF||nr<0)return;face(d);gx=nx;gr=nr;maxRow=Math.max(maxRow,gr);moving=true;hopStart=performance.now();from.copy(player.position);to.set(gx*TILE,.2,-gr*TILE)}function hit(){for(const c of cars)if(Math.abs(c.g.position.z-player.position.z)<.72&&Math.abs(c.g.position.x-player.position.x)<c.half+.28&&player.position.y<.82)finish()}function collect(){for(const c of coins)if(!c.taken&&Math.abs(c.g.position.z-player.position.z)<.65&&Math.abs(c.g.position.x-player.position.x)<.62){c.taken=true;c.g.visible=false;cc++}}function finish(){if(ended)return;ended=true;running=false;$('resultText').textContent='Distance: '+maxRow*3+'m • USDZ: '+cc;setTimeout(()=>$('result').style.display='flex',100)}function loop(now){requestAnimationFrame(loop);const dt=Math.min(.034,(now-last)/1000||.016);last=now;if(running){timeLeft=Math.max(0,60-(now-startTime)/1000);const boost=1+Math.min(1.8,Math.floor(maxRow/9)*.12);for(const c of cars){c.g.position.x+=c.v*boost*dt*c.dir;if(c.g.position.x>WIDTH*.75)c.g.position.x=-WIDTH*.75;if(c.g.position.x<-WIDTH*.75)c.g.position.x=WIDTH*.75}if(moving){const p=Math.min(1,(now-hopStart)/170),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,sw=Math.sin(p*Math.PI*2),u=player.userData;player.position.lerpVectors(from,to,s);player.position.y=.2+Math.sin(Math.PI*p)*.58;u.armL.rotation.x=sw*.48;u.armR.rotation.x=-sw*.48;u.legL.rotation.x=-sw*.36;u.legR.rotation.x=sw*.36;if(p>=1){moving=false;player.position.copy(to);u.armL.rotation.x=u.armR.rotation.x=u.legL.rotation.x=u.legR.rotation.x=0;collect();hit();if(queued){const q=queued;queued=null;move(q)}}}hit();if(timeLeft<=0)finish()}for(const c of coins)if(!c.taken)c.g.position.y=.7+Math.sin(now*.003+c.s)*.1;shadow.position.set(player.position.x,.02,player.position.z);camera.position.lerp(new THREE.Vector3(player.position.x+15.5,26,player.position.z+21),1-Math.exp(-dt*5));camera.lookAt(player.position.x,.35,player.position.z-7.5);hud();renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();$('play').onclick=()=>{$('start').style.display='none';reset()};$('again').onclick=reset;document.querySelectorAll('.ctrl').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)}));addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(k){e.preventDefault();move(k)}});loop(performance.now());</script><!-- force-pages-rebuild --></body></html>
