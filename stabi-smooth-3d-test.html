<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stabi Smooth 3D Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#123c48 0,#061a25 45%,#020b12 100%);font-family:Arial;color:#eafffb}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:16px;top:14px;padding:10px 12px;border:1px solid #35e8dd;border-radius:10px;background:#03161ddd;font:900 12px monospace}.tag b{color:#63f2e9}.badge{position:absolute;right:16px;top:14px;padding:8px 10px;border:1px solid #286a7a;border-radius:9px;background:#03141ddd;color:#9be8ee;font:800 10px monospace}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 13px;border:1px solid #277f85;border-radius:9px;background:#021217dd;color:#9cd8db;font:700 11px monospace;white-space:nowrap}</style></head><body><div class="ui"><div class="tag">STABI <b>SMOOTH 3D TEST</b></div><div class="badge">CHIBI • NON-VOXEL</div><div class="hint">Drag to rotate • Pinch / wheel to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);camera.position.set(5.5,4.4,7.7);scene.add(new THREE.HemisphereLight(0xe5fffd,0x07131b,2.7));const key=new THREE.DirectionalLight(0xffffff,3.3);key.position.set(-5,8,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x40e8df,1.8);rim.position.set(5,4,-6);scene.add(rim);const root=new THREE.Group();scene.add(root);const C={skin:0xf3bea5,hair:0x112d85,hair2:0x1c48ad,cyan:0x4fcbd0,cyan2:0x91e4df,white:0xf8faf7,shoe:0x51cbd5,sole:0xffffff,eye:0x1979df,dark:0x071b51,pink:0xe76f7e};function mat(c,r=.48){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.015})}function add(g,m,x,y,z,sx=1,sy=1,sz=1){m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function sph(g,r,c,x,y,z,sx=1,sy=1,sz=1){return add(g,new THREE.Mesh(new THREE.SphereGeometry(r,32,22),mat(c)),x,y,z,sx,sy,sz)}function cap(g,r,l,c,x,y,z,sx=1,sy=1,sz=1){return add(g,new THREE.Mesh(new THREE.CapsuleGeometry(r,l,8,20),mat(c)),x,y,z,sx,sy,sz)}function cyl(g,rt,rb,h,c,x,y,z){return add(g,new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat(c)),x,y,z)}function logo(g,y,z,ry=0){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');x.fillStyle='#fff';x.font='900 90px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('S',64,68);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(.36,.44),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide}));m.position.set(0,y,z);m.rotation.y=ry;g.add(m)}function make(){const g=new THREE.Group(),head=new THREE.Group();g.add(head);sph(head,.78,C.skin,0,2.5,.02,1,.93,.9);sph(head,.82,C.hair,0,2.68,-.14,1.05,.9,.94);for(const [x,y,s]of[[-.5,2.69,.86],[-.27,2.8,1],[0,2.84,1.06],[.27,2.8,1],[.5,2.69,.86]])sph(head,.34,C.hair2,x,y,.49,.48,s,.35);for(const [x,z,sy]of[[-.58,-.14,1.2],[.58,-.14,1.2],[-.42,-.51,1.15],[-.14,-.57,1.28],[.15,-.57,1.28],[.43,-.51,1.15]])cap(head,.14,.42,C.hair,x,2.48,z,.95,sy,1);for(const x of[-.26,.26]){sph(head,.205,0xffffff,x,2.46,.68,1,.96,.3);sph(head,.15,C.eye,x,2.44,.71,1,.96,.28);sph(head,.078,C.dark,x,2.41,.735,1,.96,.25);sph(head,.043,0xffffff,x-.035,2.51,.75,1,.9,.2)}sph(head,.085,C.pink,0,2.22,.71,1.25,.35,.22);sph(head,.075,0xf2a3aa,-.46,2.3,.63,1.2,.35,.2);sph(head,.075,0xf2a3aa,.46,2.3,.63,1.2,.35,.2);const body=new THREE.Group();g.add(body);sph(body,.61,C.cyan,0,1.48,0,1,.72,.72);sph(body,.59,C.cyan2,0,1.75,-.01,1,.18,.74);sph(body,.58,C.white,0,.99,0,1.04,.22,.79);logo(body,1.49,.47);const arms=[],legs=[];for(const s of[-1,1]){const a=new THREE.Group();sph(a,.2,C.cyan,0,-.02,0);cap(a,.135,.28,C.cyan,0,-.26,0);sph(a,.145,C.skin,0,-.49,.01);a.position.set(s*.62,1.58,0);a.rotation.z=s*.1;g.add(a);arms.push(a);const l=new THREE.Group();cap(l,.12,.22,C.skin,0,-.03,0);sph(l,.28,C.shoe,0,-.34,.1,1.35,.72,1.15);sph(l,.28,C.sole,0,-.46,.1,1.38,.3,1.18);l.position.set(s*.27,.74,0);g.add(l);legs.push(l)}g.userData={armL:arms[0],armR:arms[1],legL:legs[0],legR:legs[1]};return g}const stabi=make();root.add(stabi);const ring=new THREE.Mesh(new THREE.RingGeometry(1.08,1.16,80),new THREE.MeshBasicMaterial({color:0x45e9df,transparent:true,opacity:.78,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.02;root.add(ring);const disc=new THREE.Mesh(new THREE.CircleGeometry(1.04,80),new THREE.MeshBasicMaterial({color:0x0c5256,transparent:true,opacity:.24}));disc.rotation.x=-Math.PI/2;disc.position.y=.015;root.add(disc);let drag=false,lx=0,ly=0,ry=.4,tryy=.4,rx=0,trx=0,zoom=1;renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;tryy+=(e.clientX-lx)*.012;trx=Math.max(-.22,Math.min(.22,trx+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.addEventListener('wheel',e=>zoom=Math.max(.72,Math.min(1.3,zoom+e.deltaY*.0008)),{passive:true});const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(!drag)tryy+=.0022;ry+=(tryy-ry)*.08;rx+=(trx-rx)*.08;root.rotation.y=ry;root.rotation.x=rx;camera.position.set(5.5*zoom,4.4*zoom,7.7*zoom);camera.lookAt(0,1.55,0);const u=stabi.userData,s=Math.sin(t*3);u.armL.rotation.x=s*.11;u.armR.rotation.x=-s*.11;u.legL.rotation.x=-s*.07;u.legR.rotation.x=s*.07;stabi.position.y=.06+Math.sin(t*2.1)*.03;ring.rotation.z=t*.35;renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);loop();</script></body></html>
