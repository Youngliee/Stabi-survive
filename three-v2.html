<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive 3D v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fcaa8;font-family:system-ui;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}.hud{position:absolute;top:10px;right:10px;display:flex;gap:6px}.pill{background:#082a25dd;border:1px solid #79e5d4;border-radius:12px;padding:7px 10px;font-size:11px}.obj{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#082a25d9;border:1px solid #79e5d466;border-radius:12px;padding:8px 12px;font-size:11px}.mini{position:absolute;right:12px;top:105px;width:92px;height:92px;border-radius:50%;background:#123d34cc;border:2px solid #79e5d477}.mini:after{content:'▲';position:absolute;left:39px;top:34px;color:#fff}.stick{display:none;position:fixed;width:118px;height:118px;border-radius:50%;background:#0b312b88;border:2px solid #b6fff477;touch-action:none;z-index:3;pointer-events:none}.stick.active{display:block}.knob{position:absolute;width:44px;height:44px;border-radius:50%;left:35px;top:35px;background:#78e4d4;box-shadow:0 0 22px #78e4d488;transform:translate(0,0)}.actions{pointer-events:auto;position:absolute;right:18px;bottom:20px;display:flex;gap:10px;align-items:end}.btn{width:68px;height:68px;border-radius:18px;border:1px solid #8fffee88;background:#0b312bdd;color:white;font-weight:800;touch-action:none}.btn:active{transform:scale(.95)}.atk{width:82px;height:82px;border-color:#ffd75f;color:#ffd75f}.start{pointer-events:auto;position:fixed;inset:0;display:grid;place-items:center;background:#071a18ee;z-index:4}.card{text-align:center;color:#fff}.card h1{font-size:42px;color:#78e4d4;margin:0 0 8px}.card button{padding:13px 20px;border:0;border-radius:12px;background:#78e4d4;font-weight:900}.tag{position:absolute;left:12px;top:12px;background:#082a25d9;padding:8px 10px;border-radius:10px;font-size:10px}#hitmsg{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 10px #000;opacity:0;transition:.15s}#hitmsg.show{opacity:1}@media(max-width:600px){.tag{display:none}.hud{left:8px;right:8px;justify-content:flex-end}.pill{padding:6px 8px;font-size:10px}.obj{top:52px}.mini{top:92px}}</style></head><body><div class="start" id="start"><div class="card"><h1>STABI SURVIVE 3D</h1><p>Isometric mobile test build</p><button id="go">ENTER FRONTIER</button></div></div><div id="ui"><div class="tag">STABI SURVIVE • 3D V2</div><div class="hud"><div class="pill">HP <b id="hp">100</b></div><div class="pill">USDZ <b id="coin">0</b></div><div class="pill">LVL <b>1</b></div></div><div class="obj">OBJECTIVE • Explore the <b>STABILIZER FRONTIER</b></div><div class="mini"></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="dash">DASH ⚡</button><button class="btn atk" id="attack">✦<br>STABILIZE</button></div><div id="hitmsg"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9cfad);scene.fog=new THREE.Fog(0xa9cfad,34,78);const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,140);const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x5b765b,2.4));const sun=new THREE.DirectionalLight(0xfff0cf,2.8);sun.position.set(-15,28,10);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x8eb87e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);const road=new THREE.MeshStandardMaterial({color:0xc3b49a});[[0,0,8,100],[0,0,100,8],[-23,20,32,5],[22,-20,35,5]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[2],.04,a[3]),road);m.position.set(a[0],.03,a[1]);world.add(m)});const obs=[];function tree(x,z,s=1){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,2*s,6),new THREE.MeshStandardMaterial({color:0x6c4d31}));tr.position.y=s;g.add(tr);const le=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15*s,1),new THREE.MeshStandardMaterial({color:[0x376c4a,0x477c50,0x2f6244][Math.floor(Math.random()*3)]}));le.position.y=2.45*s;le.castShadow=true;g.add(le);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:.65*s})}function rock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.7*s),new THREE.MeshStandardMaterial({color:0x7b8278}));m.position.set(x,.5*s,z);m.scale.y=.7;world.add(m);obs.push({x,z,r:.55*s})}for(let i=0;i<95;i++){const x=(Math.random()-.5)*98,z=(Math.random()-.5)*98;if(Math.abs(x)<6||Math.abs(z)<6)continue;(Math.random()<.78?tree:rock)(x,z,.65+Math.random()*.55)}function house(x,z){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(5,2.8,4),new THREE.MeshStandardMaterial({color:0x496b5e}));b.position.y=1.4;g.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(3.7,2,4),new THREE.MeshStandardMaterial({color:0x7c5545}));r.position.y=3.6;r.rotation.y=Math.PI/4;g.add(r);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:3})}house(-18,-17);house(19,16);function stabi(){const g=new THREE.Group(),teal=new THREE.MeshStandardMaterial({color:0x5f918d}),white=new THREE.MeshStandardMaterial({color:0xf3fffc}),dark=new THREE.MeshStandardMaterial({color:0x163b39});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.75,5,10),teal);body.position.y=1.05;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.58,14,10),white);head.position.y=2.05;head.scale.y=.88;g.add(head);[-.18,.18].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.055,7,5),dark);e.position.set(x,2.08,.53);g.add(e)});const halo=new THREE.Mesh(new THREE.TorusGeometry(.72,.055,7,20),new THREE.MeshStandardMaterial({color:0x8ff8e8,emissive:0x3f9f91,emissiveIntensity:1.5}));halo.rotation.x=Math.PI/2;halo.position.y=2.7;g.add(halo);return g}const p=stabi();p.position.set(0,0,8);world.add(p);const enemyColors=[0xe85e73,0x9c6ee7,0x4fbfd1],enemies=[],effects=[];function makeHpBar(){const g=new THREE.Group(),bg=new THREE.Mesh(new THREE.PlaneGeometry(1.4,.16),new THREE.MeshBasicMaterial({color:0x250b0f,side:THREE.DoubleSide})),fill=new THREE.Mesh(new THREE.PlaneGeometry(1.32,.1),new THREE.MeshBasicMaterial({color:0x46df78,side:THREE.DoubleSide}));bg.position.y=1.72;fill.position.set(0,1.72,.01);bg.rotation.x=-Math.PI/2;fill.rotation.x=-Math.PI/2;g.add(bg,fill);return{g,fill}}function spawn(){const a=Math.random()*Math.PI*2,r=18+Math.random()*10,g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:enemyColors[Math.floor(Math.random()*3)],emissive:0x251025,emissiveIntensity:.35});const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,1),mat);core.position.y=.75;g.add(core);for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.18,.8,5),mat);s.position.set(Math.cos(i*2.09)*.75,.75,Math.sin(i*2.09)*.75);s.rotation.z=Math.PI/2;g.add(s)}const bar=makeHpBar();g.add(bar.g);g.position.set(p.position.x+Math.cos(a)*r,0,p.position.z+Math.sin(a)*r);world.add(g);enemies.push({g,hp:100,max:100,s:2.2+Math.random(),bar:bar.fill,mat,flash:0,dead:0,knock:new THREE.Vector3()})}for(let i=0;i<7;i++)spawn();let joy={x:0,y:0,id:null,cx:0,cy:0},started=false,last=0,dash=0,atk=0,hp=100,coins=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob'),hitmsg=document.getElementById('hitmsg');function resetJoy(){joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)';stick.classList.remove('active')}function joyUpdate(e){const max=36;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const d=Math.hypot(dx,dy)||1,k=Math.min(1,max/d);dx*=k;dy*=k;knob.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/max;joy.y=dy/max}function isActionTarget(t){return !!t.closest('.actions,.start')}document.addEventListener('pointerdown',e=>{if(!started||joy.id!==null||isActionTarget(e.target))return;if(e.clientX>innerWidth*.62)return;e.preventDefault();joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;stick.style.left=(joy.cx-59)+'px';stick.style.top=(joy.cy-59)+'px';stick.classList.add('active');joyUpdate(e)},{passive:false});document.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;e.preventDefault();joyUpdate(e)},{passive:false});document.addEventListener('pointerup',e=>{if(e.pointerId===joy.id)resetJoy()});document.addEventListener('pointercancel',e=>{if(e.pointerId===joy.id)resetJoy()});window.addEventListener('blur',resetJoy);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetJoy()});function pulse(){const m=new THREE.Mesh(new THREE.RingGeometry(.8,1.15,28),new THREE.MeshBasicMaterial({color:0x8ff8e8,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.copy(p.position);m.position.y=.1;world.add(m);effects.push({m,t:0,max:.35})}function showHit(n){hitmsg.textContent=n?`HIT ×${n}`:'MISS';hitmsg.classList.add('show');setTimeout(()=>hitmsg.classList.remove('show'),180)}function doAttack(){if(atk>0)return;atk=.38;pulse();let hits=0;enemies.forEach(en=>{if(en.dead)return;const d=en.g.position.distanceTo(p.position);if(d<=5.4){hits++;en.hp-=42;en.flash=.14;en.mat.emissive.setHex(0xffffff);en.mat.emissiveIntensity=1.8;const k=new THREE.Vector3().subVectors(en.g.position,p.position);k.y=0;if(k.lengthSq()<.01)k.set(1,0,0);k.normalize().multiplyScalar(8);en.knock.copy(k)}});showHit(hits)}document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(dash<=0)dash=.28});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();doAttack()});document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';started=true;last=performance.now()};function blocked(x,z){if(Math.abs(x)>52||Math.abs(z)>52)return true;return obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.55)}function loop(t){requestAnimationFrame(loop);if(!started){ren.render(scene,cam);return}const dt=Math.min(.033,(t-last)/1000||.016);last=t;dash=Math.max(0,dash-dt);atk=Math.max(0,atk-dt);let mx=joy.x,mz=joy.y;if(Math.hypot(mx,mz)>.08){const l=Math.hypot(mx,mz);mx/=l;mz/=l;const sp=5.8*(dash>0?2.6:1),nx=p.position.x+mx*sp*dt,nz=p.position.z+mz*sp*dt;if(!blocked(nx,p.position.z))p.position.x=nx;if(!blocked(p.position.x,nz))p.position.z=nz;p.rotation.y=Math.atan2(mx,mz)}for(let i=enemies.length-1;i>=0;i--){const en=enemies[i];if(en.dead){en.dead-=dt;en.g.scale.multiplyScalar(Math.max(.72,1-dt*3));en.g.rotation.y+=dt*10;if(en.dead<=0){world.remove(en.g);enemies.splice(i,1);coins+=3;spawn()}continue}if(en.flash>0){en.flash-=dt;if(en.flash<=0){en.mat.emissive.setHex(0x251025);en.mat.emissiveIntensity=.35}}if(en.knock.lengthSq()>.01){en.g.position.addScaledVector(en.knock,dt);en.knock.multiplyScalar(Math.pow(.02,dt))}const ratio=Math.max(0,en.hp/en.max);en.bar.scale.x=Math.max(.001,ratio);en.bar.position.x=-(1-ratio)*.66;en.bar.material.color.setHex(ratio>.5?0x46df78:ratio>.25?0xffd75f:0xff556a);if(en.hp<=0){en.dead=.32;continue}const d=new THREE.Vector3().subVectors(p.position,en.g.position);d.y=0;const len=d.length();if(len>1.25){d.normalize();en.g.position.addScaledVector(d,en.s*dt)}else hp=Math.max(0,hp-12*dt);en.g.rotation.y+=dt*1.8}for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.t+=dt;const q=e.t/e.max;e.m.scale.setScalar(1+q*4.5);e.m.material.opacity=1-q;if(e.t>=e.max){world.remove(e.m);effects.splice(i,1)}}document.getElementById('hp').textContent=Math.ceil(hp);document.getElementById('coin').textContent=coins;const offset=new THREE.Vector3(13,22,17),desired=p.position.clone().add(offset);cam.position.lerp(desired,1-Math.pow(.002,dt));const target=p.position.clone().add(new THREE.Vector3(0,0,-3.5));cam.lookAt(target.x,1,target.z);ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);resetJoy()});</script></body></html>
