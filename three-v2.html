<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive 3D v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fcaa8;font-family:system-ui;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}.hud{position:absolute;top:10px;right:10px;display:flex;gap:6px}.pill{background:#082a25dd;border:1px solid #79e5d4;border-radius:12px;padding:7px 10px;font-size:11px}.obj{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#082a25d9;border:1px solid #79e5d466;border-radius:12px;padding:8px 12px;font-size:11px}.mini{position:absolute;right:12px;top:105px;width:92px;height:92px;border-radius:50%;background:#123d34cc;border:2px solid #79e5d477}.mini:after{content:'▲';position:absolute;left:39px;top:34px;color:#fff}.stick{pointer-events:auto;position:absolute;left:18px;bottom:20px;width:118px;height:118px;border-radius:50%;background:#0b312b88;border:2px solid #b6fff455;touch-action:none}.knob{position:absolute;width:44px;height:44px;border-radius:50%;left:35px;top:35px;background:#78e4d4;box-shadow:0 0 22px #78e4d488;transform:translate(0,0)}.actions{pointer-events:auto;position:absolute;right:18px;bottom:20px;display:flex;gap:10px;align-items:end}.btn{width:68px;height:68px;border-radius:18px;border:1px solid #8fffee88;background:#0b312bdd;color:white;font-weight:800}.atk{width:82px;height:82px;border-color:#ffd75f;color:#ffd75f}.start{pointer-events:auto;position:fixed;inset:0;display:grid;place-items:center;background:#071a18ee;z-index:4}.card{text-align:center;color:#fff}.card h1{font-size:42px;color:#78e4d4;margin:0 0 8px}.card button{padding:13px 20px;border:0;border-radius:12px;background:#78e4d4;font-weight:900}.tag{position:absolute;left:12px;top:12px;background:#082a25d9;padding:8px 10px;border-radius:10px;font-size:10px}@media(max-width:600px){.tag{display:none}.hud{left:8px;right:8px;justify-content:flex-end}.pill{padding:6px 8px;font-size:10px}.obj{top:52px}.mini{top:92px}}</style></head><body><div class="start" id="start"><div class="card"><h1>STABI SURVIVE 3D</h1><p>Isometric mobile test build</p><button id="go">ENTER FRONTIER</button></div></div><div id="ui"><div class="tag">STABI SURVIVE • 3D V2</div><div class="hud"><div class="pill">HP <b id="hp">100</b></div><div class="pill">USDZ <b id="coin">0</b></div><div class="pill">LVL <b>1</b></div></div><div class="obj">OBJECTIVE • Explore the <b>STABILIZER FRONTIER</b></div><div class="mini"></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="dash">DASH ⚡</button><button class="btn atk" id="attack">✦<br>STABILIZE</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9cfad);scene.fog=new THREE.Fog(0xa9cfad,34,78);const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,140);const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x5b765b,2.4));const sun=new THREE.DirectionalLight(0xfff0cf,2.8);sun.position.set(-15,28,10);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x8eb87e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);const road=new THREE.MeshStandardMaterial({color:0xc3b49a});[[0,0,8,100],[0,0,100,8],[-23,20,32,5],[22,-20,35,5]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[2],.04,a[3]),road);m.position.set(a[0],.03,a[1]);world.add(m)});const obs=[];function tree(x,z,s=1){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,2*s,6),new THREE.MeshStandardMaterial({color:0x6c4d31}));tr.position.y=1*s;g.add(tr);const le=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15*s,1),new THREE.MeshStandardMaterial({color:[0x376c4a,0x477c50,0x2f6244][Math.floor(Math.random()*3)]}));le.position.y=2.45*s;le.castShadow=true;g.add(le);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:.65*s})}function rock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.7*s),new THREE.MeshStandardMaterial({color:0x7b8278}));m.position.set(x,.5*s,z);m.scale.y=.7;world.add(m);obs.push({x,z,r:.55*s})}for(let i=0;i<95;i++){const x=(Math.random()-.5)*98,z=(Math.random()-.5)*98;if(Math.abs(x)<6||Math.abs(z)<6)continue;(Math.random()<.78?tree:rock)(x,z,.65+Math.random()*.55)}function house(x,z){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(5,2.8,4),new THREE.MeshStandardMaterial({color:0x496b5e}));b.position.y=1.4;g.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(3.7,2,4),new THREE.MeshStandardMaterial({color:0x7c5545}));r.position.y=3.6;r.rotation.y=Math.PI/4;g.add(r);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:3})}house(-18,-17);house(19,16);function stabi(){const g=new THREE.Group(),teal=new THREE.MeshStandardMaterial({color:0x5f918d}),white=new THREE.MeshStandardMaterial({color:0xf3fffc}),dark=new THREE.MeshStandardMaterial({color:0x163b39});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.75,5,10),teal);body.position.y=1.05;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.58,14,10),white);head.position.y=2.05;head.scale.y=.88;g.add(head);[-.18,.18].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.055,7,5),dark);e.position.set(x,2.08,.53);g.add(e)});const halo=new THREE.Mesh(new THREE.TorusGeometry(.72,.055,7,20),new THREE.MeshStandardMaterial({color:0x8ff8e8,emissive:0x3f9f91,emissiveIntensity:1.5}));halo.rotation.x=Math.PI/2;halo.position.y=2.7;g.add(halo);return g}const p=stabi();p.position.set(0,0,8);world.add(p);const enemyMat=[0xe85e73,0x9c6ee7,0x4fbfd1];const enemies=[];function spawn(){const a=Math.random()*Math.PI*2,r=18+Math.random()*10,g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:enemyMat[Math.floor(Math.random()*3)],emissive:0x251025,emissiveIntensity:.35});const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,1),mat);core.position.y=.75;g.add(core);for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.18,.8,5),mat);s.position.set(Math.cos(i*2.09)*.75,.75,Math.sin(i*2.09)*.75);s.rotation.z=Math.PI/2;g.add(s)}g.position.set(p.position.x+Math.cos(a)*r,0,p.position.z+Math.sin(a)*r);world.add(g);enemies.push({g,hp:80,s:2.2+Math.random()})}for(let i=0;i<7;i++)spawn();let joy={x:0,y:0,id:null},started=false,last=0,dash=0,atk=0,hp=100,coins=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob');function joyUpdate(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.31;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy)||1,k=Math.min(1,max/d);dx*=k;dy*=k;knob.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/max;joy.y=dy/max}function joyEnd(e){if(joy.id!==null&&e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)';try{stick.releasePointerCapture(e.pointerId)}catch{}}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);joyUpdate(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();joyUpdate(e)}});stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);stick.addEventListener('lostpointercapture',()=>{joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();if(dash<=0)dash=.28});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();if(atk<=0){atk=.35;enemies.forEach(en=>{if(en.g.position.distanceTo(p.position)<4.2)en.hp-=45});}});document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';started=true;last=performance.now()};function blocked(x,z){if(Math.abs(x)>52||Math.abs(z)>52)return true;return obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.55)}function loop(t){requestAnimationFrame(loop);if(!started){ren.render(scene,cam);return}const dt=Math.min(.033,(t-last)/1000||.016);last=t;dash=Math.max(0,dash-dt);atk=Math.max(0,atk-dt);let mx=joy.x,mz=joy.y;if(Math.hypot(mx,mz)>.08){const l=Math.hypot(mx,mz);mx/=l;mz/=l;const sp=5.8*(dash>0?2.6:1),nx=p.position.x+mx*sp*dt,nz=p.position.z+mz*sp*dt;if(!blocked(nx,p.position.z))p.position.x=nx;if(!blocked(p.position.x,nz))p.position.z=nz;p.rotation.y=Math.atan2(mx,mz)}enemies.forEach((en,i)=>{const d=new THREE.Vector3().subVectors(p.position,en.g.position);d.y=0;const len=d.length();if(len>1.1){d.normalize();en.g.position.addScaledVector(d,en.s*dt)}else{hp=Math.max(0,hp-12*dt)}en.g.rotation.y+=dt*1.8;if(en.hp<=0){world.remove(en.g);enemies.splice(i,1);coins+=3;spawn()}});document.getElementById('hp').textContent=Math.ceil(hp);document.getElementById('coin').textContent=coins;const offset=new THREE.Vector3(13,22,17),desired=p.position.clone().add(offset);cam.position.lerp(desired,1-Math.pow(.002,dt));const target=p.position.clone().add(new THREE.Vector3(0,0,-3.5));cam.lookAt(target.x,1,target.z);ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});</script></body></html>
