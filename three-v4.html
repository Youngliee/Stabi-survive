<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive V4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8db59a;font-family:system-ui;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}.hud{position:absolute;left:12px;top:12px;display:flex;gap:7px}.pill,.quest{background:#0c2b27dd;border:1px solid #79daca88;border-radius:12px;padding:7px 10px;font-size:11px}.quest{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center}.meter{position:absolute;right:14px;top:14px;width:92px;background:#0c2b27dd;border:1px solid #79daca88;border-radius:12px;padding:8px;font-size:9px}.bar{height:6px;background:#193c36;border-radius:6px;margin-top:5px;overflow:hidden}.fill{height:100%;width:76%;background:#72dfcf}.actions{pointer-events:auto;position:absolute;right:18px;bottom:22px;display:flex;gap:10px;align-items:end}.btn{border:1px solid #9ff8e9;background:#0c302bdd;color:white;border-radius:50%;width:64px;height:64px;font-size:9px;font-weight:900;touch-action:none}.mine{width:82px;height:82px;border-color:#ffe074;color:#ffe074}.stick{display:none;position:fixed;width:116px;height:116px;border-radius:50%;background:#0b302a55;border:2px solid #b7fff566}.stick.on{display:block}.knob{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:#78dfcf}.start{pointer-events:auto;position:fixed;inset:0;display:grid;place-items:center;background:#092521ee;z-index:9}.card{text-align:center}.card h1{font-size:38px;color:#7ce4d4;margin:0}.card button{border:0;border-radius:12px;padding:13px 24px;font-weight:900;background:#78dfcf}.toast{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:#092521dd;border:1px solid #78dfcf;border-radius:12px;padding:8px 12px;opacity:0}.toast.on{opacity:1}@media(max-width:600px){.quest{top:47px;font-size:9px}.pill{font-size:9px;padding:5px 7px}}</style></head><body><div class="start" id="start"><div class="card"><h1>STABI SURVIVE</h1><p>STABILIZER FRONTIER • V4</p><button id="go">ENTER FRONTIER</button></div></div><div id="ui"><div class="hud"><div class="pill">❤ <b id="hp">100</b></div><div class="pill">⚡ <b id="energy">100</b></div><div class="pill">USDZ <b id="usdz">0</b></div></div><div class="quest">FRONTIER SIGNAL • Collect Stability Shards</div><div class="meter">STABILITY<div class="bar"><div class="fill"></div></div></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="dash">DASH</button><button class="btn mine" id="mine">✦<br>STABILIZE</button></div><div class="toast" id="toast"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x9dc8ae);scene.fog=new THREE.Fog(0x9dc8ae,42,100);const cam=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,180),ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.4));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xfff8df,0x45634e,2.7));const sun=new THREE.DirectionalLight(0xffe5b3,2.3);sun.position.set(-15,30,18);scene.add(sun);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x7da36d,roughness:1}));ground.rotation.x=-Math.PI/2;world.add(ground);const roadMat=new THREE.MeshStandardMaterial({color:0xc7ae82});[[0,0,10,135],[0,-5,125,8],[-28,22,45,6],[29,-27,48,6]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[2],.04,a[3]),roadMat);m.position.set(a[0],.03,a[1]);world.add(m)});const obstacles=[];function rock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),new THREE.MeshStandardMaterial({color:0x617064,roughness:1}));m.scale.y=.7;m.position.set(x,.55*s,z);m.rotation.set(Math.random(),Math.random(),0);world.add(m);obstacles.push({x,z,r:s*.7})}for(let i=0;i<65;i++){const x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.abs(x)<8||Math.abs(z+5)<7)continue;rock(x,z,.45+Math.random()*1.1)}function tree(x,z,s=.8){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.28*s,1.7*s,6),new THREE.MeshStandardMaterial({color:0x6a4931})),l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05*s,1),new THREE.MeshStandardMaterial({color:0x356d47}));tr.position.y=.85*s;l.position.y=2.05*s;g.add(tr,l);g.position.set(x,0,z);world.add(g);obstacles.push({x,z,r:.5*s})}for(let i=0;i<65;i++){const x=(Math.random()-.5)*135,z=(Math.random()-.5)*135;if(Math.abs(x)<8||Math.abs(z+5)<7)continue;tree(x,z,.55+Math.random()*.65)}function makeStabi(){const g=new THREE.Group(),teal=new THREE.MeshStandardMaterial({color:0x5f918d}),white=new THREE.MeshStandardMaterial({color:0xf6fffd});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.52,.75,5,10),teal);body.position.y=1;const head=new THREE.Mesh(new THREE.SphereGeometry(.57,14,10),white);head.scale.y=.88;head.position.y=2;const halo=new THREE.Mesh(new THREE.TorusGeometry(.7,.055,7,20),new THREE.MeshStandardMaterial({color:0x8ff8e8,emissive:0x48bfae,emissiveIntensity:1.6}));halo.rotation.x=Math.PI/2;halo.position.y=2.66;g.add(body,head,halo);return g}const player=makeStabi();player.position.set(0,0,11);world.add(player);const shards=[];function shard(x,z){const mat=new THREE.MeshStandardMaterial({color:0x73e6d5,emissive:0x2a9f91,emissiveIntensity:1.4}),m=new THREE.Mesh(new THREE.OctahedronGeometry(.7),mat);m.position.set(x,.85,z);world.add(m);shards.push({m,hp:3})}[[8,-5],[-8,-17],[18,8],[-20,18],[27,-21],[-29,-8]].forEach(p=>shard(...p));const enemies=[];function anomaly(x,z,type=0){const colors=[0xe35e6b,0x8c68d7,0xe09c4c],mat=new THREE.MeshStandardMaterial({color:colors[type],emissive:0x26121a,emissiveIntensity:.35}),m=new THREE.Mesh(new THREE.IcosahedronGeometry(type===2?1:.72,1),mat);m.position.set(x,.85,z);world.add(m);enemies.push({m,hp:type===2?150:90,s:type===0?2.6:2,dead:0,mat})}for(let i=0;i<9;i++){const a=Math.random()*6.28,r=18+Math.random()*34;anomaly(Math.cos(a)*r,Math.sin(a)*r,i%3)}const cracks=[];function crack(x,z){const g=new THREE.Group();for(let i=0;i<4;i++){const q=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,2.4),new THREE.MeshBasicMaterial({color:0x6fe5d3}));q.position.set((Math.random()-.5)*1.4,.06,(i-1.5)*1.8);q.rotation.y=(Math.random()-.5)*.8;g.add(q)}g.position.set(x,0,z);world.add(g);cracks.push(g)}crack(-15,5);crack(23,19);crack(-26,-23);let joy={x:0,y:0,id:null,cx:0,cy:0},started=false,last=0,dash=0,hp=100,energy=100,usdz=0,mineCd=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob'),toast=document.getElementById('toast');function say(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),650)}function resetJoy(){joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)';stick.classList.remove('on')}function upd(e){const max=35;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,max/d);dx*=k;dy*=k;joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}function joyZone(e){return e.clientX<innerWidth*.4&&e.clientY>innerHeight*.6}document.addEventListener('pointerdown',e=>{if(!started||joy.id!==null||e.target.closest('.actions,.start')||!joyZone(e))return;e.preventDefault();joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;stick.style.left=joy.cx-58+'px';stick.style.top=joy.cy-58+'px';stick.classList.add('on');upd(e)},{passive:false});document.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();upd(e)}},{passive:false});['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerId===joy.id)resetJoy()}));window.addEventListener('blur',resetJoy);document.getElementById('dash').onpointerdown=e=>{e.preventDefault();e.stopPropagation();if(energy<15)return say('LOW ENERGY');energy-=15;dash=.28};function pulse(){const m=new THREE.Mesh(new THREE.RingGeometry(.65,.95,28),new THREE.MeshBasicMaterial({color:0x83f2df,transparent:true,opacity:.85,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.copy(player.position);m.position.y=.08;world.add(m);let n=0,id=setInterval(()=>{n++;m.scale.setScalar(1+n*.2);m.material.opacity-=.08;if(n>9){clearInterval(id);world.remove(m)}},25)}document.getElementById('mine').onpointerdown=e=>{e.preventDefault();e.stopPropagation();if(mineCd>0)return;mineCd=.35;pulse();let hit=false;for(let i=shards.length-1;i>=0;i--){const s=shards[i];if(s.m.position.distanceTo(player.position)<4.8){s.hp--;hit=true;s.m.scale.multiplyScalar(.86);if(s.hp<=0){world.remove(s.m);shards.splice(i,1);usdz+=5;say('+5 USDZ')}}}enemies.forEach(en=>{if(!en.dead&&en.m.position.distanceTo(player.position)<4.8){en.hp-=35;hit=true;en.mat.emissive.setHex(0xffffff);setTimeout(()=>en.mat.emissive.setHex(0x26121a),90)}});if(!hit)say('NO TARGET')};document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';started=true;last=performance.now()};function blocked(x,z){return Math.abs(x)>70||Math.abs(z)>70||obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.45)}function angleLerp(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI)%(Math.PI*2)-Math.PI;return a+d*t}const CAM_OFFSET=new THREE.Vector3(8.5,17,14),CAM_LOOK=new THREE.Vector3(0,0,-1.8),desired=new THREE.Vector3(),target=new THREE.Vector3();cam.position.copy(player.position).add(CAM_OFFSET);cam.lookAt(player.position.x,1,player.position.z-1.8);function loop(t){requestAnimationFrame(loop);if(!started){ren.render(scene,cam);return}const dt=Math.min(.033,(t-last)/1000||.016);last=t;dash=Math.max(0,dash-dt);mineCd=Math.max(0,mineCd-dt);energy=Math.min(100,energy+8*dt);let mx=joy.x,mz=joy.y;if(Math.hypot(mx,mz)>.08){const l=Math.hypot(mx,mz);mx/=l;mz/=l;const yaw=Math.atan2(mx,mz),sp=5.8*(dash>0?2.3:1),nx=player.position.x+mx*sp*dt,nz=player.position.z+mz*sp*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=angleLerp(player.rotation.y,yaw,Math.min(1,dt*12))}shards.forEach(s=>{s.m.rotation.y+=dt*1.6;s.m.position.y=.85+Math.sin(t*.003+s.m.position.x)*.12});for(let i=enemies.length-1;i>=0;i--){const en=enemies[i];if(en.hp<=0&&!en.dead){en.dead=.3;usdz+=3;say('+3 USDZ')}if(en.dead){en.dead-=dt;en.m.scale.multiplyScalar(.93);if(en.dead<=0){world.remove(en.m);enemies.splice(i,1)}continue}const v=new THREE.Vector3().subVectors(player.position,en.m.position);v.y=0;const d=v.length();if(d<13&&d>1.3){v.normalize();en.m.position.addScaledVector(v,en.s*dt)}else if(d<=1.3)hp=Math.max(0,hp-10*dt)}document.getElementById('hp').textContent=Math.ceil(hp);document.getElementById('energy').textContent=Math.ceil(energy);document.getElementById('usdz').textContent=usdz;desired.copy(player.position).add(CAM_OFFSET);const follow=1-Math.exp(-dt*6);cam.position.lerp(desired,follow);target.copy(player.position).add(CAM_LOOK);cam.lookAt(target.x,1,target.z);ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);resetJoy()});</script></body></html>
