<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive NEW 128px Pack Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061718;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;z-index:10;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}.box{background:#062326e8;border:1px solid #55ddd5;border-radius:10px;padding:6px 8px;font-size:11px;font-weight:900}.hp{width:125px}.bar{height:6px;background:#263638;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:100%;background:#5de2b4}.panel{position:fixed;z-index:25;inset:0;display:grid;place-items:center;padding:18px;background:#031112ed}.card{width:min(92vw,420px);padding:22px;background:#09282b;border:1px solid #54ded5;border-radius:18px;text-align:center}.btn{width:100%;border:0;border-radius:12px;padding:12px 16px;background:#63ddd5;color:#062022;font-weight:900;font-size:16px}.btn:disabled{opacity:.45}.hidden{display:none!important}.status{font-size:12px;color:#7fe3dc;margin:10px 0}.controls{position:fixed;z-index:15;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:end}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}.ctrl{width:48px;height:48px;border:1px solid #55ded6;background:#08262bdc;color:#fff;border-radius:13px;font-size:20px;touch-action:none}.right{display:flex;gap:8px}.round{width:68px;height:68px;border-radius:50%;font-size:11px}.round:disabled{opacity:.45}#ultimate:not(:disabled){background:#63ddd5;color:#062022;box-shadow:0 0 18px #63ddd5}.bossbar{position:fixed;z-index:11;top:48px;left:50%;transform:translateX(-50%);width:min(72vw,520px);display:none;text-align:center;font-size:12px;font-weight:900}.bossbar .bar{height:9px;border:1px solid #ff685b}.bossbar .bar i{background:#ff4f45}.wave{position:fixed;z-index:12;top:78px;left:50%;transform:translateX(-50%);font:900 18px Arial;color:#ff9188;pointer-events:none}@media(min-width:900px) and (pointer:fine){.controls{display:none}}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">USDZ <span id="coinv">0</span></div><div class="box">KO <span id="killv">0</span></div><div class="box"><span id="timev">0</span>s</div></div><div id="bossbar" class="bossbar">MEV BOT<div class="bar"><i id="bossfill"></i></div></div><div id="wave" class="wave"></div><section id="start" class="panel"><div class="card"><h1>STABI SURVIVE</h1><p>NEW 128px PACK — walk, attack, dash, hurt & death 4-direction.</p><div id="status" class="status">Loading NEW 128px Stabi pack…</div><button id="play" class="btn" disabled>PLAY</button></div></section><section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="again" class="btn">RUN AGAIN</button></div></section><section id="win" class="panel hidden"><div class="card"><h1>VICTORY</h1><p id="winresult"></p><button id="winagain" class="btn">PLAY AGAIN</button></div></section><div class="controls"><div class="pad"><span></span><button class="ctrl" data-k="up">▲</button><span></span><button class="ctrl" data-k="left">◀</button><span></span><button class="ctrl" data-k="right">▶</button><span></span><button class="ctrl" data-k="down">▼</button><span></span></div><div class="right"><button id="ultimate" class="ctrl round" disabled>ULT<br><span id="ultpct">0%</span></button><button id="dash" class="ctrl round">DASH</button></div></div><script>(()=>{const $=id=>document.getElementById(id),cv=$('g'),ctx=cv.getContext('2d'),DPR=Math.min(devicePixelRatio||1,3),CELL=128;function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const W=()=>cv.width/DPR,H=()=>cv.height/DPR;const img={};
async function loadMiniHD(){
  const parts=[...Array.from({length:7},(_,i)=>`test-new128-avif/player-${String(i).padStart(2,'0')}.b64`),'test-new128-avif/player-07a.b64','test-new128-avif/player-07b.b64'];
  let b64='';
  for(const u of parts){
    const r=await fetch(u+'?v=new128final2');
    if(!r.ok) throw new Error('player pack '+r.status);
    b64+=(await r.text()).replace(/\s+/g,'');
  }
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:'image/avif'}));
  img.player=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('player decode'));im.src=url});
  const paths={enemy:'assets/atlases/red-slime-atlas.webp',boss:'assets/atlases/mech-boss-atlas.webp',coin:'assets/coin.webp'};
  await Promise.all(Object.entries(paths).map(([k,v])=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{img[k]=im;ok()};im.onerror=()=>no(new Error(v));im.src=v+'?v=new128final2'})));
}
loadMiniHD().then(()=>{$('status').textContent='NEW 128px full animation ready ✓';$('play').disabled=false}).catch(e=>$('status').textContent='Asset error: '+e.message);
const keys={up:0,down:0,left:0,right:0};let run=false,last=0,t=0,spawn=0,bossed=false,bossKilled=false,en=[],bosses=[],drops=[],slashes=[];const p={x:300,y:300,hp:100,r:27,speed:220,dir:'down',anim:0,coin:0,kills:0,inv:0,dash:0,cd:0,ult:0,ultT:0,atkT:0,hurtT:0,dead:false,deathT:0};const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){t=spawn=0;bossed=bossKilled=false;en=[];bosses=[];drops=[];slashes=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',anim:0,inv:0,dash:0,cd:0,ult:0,ultT:0,atkT:0,hurtT:0,dead:false,deathT:0});$('bossbar').style.display='none';$('wave').textContent='';hud()}function edge(){const q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-50]:q===1?[W()+50,r*H()]:q===2?[r*W(),H()+50]:[-50,r*H()]}function spawnEnemy(){const[x,y]=edge();en.push({x,y,hp:38,r:24,s:76+Math.min(t*.5,35),anim:Math.random()*6,hurt:0,dead:0,atk:0,flip:false})}function spawnBoss(){bosses=[{x:W()/2,y:-110,hp:480,max:480,r:58,s:49,anim:0,hurt:0,dead:0,atk:0,flip:false}];bossed=true;$('bossbar').style.display='block';$('wave').textContent='BOSS WAVE';setTimeout(()=>{if(run)$('wave').textContent=''},1600)}function nearest(){return[...en,...bosses].filter(m=>m.hp>0&&!m.dead).sort((a,b)=>d(p,a)-d(p,b))[0]}function loot(m,isBoss){if(isBoss){for(let i=0;i<6;i++)drops.push({x:m.x+(Math.random()-.5)*70,y:m.y+(Math.random()-.5)*50,type:'coin',a:Math.random()*6});drops.push({x:m.x,y:m.y-40,type:'heart',a:0})}else{const r=Math.random();if(r<.72)drops.push({x:m.x,y:m.y,type:'coin',a:0});else if(r<.90)drops.push({x:m.x,y:m.y,type:'heart',a:0})}}function hit(m,dam,isBoss){m.hp-=dam;m.hurt=.18;if(m.hp<=0&&!m.dead){m.hp=0;m.dead=isBoss?.9:.58;p.kills++;p.ult=Math.min(100,p.ult+(isBoss?50:14));loot(m,isBoss);if(isBoss)bossKilled=true}}function attack(){if(p.cd>0||p.dead)return;const n=nearest();if(!n||d(p,n)>140)return;const dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.cd=.55;p.atkT=.42;slashes.push({x:p.x,y:p.y,a:Math.atan2(dy,dx),life:0});en.forEach(m=>{if(m.hp>0&&!m.dead&&d(p,m)<142)hit(m,28,false)});bosses.forEach(m=>{if(m.hp>0&&!m.dead&&d(p,m)<150)hit(m,34,true)})}function useUlt(){if(p.ult<100||p.ultT>0||p.dead)return;p.ult=0;p.ultT=.72;p.inv=Math.max(p.inv,.8);en.forEach(m=>{if(m.hp>0&&!m.dead&&d(p,m)<230)hit(m,95,false)});bosses.forEach(m=>{if(m.hp>0&&!m.dead&&d(p,m)<245)hit(m,125,true)})}function update(dt){if(p.dead){p.deathT+=dt;p.anim+=dt;if(p.deathT>1.15)end(false);hud();return}t+=dt;spawn+=dt;p.anim+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.cd=Math.max(0,p.cd-dt);p.ultT=Math.max(0,p.ultT-dt);p.atkT=Math.max(0,p.atkT-dt);p.hurtT=Math.max(0,p.hurtT-dt);let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');const s=p.speed*(p.dash?2:1);p.x+=dx/l*s*dt;p.y+=dy/l*s*dt}p.x=Math.max(40,Math.min(W()-40,p.x));p.y=Math.max(70,Math.min(H()-40,p.y));attack();if(!bossKilled&&spawn>Math.max(.62,1.2-t*.01)){spawn=0;spawnEnemy()}if(t>20&&!bossed)spawnBoss();for(const m of[...en,...bosses]){m.anim+=dt*7;m.hurt=Math.max(0,m.hurt-dt);m.atk=Math.max(0,m.atk-dt);if(m.dead>0){m.dead-=dt;continue}const dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.flip=dx<0;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(d(p,m)<p.r+m.r&&p.inv<=0){m.atk=.3;p.hp-=bosses.includes(m)?22:10;p.inv=.58;p.hurtT=.32}}en=en.filter(m=>m.hp>0||m.dead>0);bosses=bosses.filter(m=>m.hp>0||m.dead>0);for(let i=drops.length-1;i>=0;i--){const q=drops[i];q.a+=dt*5;if(d(p,q)<44){if(q.type==='heart')p.hp=Math.min(100,p.hp+25);else p.coin++;drops.splice(i,1)}}for(let i=slashes.length-1;i>=0;i--){slashes[i].life+=dt;if(slashes[i].life>.18)slashes.splice(i,1)}if(p.hp<=0&&!p.dead){p.hp=0;p.dead=true;p.deathT=0;p.inv=99}if(bossKilled&&bosses.length===0){end(true);return}hud()}function hud(){$('hpv').textContent=Math.ceil(Math.max(0,p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('killv').textContent=p.kills;$('timev').textContent=Math.floor(t);$('ultpct').textContent=Math.floor(p.ult)+'%';$('ultimate').disabled=p.ult<100||p.ultT>0||p.dead;const b=bosses[0];if(b&&b.hp>0)$('bossfill').style.width=100*b.hp/b.max+'%';else if(bossed)$('bossbar').style.display='none'}function bg(){ctx.fillStyle='#08292a';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#143e40';ctx.lineWidth=1;for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}}function tile(im,sx,sy,sw,sh,x,y,w,h,a=1,flip=false){ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=a;if(flip){ctx.translate(x+w,0);ctx.scale(-1,1);x=0}ctx.drawImage(im,sx,sy,sw,sh,Math.round(x),Math.round(y),Math.round(w),Math.round(h));ctx.restore()}function hero(){if(!img.player)return;const moving=keys.up||keys.down||keys.left||keys.right;const dirRow={down:0,left:1,right:2,up:3}[p.dir]??0;let sx=dirRow*CELL,sy=0,fr=0;if(p.dead){fr=Math.min(5,Math.floor(Math.min(1,p.deathT/1.05)*6));sx=fr*CELL;sy=(17+dirRow)*CELL}else if(p.hurtT>0){fr=Math.min(4,Math.floor(Math.min(1,(.32-p.hurtT)/.32)*5));sx=fr*CELL;sy=(13+dirRow)*CELL}else if(p.atkT>0){fr=Math.min(4,Math.floor(Math.min(1,(.42-p.atkT)/.42)*5));sx=fr*CELL;sy=(5+dirRow)*CELL}else if(p.dash>0){fr=Math.floor(p.anim*14)%4;sx=fr*CELL;sy=(9+dirRow)*CELL}else if(moving){fr=Math.floor(p.anim*7)%4;sx=fr*CELL;sy=(1+dirRow)*CELL}const DRAW=176,BASE=p.y+74;ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=(p.inv>0&&p.inv<90&&Math.floor(p.inv*18)%2)?0.4:1;ctx.drawImage(img.player,sx,sy,CELL,CELL,Math.round(p.x-DRAW/2),Math.round(BASE-DRAW),DRAW,DRAW);ctx.restore()}function mob(m,isBoss){const im=isBoss?img.boss:img.enemy;if(!im)return;const cs=isBoss?20:16;let row=1,frames=8;if(m.dead>0){row=4;frames=6}else if(m.hurt>0){row=3;frames=isBoss?4:8}else if(m.atk>0){row=2;frames=isBoss?6:7}let fr=Math.floor(m.anim)%frames;if(m.dead>0){const total=isBoss?.9:.58;fr=Math.min(frames-1,Math.floor((total-m.dead)/total*frames))}const sz=isBoss?120:72;ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=m.hurt>0?.7:1;if(m.flip){ctx.translate(m.x+sz/2,0);ctx.scale(-1,1);ctx.drawImage(im,fr*cs,row*cs,cs,cs,0,m.y-sz/2,sz,sz)}else ctx.drawImage(im,fr*cs,row*cs,cs,cs,m.x-sz/2,m.y-sz/2,sz,sz);ctx.restore()}function drawDrop(q){const y=q.y+Math.sin(q.a)*3;if(q.type==='heart'){ctx.save();ctx.translate(q.x,y);ctx.fillStyle='#6dfff0';ctx.shadowBlur=12;ctx.shadowColor='#6dfff0';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(12,-4);ctx.lineTo(6,17);ctx.lineTo(-6,17);ctx.lineTo(-12,-4);ctx.closePath();ctx.fill();ctx.restore()}else ctx.drawImage(img.coin,q.x-17,y-17,34,34)}function slash(){for(const s of slashes){const a=1-s.life/.18;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle=`rgba(116,255,235,${a})`;ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,0,80,-.7,.7);ctx.stroke();ctx.restore()}if(p.ultT>0){const a=p.ultT/.72;ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle=`rgba(90,255,235,${a})`;ctx.lineWidth=14;ctx.beginPath();ctx.arc(0,0,95+(1-a)*90,0,Math.PI*2);ctx.stroke();ctx.restore()}}function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();drops.forEach(drawDrop);en.forEach(m=>mob(m,false));bosses.forEach(m=>mob(m,true));hero();slash()}function loop(ts){if(!run)return;if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function start(){$('start').classList.add('hidden');$('over').classList.add('hidden');$('win').classList.add('hidden');reset();run=true;last=0;requestAnimationFrame(loop)}function end(won){if(!run)return;run=false;if(won){$('winresult').innerHTML=`MEV BOT defeated<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('win').classList.remove('hidden')}else{$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}}$('play').onclick=start;$('again').onclick=start;$('winagain').onclick=start;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18;if(k==='q'||k==='e')useUlt()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dash').onpointerdown=e=>{e.preventDefault();p.dash=.18};$('ultimate').onpointerdown=e=>{e.preventDefault();useUlt()};draw()})();</script></body></html>
