<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stabi Survive Full Animation Deploy Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071617;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.hud{position:fixed;z-index:10;top:8px;left:8px;right:8px;display:flex;gap:7px;justify-content:space-between;pointer-events:none}
.box{background:#062326df;border:1px solid #57ded5;border-radius:10px;padding:6px 8px;font-size:11px;font-weight:900}
.hp{width:125px}.bar{height:6px;background:#263537;border-radius:20px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:100%;background:#5de2b4}
.panel{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:18px;background:#031112ee}
.card{width:min(92vw,420px);background:#09282b;border:1px solid #54ded5;border-radius:18px;padding:22px;text-align:center}
button{border:0;border-radius:12px;padding:12px 16px;background:#63ddd5;color:#062022;font-weight:900;font-size:16px}
.hidden{display:none}.controls{position:fixed;z-index:12;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}.ctrl{width:48px;height:48px;border:1px solid #55ded6;background:#08262bdc;color:#fff;border-radius:13px;font-size:20px;touch-action:none}
.dash{width:68px;height:68px;border-radius:50%;font-size:11px}#ultimate{background:#123b42;color:#bafbf3}#ultimate:not(:disabled){background:#64e6d8;color:#062022;box-shadow:0 0 18px #64e6d8}
.bossbar{position:fixed;z-index:9;top:48px;left:50%;transform:translateX(-50%);width:min(72vw,520px);display:none;text-align:center;font-size:12px;font-weight:900}.bossbar .bar{height:9px;border:1px solid #ff685b}.bossbar .bar i{background:#ff4f45}
@media(min-width:900px) and (pointer:fine){.controls{display:none}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">USDZ <span id="coinv">0</span></div><div class="box">KO <span id="killv">0</span></div><div class="box"><span id="timev">0</span>s</div></div>
<div id="bossbar" class="bossbar">MEV BOT<div class="bar"><i id="bossfill"></i></div></div>
<section id="start" class="panel"><div class="card"><h1>STABI SURVIVE</h1><p>DEPLOY TEST: Full Stabi animation + Slippage enemy + MEV BOT + USDZ/Health + Ultimate.</p><div id="status" style="font-size:12px;color:#7fe3dc;margin:10px 0">Loading assets...</div><button id="play" disabled>PLAY</button></div></section>
<section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="again">RUN AGAIN</button></div></section>
<div class="controls"><div class="pad"><span></span><button class="ctrl" data-k="up">▲</button><span></span><button class="ctrl" data-k="left">◀</button><span></span><button class="ctrl" data-k="right">▶</button><span></span><button class="ctrl" data-k="down">▼</button><span></span></div><div style="display:flex;gap:8px;align-items:flex-end"><button id="ultimate" class="ctrl dash" disabled>ULT<br><span id="ultpct">0%</span></button><button id="dash" class="ctrl dash">DASH</button></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$('g'),ctx=cv.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,2);function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const W=()=>cv.width/DPR,H=()=>cv.height/DPR;
const img={mega:new Image()};const A={idle:{x:0,y:0},walk:{x:0,y:256},attack:{x:0,y:512},dashrun:{x:0,y:1024},hurtdeath:{x:0,y:1536},enemy:{x:0,y:1792},boss:{x:0,y:2432},ult:{x:0,y:3072},coin:{x:0,y:3200},heart:{x:128,y:3200}};img.mega.onload=()=>{$('status').textContent='Assets ready ✓';$('play').disabled=false};img.mega.onerror=()=>{$('status').textContent='Asset error'};img.mega.src='stabi-game-mega.webp';
const keys={up:0,down:0,left:0,right:0};let run=false,last=0,t=0,spawn=0,bossed=false;let enemies=[],drops=[],slashes=[],bosses=[];const p={x:300,y:300,hp:100,r:27,speed:220,dir:'down',anim:0,coin:0,kills:0,inv:0,dash:0,cd:0,ult:0,ultT:0,atkT:0,hurtT:0,dead:false,deathT:0};const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function edge(){const q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-40]:q===1?[W()+40,r*H()]:q===2?[r*W(),H()+40]:[-40,r*H()]}function spawnEnemy(){const [x,y]=edge();enemies.push({x,y,hp:36,r:24,s:82+Math.min(t*.4,30),anim:Math.random()*5,hurt:0,dead:0,atk:0})}function spawnBoss(){bosses.push({x:W()/2,y:-100,hp:520,max:520,r:58,s:48,anim:0,hurt:0,dead:0,atk:0});bossed=true;$('bossbar').style.display='block'}
function dropLoot(m,isBoss){if(isBoss){for(let i=0;i<6;i++)drops.push({x:m.x+(Math.random()-.5)*70,y:m.y+(Math.random()-.5)*45,type:'usdz',a:Math.random()*6});drops.push({x:m.x,y:m.y-45,type:'heart',a:0})}else{const r=Math.random();if(r<.72)drops.push({x:m.x,y:m.y,type:'usdz',a:0});else if(r<.90)drops.push({x:m.x,y:m.y,type:'heart',a:0})}}function hit(m,damage,isBoss){m.hp-=damage;m.hurt=.16;if(m.hp<=0&&!m.dead){m.dead=isBoss?.9:.55;p.kills++;p.ult=Math.min(100,p.ult+(isBoss?50:14));dropLoot(m,isBoss)}}function nearest(){return[...enemies,...bosses].filter(m=>m.hp>0&&!m.dead).sort((a,b)=>dist(p,a)-dist(p,b))[0]}
function autoAttack(){if(p.cd>0)return;const n=nearest();if(!n||dist(p,n)>138)return;const dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.cd=.55;p.atkT=.42;slashes.push({x:p.x,y:p.y,a:Math.atan2(dy,dx),life:0});for(const m of enemies)if(m.hp>0&&!m.dead&&dist(p,m)<142)hit(m,28,false);for(const m of bosses)if(m.hp>0&&!m.dead&&dist(p,m)<148)hit(m,34,true)}function useUltimate(){if(p.ult<100||p.ultT>0)return;p.ult=0;p.ultT=.72;p.inv=Math.max(p.inv,.8);for(const m of enemies)if(m.hp>0&&!m.dead&&dist(p,m)<230)hit(m,95,false);for(const m of bosses)if(m.hp>0&&!m.dead&&dist(p,m)<245)hit(m,125,true)}
function update(dt){t+=dt;spawn+=dt;p.anim+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.cd=Math.max(0,p.cd-dt);p.ultT=Math.max(0,p.ultT-dt);p.atkT=Math.max(0,p.atkT-dt);p.hurtT=Math.max(0,p.hurtT-dt);if(p.dead){p.deathT+=dt;if(p.deathT>1.15)end();hud();return}let dx=p.dead?0:keys.right-keys.left,dy=p.dead?0:keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');const s=p.speed*(p.dash?2:1);p.x+=dx/l*s*dt;p.y+=dy/l*s*dt}p.x=Math.max(40,Math.min(W()-40,p.x));p.y=Math.max(70,Math.min(H()-40,p.y));if(!p.dead)autoAttack();if(spawn>Math.max(.62,1.25-t*.012)){spawn=0;spawnEnemy()}if(t>20&&!bossed)spawnBoss();for(const m of[...enemies,...bosses]){m.anim+=dt*7;m.hurt=Math.max(0,m.hurt-dt);m.atk=Math.max(0,m.atk-dt);if(m.dead>0){m.dead-=dt;continue}const dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(dist(p,m)<p.r+m.r&&p.inv<=0){m.atk=.32;p.hp-=bosses.includes(m)?22:10;p.inv=.58}}enemies=enemies.filter(m=>m.hp>0||m.dead>0);bosses=bosses.filter(m=>m.hp>0||m.dead>0);for(let i=drops.length-1;i>=0;i--){const q=drops[i];q.a+=dt*5;if(dist(p,q)<45){if(q.type==='heart')p.hp=Math.min(100,p.hp+25);else p.coin++;drops.splice(i,1)}}for(let i=slashes.length-1;i>=0;i--){slashes[i].life+=dt;if(slashes[i].life>.18)slashes.splice(i,1)}if(p.hp<=0&&!p.dead){p.hp=0;p.dead=true;p.deathT=0;p.inv=99}hud()}
function hud(){$('hpv').textContent=Math.ceil(p.hp);$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('killv').textContent=p.kills;$('timev').textContent=Math.floor(t);$('ultpct').textContent=Math.floor(p.ult)+'%';$('ultimate').disabled=p.ult<100||p.ultT>0;const b=bosses[0];if(b&&b.hp>0){$('bossfill').style.width=(100*b.hp/b.max)+'%'}else if(bossed){$('bossbar').style.display='none'}}function bg(){ctx.fillStyle='#08292a';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#143e40';ctx.lineWidth=1;for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}}
function hero(){const moving=keys.up||keys.down||keys.left||keys.right;let atlas=A.idle,row=0,fr=Math.floor(p.anim*5)%2,col=0;if(p.dead){atlas=A.hurtdeath;row=0;fr=Math.min(6,Math.floor(p.deathT/1.05*7));col=fr}else if(p.hurtT>0){atlas=A.hurtdeath;row=1;fr=Math.min(2,Math.floor((.32-p.hurtT)/.32*3));col=fr}else if(p.atkT>0){atlas=A.attack;row=({down:0,left:1,right:2,up:3})[p.dir];fr=Math.min(7,Math.floor((.42-p.atkT)/.42*8));col=fr}else if(p.dash>0){atlas=A.dashrun;row=({right:0,left:1,up:2,down:3})[p.dir];fr=Math.floor(p.anim*13)%8;col=fr}else if(moving){atlas=A.walk;row=fr;col=({down:0,left:1,right:3,up:4})[p.dir]}else{atlas=A.idle;row=fr;col=({down:0,left:1,right:2,up:3})[p.dir]}ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=(p.inv>0&&p.inv<90&&Math.floor(p.inv*18)%2)?0.4:1;ctx.drawImage(img.mega,atlas.x+col*128,atlas.y+row*128,128,128,Math.round(p.x-64),Math.round(p.y-74),128,128);ctx.restore()}
function drawEnemy(m,isBoss){const atlas=isBoss?A.boss:A.enemy;let row=1,frames=8;if(m.dead>0){row=4;frames=isBoss?6:6}else if(m.hurt>0){row=3;frames=isBoss?4:8}else if(m.atk>0){row=2;frames=isBoss?6:7}let fr=Math.floor(m.anim)%frames;if(m.dead>0){const total=isBoss?.9:.55;fr=Math.min(frames-1,Math.floor((total-m.dead)/total*frames))}const sz=isBoss?164:84;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=m.dead>0?Math.max(.12,m.dead/(isBoss?.9:.55)):1;ctx.drawImage(img.mega,atlas.x+fr*128,atlas.y+row*128,128,128,Math.round(m.x-sz/2),Math.round(m.y-sz*.62),sz,sz);ctx.restore()}
function drawDrop(q){const bob=Math.sin(q.a)*3,isH=q.type==='heart',atlas=isH?A.heart:A.coin,sz=isH?44:36;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.shadowBlur=isH?14:10;ctx.shadowColor=isH?'#65fff0':'#7ee2d9';ctx.drawImage(img.mega,atlas.x,atlas.y,128,128,Math.round(q.x-sz/2),Math.round(q.y+bob-sz/2),sz,sz);ctx.restore()}function drawUltimate(){if(p.ultT<=0||!img.mega.complete)return;const progress=1-p.ultT/.72,frames=3,fr=Math.min(frames-1,Math.floor(progress*frames)),pulse=1+Math.sin(progress*Math.PI)*.18,sz=220*pulse;ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y-12));ctx.rotate(p.dir==='right'?0:p.dir==='down'?Math.PI/2:p.dir==='left'?Math.PI:-Math.PI/2);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=Math.min(1,(.72-p.ultT)*4);ctx.drawImage(img.mega,A.ult.x+fr*128,A.ult.y,128,128,-sz/2,-sz/2,sz,sz);ctx.restore()}function drawSlash(){for(const s of slashes){const a=1-s.life/.18;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle=`rgba(100,255,235,${a})`;ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,0,78,-.65,.65);ctx.stroke();ctx.restore()}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();for(const q of drops)drawDrop(q);for(const m of enemies)drawEnemy(m,false);for(const m of bosses)drawEnemy(m,true);hero();drawUltimate();drawSlash();if(bossed&&bosses.length){ctx.fillStyle='#ff7167';ctx.font='900 20px Arial';ctx.textAlign='center';ctx.fillText('BOSS WAVE',W()/2,82)}}function loop(ts){if(!run)return;if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function reset(){t=spawn=0;bossed=false;enemies=[];drops=[];slashes=[];bosses=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',anim:0,inv:0,dash:0,cd:0,ult:0,ultT:0,atkT:0,hurtT:0,dead:false,deathT:0});$('bossbar').style.display='none';hud()}function startGame(){$('start').classList.add('hidden');$('over').classList.add('hidden');reset();run=true;last=0;requestAnimationFrame(loop)}function end(){if(!run)return;run=false;$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}
$('play').onclick=startGame;$('again').onclick=startGame;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18;if(k==='q'||k==='e')useUltimate()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dash').onpointerdown=e=>{e.preventDefault();p.dash=.18};$('ultimate').onpointerdown=e=>{e.preventDefault();useUltimate()};draw()})();
</script>
</body>
</html>
