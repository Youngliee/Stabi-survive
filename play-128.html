<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive 128</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{background:#041b1ddd;border:1px solid #48d9cf;border-radius:11px;padding:7px 9px;font-weight:900;font-size:12px}.hp{width:150px}.bar{height:7px;margin-top:5px;background:#243236;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#59e4b5}.panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#031113ed}.card{width:min(92vw,430px);padding:24px;border:1px solid #4adbd2;border-radius:20px;background:#082428;text-align:center}.logo{width:68px;height:68px;object-fit:contain}.btn{width:100%;padding:12px;border:0;border-radius:11px;background:#63ddd5;color:#052022;font-size:16px;font-weight:900}.btn:disabled{opacity:.45}.hidden{display:none!important}.status{font-size:12px;color:#74dad4;margin:8px 0}.controls{position:fixed;z-index:8;left:14px;right:14px;bottom:14px;display:none;justify-content:space-between;align-items:end}.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px}.c{width:52px;height:52px;border:1px solid #52dcd3;border-radius:14px;background:#06191cdd;color:#fff;font-size:22px;touch-action:none}.dash{width:72px;height:72px;border-radius:50%;font-size:12px}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.box{font-size:10px;padding:6px}.hp{width:112px}}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">USDZ <span id="coinv">0</span></div><div class="box"><span id="timev">0</span>s</div><div class="box">KO <span id="killv">0</span></div></div><section id="start" class="panel"><div class="card"><img class="logo" src="assets/logo.webp"><h1>STABI SURVIVE</h1><p>128 px Stabi test build.</p><div id="status" class="status">Loading 128 px assets…</div><button id="play" class="btn" disabled>PLAY</button></div></section><section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="again" class="btn">RUN AGAIN</button></div></section><div class="controls"><div class="dpad"><span></span><button class="c" data-k="up">▲</button><span></span><button class="c" data-k="left">◀</button><span></span><button class="c" data-k="right">▶</button><span></span><button class="c" data-k="down">▼</button><span></span></div><button id="dash" class="c dash">DASH</button></div><script>(()=>{const $=x=>document.getElementById(x),cv=$('g'),ctx=cv.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const W=()=>cv.width/DPR,H=()=>cv.height/DPR;const paths={idle:'assets/sprites/player/stabi-idle-128.webp',walk:'assets/sprites/player/stabi-walk-128.webp',e:'assets/atlases/red-slime-atlas.webp',b:'assets/atlases/mech-boss-atlas.webp',coin:'assets/coin.webp'},img={};function load(k,s){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>{img[k]=i;ok()};i.onerror=()=>no(s);i.src=s+'?v=128'})}Promise.all(Object.entries(paths).map(([k,s])=>load(k,s))).then(()=>{$('status').textContent='128 px assets ready ✓';$('play').disabled=false}).catch(e=>$('status').textContent='Asset error: '+e);const keys={up:0,down:0,left:0,right:0},en=[],coins=[],slashes=[];let bosses=[],run=false,last=0,t=0,spawn=0,bossed=false;const p={x:300,y:300,r:27,hp:100,coin:0,kills:0,speed:220,dir:'down',anim:0,inv:0,dash:0,cd:0};const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){t=spawn=0;bossed=false;en.length=0;coins.length=0;slashes.length=0;bosses=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',anim:0,inv:0,dash:0,cd:0});hud()}function edge(){let q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-40]:q===1?[W()+40,r*H()]:q===2?[r*W(),H()+40]:[-40,r*H()]}function spawnEnemy(){let[x,y]=edge();en.push({x,y,r:23,hp:38,s:72+Math.min(t*.6,44),anim:Math.random()*6,hurt:0,dead:0,flip:false})}function spawnBoss(){bosses.push({x:W()/2,y:-90,r:56,hp:360,s:48,anim:0,hurt:0,dead:0,flip:false});bossed=true}function drop(x,y){coins.push({x,y,a:Math.random()*6})}function nearest(){return [...en,...bosses].filter(m=>m.hp>0&&!m.dead).sort((a,b)=>d(p,a)-d(p,b))[0]}function attack(){if(p.cd>0)return;let n=nearest();if(!n||d(p,n)>135)return;let dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.cd=.58;slashes.push({x:p.x,y:p.y,a:Math.atan2(dy,dx),life:0});for(const m of [...en,...bosses])if(!m.dead&&d(p,m)<138){m.hp-=bosses.includes(m)?36:28;m.hurt=.16;if(m.hp<=0){m.dead=.6;p.kills++;if(Math.random()<.8)drop(m.x,m.y)}}}function update(dt){t+=dt;spawn+=dt;p.anim+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.cd=Math.max(0,p.cd-dt);let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');let s=p.speed*(p.dash?2:1);p.x+=dx/l*s*dt;p.y+=dy/l*s*dt}p.x=Math.max(38,Math.min(W()-38,p.x));p.y=Math.max(72,Math.min(H()-38,p.y));attack();if(spawn>Math.max(.55,1.2-t*.012)){spawn=0;spawnEnemy()}if(t>30&&!bossed)spawnBoss();for(const m of [...en,...bosses]){m.anim+=dt*7;if(m.dead>0){m.dead-=dt;continue}m.hurt=Math.max(0,m.hurt-dt);let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.flip=dx<0;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(d(p,m)<p.r+m.r&&p.inv<=0){p.hp-=bosses.includes(m)?24:11;p.inv=.65}}for(let i=en.length-1;i>=0;i--)if(en[i].hp<=0&&en[i].dead<=0)en.splice(i,1);for(let i=bosses.length-1;i>=0;i--)if(bosses[i].hp<=0&&bosses[i].dead<=0)bosses.splice(i,1);for(let i=coins.length-1;i>=0;i--){coins[i].a+=dt*5;if(d(p,coins[i])<42){p.coin++;coins.splice(i,1)}}for(let i=slashes.length-1;i>=0;i--){slashes[i].life+=dt;if(slashes[i].life>.18)slashes.splice(i,1)}if(p.hp<=0){p.hp=0;end()}hud()}function hud(){$('hpv').textContent=Math.ceil(Math.max(0,p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('timev').textContent=Math.floor(t);$('killv').textContent=p.kills}function bg(){ctx.fillStyle='#082a2b';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#174344';for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}}function pxCell(im,c,r,cs,x,y,w,h,a=1,flip=false){ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=a;if(flip){ctx.translate(x+w,0);ctx.scale(-1,1);x=0}ctx.drawImage(im,c*cs,r*cs,cs,cs,Math.round(x),Math.round(y),Math.round(w),Math.round(h));ctx.restore()}function hero(){const moving=keys.up||keys.down||keys.left||keys.right;const frame=Math.floor(p.anim*5)%2,dirIdle={down:0,left:1,right:2,up:3},dirWalk={down:0,left:1,right:3,up:4};const im=moving?img.walk:img.idle,col=(moving?dirWalk:dirIdle)[p.dir],cell=160;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=p.inv>0&&Math.floor(p.inv*18)%2?.4:1;ctx.drawImage(im,col*cell,frame*cell,cell,cell,Math.round(p.x-64),Math.round(p.y-72),128,128);ctx.restore()}function mob(m,isBoss){let row=m.dead>0?4:m.hurt>0?3:1,frames=m.dead>0?6:m.hurt>0?4:8,fr=Math.min(frames-1,Math.floor(m.anim)%frames),sz=isBoss?120:72;pxCell(isBoss?img.b:img.e,fr,row,isBoss?20:16,m.x-sz/2,m.y-sz/2,sz,sz,m.hurt>0?.65:1,m.flip);if(isBoss){ctx.fillStyle='#2c0909';ctx.fillRect(m.x-50,m.y-74,100,7);ctx.fillStyle='#ef564b';ctx.fillRect(m.x-50,m.y-74,100*Math.max(0,m.hp/360),7)}}function slash(){for(const s of slashes){let a=1-s.life/.18;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle=`rgba(116,255,235,${a})`;ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,0,82,-.7,.7);ctx.stroke();ctx.restore()}}function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();for(const q of coins){let y=q.y+Math.sin(q.a)*3;ctx.drawImage(img.coin,q.x-15,y-15,30,30)}for(const m of en)mob(m,false);for(const m of bosses)mob(m,true);hero();slash();if(bossed){ctx.fillStyle='#ffaaa3';ctx.textAlign='center';ctx.font='900 18px Arial';ctx.fillText('BOSS WAVE',W()/2,55)}}function loop(ts){if(!run)return;if(!last)last=ts;let dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function startGame(){$('start').classList.add('hidden');$('over').classList.add('hidden');reset();run=true;last=0;requestAnimationFrame(loop)}function end(){if(!run)return;run=false;$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}$('play').onclick=startGame;$('again').onclick=startGame;addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dash').onpointerdown=e=>{e.preventDefault();p.dash=.18};draw()})();</script></body></html>
