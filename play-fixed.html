let run=false,last=0,t=0,spawn=0,bossed=false,keys={up:0,down:0,left:0,right:0},en=[],boss=[],coins=[],slashes=[];const p={x:300,y:300,hp:100,r:25,coin:0,kills:0,speed:220,dir:'down',anim:0,inv:0,atk:0,cd:0,hurt:0,dash:0,dead:false,deathT:0};const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){t=spawn=0;bossed=false;en=[];boss=[];coins=[];slashes=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',anim:0,inv:0,atk:0,cd:0,hurt:0,dash:0,dead:false,deathT:0});hud()}function edge(){let q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-40]:q===1?[W()+40,r*H()]:q===2?[r*W(),H()+40]:[-40,r*H()]}function spawnEnemy(){let[x,y]=edge();en.push({x,y,hp:38,r:24,s:72+Math.min(t*.6,44),anim:Math.random()*6,hurt:0,dead:0,atk:0,flip:false})}function spawnBoss(){boss.push({x:W()/2,y:-90,hp:360,r:56,s:48,anim:0,hurt:0,dead:0,atk:0,flip:false});bossed=true}function drop(x,y){coins.push({x,y,a:Math.random()*6})}function nearest(){return [...en,...boss].filter(m=>m.hp>0&&!m.dead).sort((a,b)=>d(p,a)-d(p,b))[0]}function attack(){if(p.cd>0||p.dead)return;let n=nearest();if(!n||d(p,n)>125)return;let dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.atk=.4;p.cd=.62;slashes.push({x:p.x,y:p.y,dir:p.dir,a:0});for(let m of [...en,...boss])if(m.hp>0&&d(p,m)<132){m.hp-=boss.includes(m)?36:28;m.hurt=.2;if(m.hp<=0){m.dead=.75;m.anim=0;p.kills++;if(Math.random()<.8)drop(m.x,m.y)}}}function update(dt){if(p.dead){p.deathT+=dt;p.anim+=dt*7;if(p.deathT>.9)end();return}t+=dt;spawn+=dt;p.anim+=dt*8;p.inv=Math.max(0,p.inv-dt);p.atk=Math.max(0,p.atk-dt);p.cd=Math.max(0,p.cd-dt);p.hurt=Math.max(0,p.hurt-dt);p.dash=Math.max(0,p.dash-dt);let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');let s=p.speed*(p.dash?2:1);p.x+=dx/l*s*dt;p.y+=dy/l*s*dt}p.x=Math.max(35,Math.min(W()-35,p.x));p.y=Math.max(60,Math.min(H()-35,p.y));attack();if(spawn>Math.max(.55,1.2-t*.012)){spawn=0;spawnEnemy()}if(t>30&&!bossed)spawnBoss();for(let m of [...en,...boss]){m.anim+=dt*7;m.atk=Math.max(0,m.atk-dt);if(m.dead>0){m.dead-=dt;continue}m.hurt=Math.max(0,m.hurt-dt);let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.flip=dx<0;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(d(p,m)<p.r+m.r&&p.inv<=0){p.hp-=boss.includes(m)?24:11;p.inv=.65;p.hurt=.25;m.atk=.3}}en=en.filter(m=>m.hp>0||m.dead>0);boss=boss.filter(m=>m.hp>0||m.dead>0);for(let i=coins.length-1;i>=0;i--){coins[i].a+=dt*5;if(d(p,coins[i])<40){p.coin++;coins.splice(i,1)}}for(let i=slashes.length-1;i>=0;i--){slashes[i].a+=dt*10;if(slashes[i].a>8)slashes.splice(i,1)}if(p.hp<=0){p.hp=0;p.dead=true;p.anim=0;p.deathT=0}hud()}function hud(){$('hpv').textContent=Math.ceil(Math.max(0,p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('timev').textContent=Math.floor(t);$('killv').textContent=p.kills}function bg(){ctx.fillStyle='#082a2b';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#174344';for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}}function player(){let st=p.dead?'death':p.hurt>0?'hurt':p.atk>0?'attack':(keys.up||keys.down||keys.left||keys.right)?'walk':'idle',arr=P[st][p.dir],fr=st==='death'?Math.min(arr.length-1,Math.floor(p.deathT/.22)):Math.floor(p.anim)%arr.length;crop(img.p,arr[fr],1536,1024,p.x-49,p.y-58,98,100,p.inv>0&&Math.floor(p.inv*18)%2?.35:1)}function mob(m,isBoss){if(isBoss){let st=m.dead>0?'death':m.hurt>0?'hurt':m.atk>0?'attack':'walk',arr=BX[st],fr=Math.min(arr.length-1,Math.floor(m.anim)%arr.length);crop(img.b,arr[fr],1448,1086,m.x-65,m.y-65,130,130,m.hurt>0?.65:1,m.flip);ctx.fillStyle='#2c0909';ctx.fillRect(m.x-50,m.y-78,100,7);ctx.fillStyle='#ef564b';ctx.fillRect(m.x-50,m.y-78,100*Math.max(0,m.hp/360),7)}else{let f=enemyFrame(m);crop(img.e,f.box,1448,1086,m.x-38,m.y-38,76,76,m.hurt>0?.65:1,f.fl
