 ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=(p.inv>0&&p.inv<90&&Math.floor(p.inv*18)%2)?0.4:1;
 ctx.drawImage(sprite.image,fr*sw,0,sw,sprite.image.height,Math.round(p.x-DRAW/2),Math.round(BASE-DRAW),DRAW,DRAW);ctx.restore()
}
function mob(m,isBoss){
 if(isBoss){const im=img.boss;if(!im)return;const cs=20;let row=1,frames=8;if(m.dead>0){row=4;frames=6}else if(m.hurt>0){row=3;frames=4}else if(m.atk>0){row=2;frames=6}let fr=Math.floor(m.anim)%frames;if(m.dead>0)fr=Math.min(frames-1,Math.floor((.9-m.dead)/.9*frames));const sz=120*(m.scale||1);ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=m.hurt>0?.7:1;if(m.flip){ctx.translate(m.x+sz/2,0);ctx.scale(-1,1);ctx.drawImage(im,fr*cs,row*cs,cs,cs,0,m.y-sz/2,sz,sz)}else ctx.drawImage(im,fr*cs,row*cs,cs,cs,m.x-sz/2,m.y-sz/2,sz,sz);ctx.restore();return}
 let state='walk';if(m.dead>0)state='death';else if(m.hurt>0)state='hurt';else if(m.atk>0)state='attack';
 const sprite=state==='walk'?slippageSpriteSet.walk[m.flip?'left':'right']:slippageSpriteSet[state];if(!sprite?.image)return;
 let fr=0;if(state==='walk')fr=Math.floor(m.anim)%sprite.frames;else if(state==='attack')fr=Math.min(sprite.frames-1,Math.floor((.3-m.atk)/.3*sprite.frames));else if(state==='hurt')fr=Math.min(sprite.frames-1,Math.floor((.18-m.hurt)/.18*sprite.frames));else if(state==='death')fr=Math.min(sprite.frames-1,Math.floor((.58-m.dead)/.58*sprite.frames));
 const size=state==='attack'?104:state==='death'?80:72;drawSlippageFrame(sprite,fr,m.x,m.y,size,m.hurt>0?.7:1,state!=='walk'&&state!=='idle'&&m.flip)
}
function drawDrop(q){const y=q.y+Math.sin(q.a)*3;if(q.type==='heart')ctx.drawImage(img.hpdrop,q.x-22,y-22,44,44);else if(q.type==='eth')ctx.drawImage(img.ethdrop,q.x-22,y-22,44,44);else ctx.drawImage(img.coin,q.x-17,y-17,34,34)}function slash(){if(p.ultT>0){const a=Math.max(0,p.ultT/1.05),q=1-a,e=Math.sin(Math.min(1,q*1.35)*Math.PI/2),size=260+e*440;ctx.save();ctx.translate(p.x,p.y);ctx.globalCompositeOperation='lighter';if(img.ultfx){ctx.globalAlpha=Math.min(1,.98*a+0.22);ctx.rotate(q*.38);ctx.drawImage(img.ultfx,-size/2,-size/2,size,size);const echo=size*1.22;ctx.globalAlpha=Math.max(.22,a*.58);ctx.rotate(-q*.78);ctx.drawImage(img.ultfx,-echo/2,-echo/2,echo,echo)}ctx.rotate(q*.22);ctx.scale(1,.58);ctx.globalAlpha=Math.min(1,.55+a*.55);ctx.shadowColor='#42fff1';ctx.shadowBlur=30;ctx.strokeStyle='#bafffa';ctx.lineWidth=12;ctx.beginPath();ctx.arc(0,0,size*.43,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=Math.max(.2,a*.42);ctx.shadowBlur=48;ctx.strokeStyle='#27e9df';ctx.lineWidth=30;ctx.beginPath();ctx.arc(0,0,size*.43,0,Math.PI*2);ctx.stroke();ctx.restore()}}function drawFloats(){ctx.save();ctx.textAlign='center';ctx.font='900 18px Arial';for(const n of floatNums){const a=Math.max(0,1-n.life/.82);ctx.globalAlpha=a;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.5)';const txt=(n.kind==='heal'||n.kind==='eth'?'+':'-')+n.value;ctx.fillStyle=n.kind==='heal'?'#6dffd2':n.kind==='eth'?'#70d8ff':n.kind==='player'?'#ff6b6b':'#ffe36a';ctx.strokeText(txt,n.x,n.y);ctx.fillText(txt,n.x,n.y)}ctx.restore()}function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();drops.forEach(drawDrop);en.forEach(m=>mob(m,false));bosses.forEach(m=>mob(m,true));hero();slash();drawFloats()}function loop(ts){if(!run)return;if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function start(){$('start').classList.add('hidden');$('over').classList.add('hidden');$('win').classList.add('hidden');reset();run=true;last=0;requestAnimationFrame(loop)}function end(won){if(!run)return;run=false;if(won){$('winresult').innerHTML=`Level 15 cleared<br>Final MEV Boss defeated<br>KO: ${p.kills}<br>USDZ: ${p.coin}<br>ETH: ${p.eth}`;$('win').classList.remove('hidden')}else{$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>Level: ${level()}<br>KO: ${p.kills}<br>USDZ: ${p.coin}<br>ETH: ${p.eth}`;$('over').classList.remove('hidden')}}$('play').onclick=start;$('again').onclick=start;$('winagain').onclick=start;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18;if(k==='q'||k==='e')useUlt()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dash').onpointerdown=e=>{e.preventDefault();p.dash=.18};$('ultimate').onpointerdown=e=>{e.preventDefault();useUlt()};draw()})();
</script></body></html>
