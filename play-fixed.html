<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stabi Survive</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}.hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{background:#041b1ddd;border:1px solid #48d9cf;border-radius:11px;padding:7px 9px;font-weight:900;font-size:12px}.hp{width:150px}.bar{height:7px;margin-top:5px;background:#243236;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#59e4b5}.coinbox{display:flex;align-items:center;gap:5px}.coinicon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#36cfc6;color:white;font:900 13px Arial,sans-serif;border:1px solid #9ffff7;box-shadow:0 0 7px #36cfc666}.panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#031113ed}.card{width:min(92vw,430px);padding:24px;border:1px solid #4adbd2;border-radius:20px;background:#082428;text-align:center}.logo{width:68px;height:68px;object-fit:contain}.btn{width:100%;padding:12px;border:0;border-radius:11px;background:#63ddd5;color:#052022;font-size:16px;font-weight:900}.btn:disabled{opacity:.45}.hidden{display:none!important}.status{font-size:12px;color:#74dad4;margin:8px 0}.controls{position:fixed;z-index:8;left:14px;right:14px;bottom:14px;display:none;justify-content:space-between;align-items:end}.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px}.c{width:52px;height:52px;border:1px solid #52dcd3;border-radius:14px;background:#06191cdd;color:#fff;font-size:22px;touch-action:none}.dash{width:72px;height:72px;border-radius:50%;font-size:12px}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.box{font-size:10px;padding:6px}.hp{width:112px}.coinicon{width:18px;height:18px;font-size:12px}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box coinbox"><span class="coinicon">$</span><span id="coinv">0</span></div><div class="box">⏱ <span id="timev">0</span>s</div><div class="box">⚔ <span id="killv">0</span></div></div>
<section id="start" class="panel"><div class="card"><img class="logo" src="assets/logo.webp"><h1>STABI SURVIVE</h1><p>Survive the waves, collect USDZ, and defeat the boss.</p><div id="status" class="status">Loading assets…</div><button id="play" class="btn" disabled>PLAY</button></div></section>
<section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="again" class="btn">RUN AGAIN</button></div></section>
<div class="controls"><div class="dpad"><span></span><button class="c" data-k="up">▲</button><span></span><button class="c" data-k="left">◀</button><span></span><button class="c" data-k="right">▶</button><span></span><button class="c" data-k="down">▼</button><span></span></div><button id="dash" class="c dash">DASH</button></div>
<script>
(()=>{
const $=x=>document.getElementById(x),cv=$('g'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let DPR=Math.min(devicePixelRatio||1,2);
function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
const W=()=>cv.width/DPR,H=()=>cv.height/DPR;
const paths={p:'assets/atlases/stabi-atlas.webp?v=asset-recovery-1',e:'assets/atlases/red-slime-atlas.webp?v=asset-recovery-1',b:'assets/atlases/mech-boss-atlas.webp?v=asset-recovery-1',coin:'assets/coin.webp?v=asset-recovery-1'},img={};
function load(k,s){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>{img[k]=i;ok()};i.onerror=()=>no(s);i.src=s})}
Promise.all(Object.entries(paths).map(([k,s])=>load(k,s))).then(()=>{$('status').textContent='Assets ready ✓';$('play').disabled=false}).catch(e=>$('status').textContent='Asset error: '+e);
const PC=16,BC=20;
function cell(im,c,r,cs,x,y,w,h,a=1,flip=false){if(!im)return;ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=a;x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(flip){ctx.translate(x+w,0);ctx.scale(-1,1);x=0}ctx.drawImage(im,c*cs,r*cs,cs,cs,x,y,w,h);ctx.restore()}
const rows={idle:{down:0,left:1,right:2,up:3},walk:{down:4,left:5,right:6,up:7},attack:{down:8,left:9,right:10,up:11},hurt:{down:12,left:12,right:12,up:12},death:{down:13,left:13,right:13,up:13}};
let run=false,last=0,t=0,spawn=0,bossed=false,keys={up:0,down:0,left:0,right:0},en=[],boss=[],coins=[],slashes=[],damageNums=[];
const p={x:300,y:300,hp:100,r:25,coin:0,kills:0,speed:220,dir:'down',anim:0,inv:0,atk:0,cd:0,hurt:0,dash:0,dead:false,deathT:0};
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function addDamage(x,y,value,kind='enemy'){damageNums.push({x,y:y-24,value,a:0,kind,drift:(Math.random()-.5)*14})}
function reset(){t=spawn=0;bossed=false;en=[];boss=[];coins=[];slashes=[];damageNums=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',anim:0,inv:0,atk:0,cd:0,hurt:0,dash:0,dead:false,deathT:0});hud()}
function edge(){let q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-40]:q===1?[W()+40,r*H()]:q===2?[r*W(),H()+40]:[-40,r*H()]}
function spawnEnemy(){let[x,y]=edge();en.push({x,y,hp:38,r:23,s:72+Math.min(t*.6,44),anim:Math.random()*6,hurt:0,dead:0,atk:0,flip:false})}
function spawnBoss(){boss.push({x:W()/2,y:-90,hp:360,r:56,s:48,anim:0,hurt:0,dead:0,atk:0,flip:false});bossed=true}
function drop(x,y){coins.push({x,y,a:Math.random()*6})}
function nearest(){return [...en,...boss].filter(m=>m.hp>0&&!m.dead).sort((a,b)=>d(p,a)-d(p,b))[0]}
function attack(){if(p.cd>0||p.dead)return;let n=nearest();if(!n||d(p,n)>125)return;let dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.atk=.38;p.cd=.62;slashes.push({x:p.x,y:p.y,dir:p.dir,a:0});for(let m of [...en,...boss])if(m.hp>0&&d(p,m)<132){let amount=boss.includes(m)?36:28;m.hp-=amount;addDamage(m.x,m.y,amount,'enemy');m.hurt=.2;if(m.hp<=0){m.dead=.7;m.anim=0;p.kills++;if(Math.random()<.8)drop(m.x,m.y)}}}
function update(dt){
 if(p.dead){p.deathT+=dt;p.anim+=dt*7;if(p.deathT>.9)end();return}
 t+=dt;spawn+=dt;p.anim+=dt*8;p.inv=Math.max(0,p.inv-dt);p.atk=Math.max(0,p.atk-dt);p.cd=Math.max(0,p.cd-dt);p.hurt=Math.max(0,p.hurt-dt);p.dash=Math.max(0,p.dash-dt);
 let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;
 if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');let s=p.speed*(p.dash?2:1);p.x+=dx/l*s*dt;p.y+=dy/l*s*dt}
 p.x=Math.max(28,Math.min(W()-28,p.x));p.y=Math.max(58,Math.min(H()-28,p.y));attack();
 if(spawn>Math.max(.55,1.2-t*.012)){spawn=0;spawnEnemy()}if(t>30&&!bossed)spawnBoss();
 for(let m of [...en,...boss]){m.anim+=dt*7;m.atk=Math.max(0,m.atk-dt);if(m.dead>0){m.dead-=dt;continue}m.hurt=Math.max(0,m.hurt-dt);let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.flip=dx<0;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(d(p,m)<p.r+m.r&&p.inv<=0){let hit=boss.includes(m)?16:7;p.hp-=hit;addDamage(p.x,p.y,hit,'player');p.inv=.65;p.hurt=.25;m.atk=.3}}
 en=en.filter(m=>m.hp>0||m.dead>0);boss=boss.filter(m=>m.hp>0||m.dead>0);
 for(let i=coins.length-1;i>=0;i--){coins[i].a+=dt*5;if(d(p,coins[i])<40){p.coin++;coins.splice(i,1)}}
 for(let i=slashes.length-1;i>=0;i--){slashes[i].a+=dt*10;if(slashes[i].a>8)slashes.splice(i,1)}
 for(let i=damageNums.length-1;i>=0;i--){let n=damageNums[i];n.a+=dt;n.y-=32*dt;n.x+=n.drift*dt;if(n.a>.8)damageNums.splice(i,1)}
 if(p.hp<=0){p.hp=0;p.dead=true;p.anim=0;p.deathT=0}hud()
}
function hud(){$('hpv').textContent=Math.ceil(Math.max(0,p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('timev').textContent=Math.floor(t);$('killv').textContent=p.kills}
function bg(){ctx.save();ctx.scale(DPR,DPR);ctx.fillStyle='#082a2b';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#174344';for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}ctx.restore()}
function mob(m,isBoss){let st=m.dead>0?'death':m.hurt>0?'hurt':m.atk>0?'attack':'walk',row=st==='walk'?1:st==='attack'?2:st==='hurt'?3:st==='death'?4:0,frames=st==='walk'?8:st==='attack'?6:st==='hurt'?4:6,fr=Math.min(frames-1,Math.floor(m.anim)%frames),sz=isBoss?120:72;cell(isBoss?img.b:img.e,fr,row,isBoss?BC:PC,m.x-sz/2,m.y-sz/2,sz,sz,m.hurt>0?.65:1,m.flip);if(isBoss){ctx.fillStyle='#2c0909';ctx.fillRect(Math.round(m.x-50),Math.round(m.y-74),100,7);ctx.fillStyle='#ef564b';ctx.fillRect(Math.round(m.x-50),Math.round(m.y-74),100*Math.max(0,m.hp/360),7)}}
function player(){let st=p.dead?'death':p.hurt>0?'hurt':p.atk>0?'attack':(keys.up||keys.down||keys.left||keys.right)?'walk':'idle',row=rows[st][p.dir],frames=st==='attack'?5:st==='hurt'?3:st==='death'?4:2,fr=st==='death'?Math.min(3,Math.floor(p.deathT/.22)):Math.floor(p.anim)%frames;cell(img.p,fr,row,PC,p.x-48,p.y-58,96,96,p.inv>0&&Math.floor(p.inv*18)%2?.35:1)}
function slash(){for(let s of slashes){let fr=Math.min(7,Math.floor(s.a));ctx.save();ctx.translate(Math.round(s.x),Math.round(s.y));ctx.rotate(s.dir==='right'?0:s.dir==='down'?Math.PI/2:s.dir==='left'?Math.PI:-Math.PI/2);cell(img.e,fr,5,PC,-52,-52,104,104,.9);ctx.restore()}}
function drawDamage(){for(let n of damageNums){let alpha=Math.max(0,1-n.a/.8);ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=n.kind==='player'?'900 20px Arial':'900 18px Arial';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText('-'+n.value,Math.round(n.x),Math.round(n.y));ctx.fillStyle=n.kind==='player'?'#ff5a5a':'#ffe66a';ctx.fillText('-'+n.value,Math.round(n.x),Math.round(n.y));ctx.restore()}}
function draw(){bg();ctx.save();ctx.scale(DPR,DPR);ctx.imageSmoothingEnabled=false;for(let q of coins){let y=q.y+Math.sin(q.a)*3;ctx.drawImage(img.coin,Math.round(q.x-15),Math.round(y-15),30,30)}for(let m of en)mob(m,false);for(let m of boss)mob(m,true);slash();player();drawDamage();if(bossed&&!p.dead){ctx.fillStyle='#ffaaa3';ctx.textAlign='center';ctx.font='900 18px Arial';ctx.fillText('BOSS WAVE',W()/2,55)}ctx.restore()}
function loop(ts){if(!run)return;if(!last)last=ts;let dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function start(){$('start').classList.add('hidden');$('over').classList.add('hidden');reset();run=true;last=0;requestAnimationFrame(loop)}
function end(){if(!run)return;run=false;$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}
$('play').onclick=start;$('again').onclick=start;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});
$('dash').onpointerdown=e=>{e.preventDefault();p.dash=.18};draw();
})();
</script>
</body>
</html>
