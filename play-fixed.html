<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Pixel</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;font-family:Arial,sans-serif;color:#fff}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.hud{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;justify-content:space-between;pointer-events:none}.box{background:#041b1ddd;border:1px solid #48d9cf;border-radius:11px;padding:7px 9px;font-weight:900;font-size:13px;backdrop-filter:blur(5px)}.hp{width:170px}.bar{height:7px;margin-top:5px;background:#243236;border-radius:99px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#59e4b5}.panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#031113ed}.card{width:min(92vw,460px);padding:24px;border:1px solid #4adbd2;border-radius:20px;background:#082428;text-align:center;box-shadow:0 20px 70px #0009}.logo{width:70px;height:70px;object-fit:contain}.card h1{margin:8px 0 6px}.card p{color:#a7caca;line-height:1.45}.card input{width:100%;padding:12px;border-radius:10px;border:1px solid #416f71;background:#04191b;color:#fff;font-size:16px;margin:10px 0}.btn{width:100%;padding:12px;border:0;border-radius:11px;background:#63ddd5;color:#052022;font-size:16px;font-weight:900}.btn:disabled{opacity:.45}.btn.alt{margin-top:8px;background:#173b3d;color:#fff}.hidden{display:none!important}.status{font-size:12px;margin:7px 0;color:#74dad4}.controls{position:fixed;z-index:8;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:end}.dpad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:4px}.c{width:54px;height:54px;border:1px solid #52dcd3;border-radius:14px;background:#06191ccd;color:#fff;font-size:22px;touch-action:none}.dash{width:74px;height:74px;border-radius:50%;font-size:12px}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.box{font-size:11px;padding:7px}.hp{width:130px}}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">USDZ <span id="coinv">0</span></div><div class="box"><span id="timev">0</span>s</div><div class="box">KO <span id="killv">0</span></div></div><section id="start" class="panel"><div class="card"><img class="logo" src="assets/logo.webp"><h1>STABI SURVIVE</h1><p>Pixel survival test. Move freely, survive the waves, collect USDZ, and face the boss.</p><div id="assetStatus" class="status">Loading assets…</div><input id="nameInput" maxlength="16" value="Zarrr" placeholder="Player name"><button id="playBtn" class="btn" disabled>PLAY</button><button id="howBtn" class="btn alt">HOW TO PLAY</button><p id="help" class="hidden">Desktop: WASD / Arrow Keys. Mobile: use the direction buttons. Boss appears after 30 seconds.</p></div></section><section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="againBtn" class="btn">RUN AGAIN</button></div></section><div class="controls"><div class="dpad"><span></span><button class="c" data-k="up">▲</button><span></span><button class="c" data-k="left">◀</button><span></span><button class="c" data-k="right">▶</button><span></span><button class="c" data-k="down">▼</button><span></span></div><button id="dashBtn" class="c dash">DASH</button></div><script>(()=>{const $=id=>document.getElementById(id),cv=$('g'),ctx=cv.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const W=()=>cv.width/DPR,H=()=>cv.height/DPR;const paths={p:'assets/sprites/player/stabi-sprites.webp',e:'assets/sprites/enemies/red-slime-sprites.webp',b:'assets/sprites/boss/mech-boss-sprites.webp',coin:'assets/coin.webp'};const img={};function load(k,src){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>{img[k]=i;ok()};i.onerror=()=>no(new Error(src));i.src=src})}Promise.all(Object.entries(paths).map(([k,v])=>load(k,v))).then(()=>{$('assetStatus').textContent='Assets ready ✓';$('playBtn').disabled=false}).catch(err=>{$('assetStatus').textContent='Asset error: '+err.message});const P={down:[10,38,78,120],left:[92,38,158,120],right:[171,38,238,120],up:[252,38,320,120]};const PA={down:[20,292,72,408],left:[392,292,454,408],right:[800,292,860,408],up:[1170,292,1234,414]};function crop(im,b,x,y,w,h,a=1){if(!im||!im.complete)return;ctx.save();ctx.globalAlpha=a;ctx.drawImage(im,b[0],b[1],b[2]-b[0],b[3]-b[1],x,y,w,h);ctx.restore()}function wholeFrame(im,frame,x,y,w,h){if(!im||!im.complete)return;const sw=im.naturalWidth/2,sh=im.naturalHeight;ctx.drawImage(im,frame*sw,0,sw,sh,x,y,w,h)}let running=false,last=0,t=0,spawnT=0,coinT=0,bossed=false,playerName='Player',keys={up:0,down:0,left:0,right:0},en=[],coins=[],bosses=[],rings=[];const p={x:300,y:300,r:25,hp:100,coin:0,kills:0,speed:220,dir:'down',inv:0,dash:0,atk:0,cd:0,anim:0};const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){t=spawnT=coinT=0;bossed=false;en=[];coins=[];bosses=[];rings=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',inv:0,dash:0,atk:0,cd:0,anim:0});hud()}function edge(){const q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-45]:q===1?[W()+45,r*H()]:q===2?[r*W(),H()+45]:[-45,r*H()]}function spawnEnemy(){const [x,y]=edge();en.push({x,y,r:24,hp:34,s:74+Math.min(t*.6,42),anim:Math.random()*2,hurt:0,dead:0})}function spawnCoin(x,y){coins.push({x,y,a:Math.random()*6.2})}function spawnBoss(){bosses.push({x:W()/2,y:-90,r:54,hp:300,s:48,anim:0,hurt:0,dead:0});bossed=true}function nearest(){return [...en,...bosses].filter(m=>!m.dead&&m.hp>0).sort((a,b)=>dist(p,a)-dist(p,b))[0]}function hitPulse(){if(p.cd>0)return;const n=nearest();if(!n||dist(p,n)>120)return;const dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.atk=.18;p.cd=.58;rings.push({x:p.x,y:p.y,a:0});for(const m of [...en,...bosses])if(!m.dead&&dist(p,m)<125){m.hp-=bosses.includes(m)?34:26;m.hurt=.15;if(m.hp<=0){m.dead=.42;p.kills++;if(Math.random()<.8)spawnCoin(m.x,m.y)}}}function update(dt){t+=dt;spawnT+=dt;coinT+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.atk=Math.max(0,p.atk-dt);p.cd=Math.max(0,p.cd-dt);p.anim+=dt*7;let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');const sp=p.speed*(p.dash?2:1);p.x+=dx/l*sp*dt;p.y+=dy/l*sp*dt}p.x=Math.max(28,Math.min(W()-28,p.x));p.y=Math.max(62,Math.min(H()-28,p.y));hitPulse();if(spawnT>Math.max(.55,1.25-t*.012)){spawnT=0;spawnEnemy()}if(coinT>2.6){coinT=0;if(coins.length<6)spawnCoin(60+Math.random()*(W()-120),90+Math.random()*(H()-150))}if(t>30&&!bossed)spawnBoss();for(const m of [...en,...bosses]){m.anim+=dt*6;if(m.dead>0){m.dead-=dt;continue}m.hurt=Math.max(0,m.hurt-dt);const dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(dist(p,m)<p.r+m.r&&p.inv<=0){p.hp-=bosses.includes(m)?22:10;p.inv=.65}}en=en.filter(m=>m.hp>0||m.dead>0);bosses=bosses.filter(m=>m.hp>0||m.dead>0);for(let i=coins.length-1;i>=0;i--){coins[i].a+=dt*5;if(dist(p,coins[i])<42){p.coin++;coins.splice(i,1)}}for(let i=rings.length-1;i>=0;i--){rings[i].a+=dt*5;if(rings[i].a>1)rings.splice(i,1)}hud();if(p.hp<=0)end()}function hud(){$('hpv').textContent=Math.max(0,Math.ceil(p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('timev').textContent=Math.floor(t);$('killv').textContent=p.kills}function bg(){ctx.save();ctx.scale(DPR,DPR);ctx.fillStyle='#0b292a';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#174344';ctx.lineWidth=1;for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}ctx.restore()}function draw(){bg();ctx.save();ctx.scale(DPR,DPR);for(const q of coins){const yy=q.y+Math.sin(q.a)*3;ctx.drawImage(img.coin,q.x-15,yy-15,30,30)}for(const m of en){ctx.globalAlpha=m.hurt>0?.55:1;wholeFrame(img.e,Math.floor(m.anim)%2,m.x-30,m.y-24,60,48);ctx.globalAlpha=1}for(const m of bosses){ctx.globalAlpha=m.hurt>0?.55:1;wholeFrame(img.b,Math.floor(m.anim)%2,m.x-58,m.y-51,116,102);ctx.globalAlpha=1;ctx.fillStyle='#2c0909';ctx.fillRect(m.x-50,m.y-66,100,7);ctx.fillStyle='#ef564b';ctx.fillRect(m.x-50,m.y-66,100*Math.max(0,m.hp/300),7)}for(const r of rings){ctx.strokeStyle=`rgba(91,235,221,${1-r.a})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(r.x,r.y,35+r.a*70,0,Math.PI*2);ctx.stroke()}const b=p.atk>0?PA[p.dir]:P[p.dir],bob=(keys.up||keys.down||keys.left||keys.right)?Math.sin(p.anim)*2:0;crop(img.p,b,p.x-36,p.y-46+bob,72,88,p.inv>0&&Math.floor(p.inv*18)%2?.35:1);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 12px Arial';ctx.fillText(playerName,p.x,p.y+40);if(bossed){ctx.fillStyle='#ffaaa3';ctx.font='900 18px Arial';ctx.fillText('BOSS WAVE',W()/2,55)}ctx.restore()}function loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function startGame(){playerName=($('nameInput').value||'Player').trim().slice(0,16);$('start').classList.add('hidden');$('over').classList.add('hidden');reset();running=true;last=0;requestAnimationFrame(loop)}function end(){if(!running)return;running=false;$('result').innerHTML=`<b>${playerName}</b><br>Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}$('playBtn').onclick=startGame;$('againBtn').onclick=startGame;$('howBtn').onclick=()=>$('help').classList.toggle('hidden');addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dashBtn').onpointerdown=e=>{e.preventDefault();p.dash=.18};draw()})();</script></body></html>
