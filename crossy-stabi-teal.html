<!doctype html>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041c27;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}.logo{position:absolute;left:14px;top:10px;color:#fff;font-weight:1000;font-size:clamp(25px,5vw,46px);line-height:.9;text-shadow:0 0 16px #00e5df55}.logo b{font-style:italic;color:#31e6e0}.logo small{display:block;font-size:8px;letter-spacing:3px;margin-top:6px;color:#66e5df}.hud{position:absolute;right:12px;top:12px;display:flex;gap:7px}.pill{min-width:68px;padding:7px 9px;border:1px solid #1fded7;background:#03151ddd;border-radius:11px;text-align:center;color:#fff;box-shadow:0 0 18px #00e5df22}.pill small{display:block;font-size:6px;letter-spacing:1.4px;color:#7af0eb}.pill b{font-size:15px}.controls{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:205px;height:156px;pointer-events:auto}.ctrl{position:absolute;width:60px;height:52px;border:2px solid #4c747b;background:#06131b;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 4px 0 #19363d,0 0 18px #00e5df22}.ctrl.up{left:72px;top:0;background:#e7fffb;color:#06131b;border-color:#82f1e8}.ctrl.left{left:0;top:66px}.ctrl.down{left:72px;top:66px}.ctrl.right{right:0;top:66px}.timer{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font:900 20px monospace;color:#29ebe7;text-shadow:0 0 10px #00e5df}.speed{position:absolute;left:50%;bottom:156px;transform:translateX(-50%);background:#02151ddd;border:1px solid #19ddd6;color:#fff;padding:6px 10px;border-radius:999px;font-size:8px;letter-spacing:1.5px;opacity:0;transition:.2s}.speed.on{opacity:1}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 35%,#0c5960dd,#03131ddd 68%)}.card{width:min(420px,92vw);padding:26px 20px;text-align:center;color:#fff;background:#051820ef;border:1px solid #25ddd6;border-radius:18px;box-shadow:0 24px 80px #000a,0 0 35px #00e5df22}.card h1{font-size:41px;margin:4px 0 8px}.card h1 span{color:#42ebe5}.card p{color:#b6dedd;font-size:12px;line-height:1.5}.play{border:1px solid #78f4ed;border-radius:10px;padding:13px 24px;background:#42e2d9;color:#031514;font-weight:1000;letter-spacing:2px}.result{display:none}@media(max-width:650px){.logo{font-size:27px}.hud{right:8px;top:9px}.pill{min-width:58px;padding:6px}.controls{transform:translateX(-50%) scale(.9);transform-origin:center bottom}}

<body>
<div id="ui" style="display:none"><div class="logo">CROSSY <b>STABI</b><small>STABLECOIN FRONTIER</small></div><div class="hud"><div class="pill"><small>DISTANCE</small><b id="dist">0m</b></div><div class="pill"><small>USDZ</small><b id="coins">0</b></div></div><div id="speed" class="speed">TRAFFIC SPEED UP</div><div class="controls"><button class="ctrl up" data-dir="up">▲</button><button class="ctrl left" data-dir="left">◀</button><button class="ctrl down" data-dir="down">▼</button><button class="ctrl right" data-dir="right">▶</button><div id="timer" class="timer">00:60</div></div></div>
<section id="start" class="overlay"><div class="card"><div style="font-size:9px;letter-spacing:3px;color:#79f0eb">STABILIZER COMMUNITY MINI GAME</div><h1>CROSSY <span>STABI</span></h1><p>Cross the deep-teal frontier, collect USDZ, and survive the traffic. The farther you go, the faster it gets.</p><button id="play" class="play">PLAY</button></div></section>
<section id="result" class="overlay result"><div class="card"><h1 id="resultTitle">RUN COMPLETE</h1><p id="resultText"></p><button id="again" class="play">RUN AGAIN</button></div></section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x041c27);scene.fog=new THREE.Fog(0x041c27,58,125);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
const camera=new THREE.OrthographicCamera(-18,18,11,-11,.1,220);camera.position.set(24,29,28);
scene.add(new THREE.HemisphereLight(0x9ffbf4,0x021116,1.8));const sun=new THREE.DirectionalLight(0xb9fff7,2.2);sun.position.set(-20,38,24);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-34;sun.shadow.camera.right=34;sun.shadow.camera.top=34;sun.shadow.camera.bottom=-34;scene.add(sun);const rim=new THREE.DirectionalLight(0x00c7c5,.9);rim.position.set(25,15,-20);scene.add(rim);
const world=new THREE.Group();scene.add(world);const TILE=3.15,HALF=4,WIDTH=28.35,MAX=115;let cars=[],coins=[];
function mat(c,r=.7,m=0,e=0,ei=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,flatShading:true,emissive:e,emissiveIntensity:ei})}
function box(w,h,d,c,r=.7,m=0,e=0,ei=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,r,m,e,ei));o.castShadow=true;o.receiveShadow=true;return o}
function tree(x,z,pine=false){const g=new THREE.Group(),tr=box(.25,.9,.25,0x12363a);tr.position.y=.45;g.add(tr);if(pine){for(let i=0;i<3;i++){const q=new THREE.Mesh(new THREE.ConeGeometry(.7-i*.13,1.1,7),mat(i%2?0x08666b:0x0a8586,.72,0,0x034c4d,.14));q.position.y=.95+i*.48;g.add(q)}}else{const q=new THREE.Mesh(new THREE.DodecahedronGeometry(.72,0),mat(0x0f7273,.7,0,0x064b4b,.15));q.position.y=1.35;g.add(q)}g.position.set(x,0,z);world.add(g)}
function makeStabi(){const g=new THREE.Group();const navy=0x172a78,navy2=0x203a9b,cyan=0x50c8ef,cyan2=0x2fa6dc,mint=0x8cf0c7,white=0xf8fbff,skin=0xffd2b5,blue=0x138cff,dark=0x1d1830,pink=0xff7895;
 const torso=box(.92,.78,.62,cyan);torso.position.y=1.28;g.add(torso);const center=box(.22,.72,.04,white);center.position.set(0,1.28,.335);g.add(center);const hem=box(1.02,.10,.68,mint);hem.position.y=.92;g.add(hem);const hoodL=box(.34,.12,.16,mint),hoodR=hoodL.clone();hoodL.position.set(-.22,1.66,.12);hoodR.position.set(.22,1.66,.12);g.add(hoodL,hoodR);const badge=box(.17,.22,.035,white);badge.position.set(-.27,1.37,.34);g.add(badge);const badgeCut=box(.10,.05,.04,cyan);badgeCut.position.set(-.245,1.39,.36);g.add(badgeCut);
 const bow=new THREE.Group();const knot=box(.12,.12,.10,mint),bl=box(.22,.16,.08,mint),br=bl.clone();bl.position.x=-.17;br.position.x=.17;bl.rotation.z=.3;br.rotation.z=-.3;bow.add(knot,bl,br);bow.position.set(0,1.62,.37);g.add(bow);const head=box(1.02,.92,.90,skin);head.position.y=2.22;g.add(head);
 const eyeParts=x=>{const eyeW=box(.25,.27,.035,white);eyeW.position.set(x,2.25,.47);g.add(eyeW);const iris=box(.13,.20,.04,blue);iris.position.set(x,2.23,.49);g.add(iris);const pupil=box(.065,.11,.042,dark);pupil.position.set(x,2.22,.515);g.add(pupil);const glow=box(.045,.055,.044,0x8feaff);glow.position.set(x+.025,2.28,.53);g.add(glow)};eyeParts(-.22);eyeParts(.22);const blushL=box(.09,.055,.035,pink),blushR=blushL.clone();blushL.position.set(-.38,2.04,.47);blushR.position.set(.38,2.04,.47);g.add(blushL,blushR);const mouth=box(.24,.10,.04,0xb62645);mouth.position.set(0,2.01,.49);g.add(mouth);const tooth=box(.16,.035,.042,white);tooth.position.set(0,2.055,.515);g.add(tooth);
 const hairTop=box(1.12,.28,.98,navy);hairTop.position.y=2.75;g.add(hairTop);for(let i=-2;i<=2;i++){const bang=box(.20,.42,.13,i%2?navy2:navy);bang.position.set(i*.19,2.52,.50);bang.rotation.z=i*.03;g.add(bang)}for(const side of [-1,1]){const sideHair=box(.22,.70,.72,navy);sideHair.position.set(side*.56,2.34,-.02);g.add(sideHair);const curl=box(.18,.30,.30,navy2);curl.position.set(side*.62,2.02,-.15);curl.rotation.z=side*.25;g.add(curl)}for(let i=-2;i<=2;i++){const back=box(.20,.36,.20,i%2?navy:navy2);back.position.set(i*.19,2.38,-.50);back.rotation.z=i*.04;g.add(back)}
 const armL=new THREE.Group(),armR=new THREE.Group();function arm(a,side){const sleeve=box(.30,.58,.34,cyan);sleeve.position.y=-.15;a.add(sleeve);const cuff=box(.34,.10,.37,mint);cuff.position.y=-.40;a.add(cuff);const hand=box(.24,.24,.25,skin);hand.position.y=-.56;a.add(hand);a.position.set(side*.64,1.50,0);a.rotation.z=side*.08;g.add(a)}arm(armL,-1);arm(armR,1);
 const skirt=new THREE.Group();for(let i=-2;i<=2;i++){const pleat=box(.25,.34,.70,i%2?0xe9efff:white);pleat.position.set(i*.20,.72,0);pleat.rotation.z=i*.035;skirt.add(pleat);const trim=box(.25,.055,.72,mint);trim.position.set(i*.20,.56,.01);trim.rotation.z=i*.035;skirt.add(trim)}g.add(skirt);const legL=new THREE.Group(),legR=new THREE.Group();function leg(l,side){const thigh=box(.23,.38,.25,skin);thigh.position.y=-.10;l.add(thigh);const sock=box(.25,.30,.27,white);sock.position.y=-.40;l.add(sock);const stripe=box(.27,.055,.29,mint);stripe.position.y=-.31;l.add(stripe);const shoe=box(.36,.23,.52,cyan2);shoe.position.set(0,-.61,.08);l.add(shoe);const sole=box(.40,.08,.56,white);sole.position.set(0,-.73,.08);l.add(sole);l.position.set(side*.25,.56,0);g.add(l)}leg(legL,-1);leg(legR,1);g.scale.setScalar(1.08);g.userData={torso,head,armL,armR,legL,legR};return g}
const player=makeStabi();world.add(player);const pshadow=new THREE.Mesh(new THREE.CircleGeometry(.75,20),new THREE.MeshBasicMaterial({color:0x00e5dc,transparent:true,opacity:.15,depthWrite:false}));pshadow.rotation.x=-Math.PI/2;pshadow.position.y=.02;world.add(pshadow);
function wheel(x,z){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,12),mat(0x090e12,.85));t.rotation.x=Math.PI/2;g.add(t);const h=new THREE.Mesh(new THREE.CylinderGeometry(.10,.10,.17,10),mat(0x8da9ad,.35,.6));h.rotation.x=Math.PI/2;g.add(h);g.position.set(x,.24,z);return g}
function car(row,dir,x,v,i){const cols=[0xef4d68,0x155a5d,0xe2a13c,0x268dcc,0x7752a6];const c=cols[(row+i)%cols.length],g=new THREE.Group(),w=2.55+(i%3)*.18,d=1.18+(i%2)*.06;const body=box(w,.55,d,c,.45,.08);body.position.y=.5;g.add(body);const hood=box(w*.30,.12,d*.92,c,.42,.08);hood.position.set(dir*w*.31,.80,0);g.add(hood);const trunk=box(w*.22,.12,d*.90,c,.44,.08);trunk.position.set(-dir*w*.36,.76,0);g.add(trunk);const cab=box(w*.42,.58,d*.82,c,.4,.08);cab.position.set(-dir*w*.08,1.03,0);g.add(cab);const glass=box(.06,.36,d*.70,0x86ffff,.18,.15,0x26f5f1,.8);glass.position.set(dir*w*.13,1.08,0);g.add(glass);for(const side of [-1,1]){const sideWin=box(w*.22,.30,.035,0x4f8992,.2,.12,0x0a4147,.12);sideWin.position.set(-dir*w*.07,1.08,side*d*.43);g.add(sideWin);const head=box(.05,.18,.22,0xb8ffff,.2,0,0x33ffff,1.2);head.position.set(dir*w*.51,.58,side*d*.29);g.add(head);const tail=box(.05,.16,.20,0xff5e69,.25,0,0x9d1320,.55);tail.position.set(-dir*w*.51,.56,side*d*.29);g.add(tail)}const wheels=[];for(const sx of [-1,1])for(const sz of [-1,1]){const wh=wheel(sx*w*.34,sz*d*.49);g.add(wh);wheels.push(wh)}g.position.set(x,.02,-row*TILE);world.add(g);cars.push({g,dir,v,half:w*.51,wheels,phase:Math.random()*6.28})}
let coinTex;function usdz(){if(coinTex)return coinTex;const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');x.beginPath();x.arc(128,128,104,0,Math.PI*2);x.fillStyle='#5f918d';x.fill();x.fillStyle='#fff';x.font='bold 146px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('$',128,135);coinTex=new THREE.CanvasTexture(cv);coinTex.colorSpace=THREE.SRGBColorSpace;return coinTex}
function coin(row,x){const g=new THREE.Group(),sp=new THREE.Sprite(new THREE.SpriteMaterial({map:usdz(),transparent:true,depthWrite:false}));sp.scale.set(1.15,1.15,1);sp.position.y=.75;g.add(sp);g.position.set(x,0,-row*TILE);world.add(g);coins.push({g,sp,taken:false,seed:Math.random()*6.28})}
function road(row,z){const c=[0x061925,0x08202c,0x0a2632][Math.abs(row)%3],s=box(WIDTH,.24,TILE-.03,c,.95);s.position.set(0,-.12,z);world.add(s);for(const side of [-1,1]){const l=box(WIDTH,.025,.055,0x176e74,.5,0,0x0c565b,.15);l.position.set(0,.016,z+side*TILE*.43);world.add(l)}for(let x=-12;x<13;x+=4.5){const d=box(1.7,.023,.045,0x1b6770,.55);d.position.set(x+(row%2?1.1:0),.018,z);world.add(d)}}
function grass(row,z){const s=box(WIDTH,.26,TILE-.04,row%4?0x0b5558:0x0a494d,.9,0,0x063638,.07);s.position.set(0,-.13,z);world.add(s);const v=box(WIDTH,.025,.055,0x159498,.5,0,0x0a6669,.18);v.position.set(0,.006,z-TILE*.48);world.add(v)}
function type(r){if(r<2)return'grass';const p=((r-2)%7+7)%7;return[0,1,3,4].includes(p)?'road':'grass'}
function build(){cars=[];coins=[];while(world.children.length)world.remove(world.children[0]);world.add(player,pshadow);for(let r=-7;r<MAX;r++){const z=-r*TILE;if(type(r)==='road'){road(r,z);const dir=r%2?1:-1,count=r<12?2:r%3===0?4:3;for(let j=0;j<count;j++)car(r,dir,(j-(count-1)/2)*10.6*dir,2.8+(r%4)*.35+Math.max(0,r-2)*.015,j)}else{grass(r,z);for(let i=0;i<3;i++)if(Math.random()<.66){const col=Math.floor(Math.random()*9)-4,x=col*TILE+(Math.random()-.5)*.5;if(!(Math.abs(x)<1.2&&r<4))tree(x,z+(Math.random()-.5)*.75,Math.random()<.5)}if(r>1&&Math.random()<.48)coin(r,(Math.floor(Math.random()*9)-4)*TILE)}}}
let running=false,ended=false,timeLeft=60,startTime=0,last=performance.now(),gx=0,gr=0,maxRow=0,moving=false,queued=null,hopStart=0,from=new THREE.Vector3(),to=new THREE.Vector3(),cc=0,lastSpeed=0;
function hud(){$('dist').textContent=Math.max(0,maxRow*3)+'m';$('coins').textContent=cc;$('timer').textContent='00:'+String(Math.max(0,Math.ceil(timeLeft))).padStart(2,'0')}
function face(x,z){const dx=x-player.position.x,dz=z-player.position.z;if(Math.abs(dx)+Math.abs(dz)>.001)player.rotation.y=Math.atan2(dx,dz)}
function reset(){build();gx=gr=maxRow=cc=lastSpeed=0;timeLeft=60;moving=false;queued=null;ended=false;running=true;startTime=performance.now();player.position.set(0,.25,0);face(0,-TILE);$('result').style.display='none';$('ui').style.display='block';hud()}
function move(d){if(!running||ended)return;if(moving){queued=d;return}let nx=gx,nr=gr;if(d==='up')nr++;if(d==='down')nr--;if(d==='left')nx--;if(d==='right')nx++;if(nx<-HALF||nx>HALF||nr<0)return;gx=nx;gr=nr;maxRow=Math.max(maxRow,gr);moving=true;hopStart=performance.now();from.copy(player.position);to.set(gx*TILE,.25,-gr*TILE);face(to.x,to.z);const lv=Math.floor(maxRow/9);if(lv>lastSpeed){lastSpeed=lv;$('speed').classList.add('on');setTimeout(()=>$('speed').classList.remove('on'),850)}hud()}
function boost(){return 1+Math.min(1.7,Math.floor(maxRow/9)*.12)}
function hit(){for(const c of cars)if(Math.abs(c.g.position.z-player.position.z)<.78&&Math.abs(c.g.position.x-player.position.x)<c.half+.34&&player.position.y<.92){finish(false);return}}
function collect(){for(const c of coins)if(!c.taken&&Math.abs(c.g.position.z-player.position.z)<.7&&Math.abs(c.g.position.x-player.position.x)<.68){c.taken=true;c.g.visible=false;cc++;hud()}}
function finish(time){if(ended)return;ended=true;running=false;$('resultTitle').textContent=time?'TIME CLEARED':'FRONTIER HIT';$('resultText').textContent='Distance: '+Math.max(0,maxRow*3)+'m • USDZ: '+cc;setTimeout(()=>$('result').style.display='flex',120)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.034,(now-last)/1000||.016);last=now;if(running){timeLeft=Math.max(0,60-(now-startTime)/1000);const b=boost();for(const c of cars){const v=c.v*b;c.g.position.x+=v*dt*c.dir;c.g.position.y=.02+Math.sin(now*.004+c.phase)*.018;for(const w of c.wheels)w.rotation.z-=v*dt*c.dir*1.75;if(c.g.position.x>WIDTH*.75)c.g.position.x=-WIDTH*.75;if(c.g.position.x<-WIDTH*.75)c.g.position.x=WIDTH*.75}if(moving){const dur=Math.max(122,176-Math.min(54,maxRow*.85)),p=Math.min(1,(now-hopStart)/dur),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;player.position.lerpVectors(from,to,s);player.position.y=.25+Math.sin(Math.PI*p)*.82;const sw=Math.sin(p*Math.PI*2),u=player.userData;u.armL.rotation.x=sw*.52;u.armR.rotation.x=-sw*.52;u.legL.rotation.x=-sw*.42;u.legR.rotation.x=sw*.42;u.torso.scale.y=1+Math.sin(Math.PI*p)*.05;if(p>=1){moving=false;player.position.copy(to);u.armL.rotation.x=u.armR.rotation.x=u.legL.rotation.x=u.legR.rotation.x=0;u.torso.scale.set(1,1,1);collect();hit();if(queued&&!ended){const q=queued;queued=null;move(q)}}}hit();if(timeLeft<=0)finish(true)}else{player.userData.head.rotation.z=Math.sin(now*.0035)*.012}for(const c of coins)if(!c.taken){c.g.position.y=Math.sin(now*.003+c.seed)*.12;const p=1+Math.sin(now*.006+c.seed)*.08;c.sp.scale.set(1.15*p,1.15*p,1)}pshadow.position.set(player.position.x,.02,player.position.z);const target=new THREE.Vector3(player.position.x+15.5,26,player.position.z+21);camera.position.lerp(target,1-Math.exp(-dt*5));camera.lookAt(player.position.x,.35,player.position.z-7.5);hud();renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}
resize();build();requestAnimationFrame(loop);$('play').onclick=()=>{$('start').style.display='none';reset()};$('again').onclick=reset;document.querySelectorAll('.ctrl').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)}));addEventListener('keydown',e=>{if(['ArrowUp','KeyW','Space'].includes(e.code))move('up');if(['ArrowDown','KeyS'].includes(e.code))move('down');if(['ArrowLeft','KeyA'].includes(e.code))move('left');if(['ArrowRight','KeyD'].includes(e.code))move('right')});let sx=0,sy=0,sw=false;renderer.domElement.addEventListener('pointerdown',e=>{if(!running)return;sx=e.clientX;sy=e.clientY;sw=true});renderer.domElement.addEventListener('pointerup',e=>{if(!sw||!running)return;sw=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<24)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?'right':'left'):move(dy>0?'down':'up')});addEventListener('resize',resize)
</script>
</body></html>
