<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06181a"/><stop offset="1" stop-color="#020b0d"/></linearGradient>
  <radialGradient id="eth" cx="0" cy="0" r="1"><stop stop-color="#6544bd" stop-opacity=".75"/><stop offset="1" stop-color="#24183d" stop-opacity=".06"/></radialGradient>
  <radialGradient id="arb" cx="1" cy="0" r="1"><stop stop-color="#159de1" stop-opacity=".78"/><stop offset="1" stop-color="#08243c" stop-opacity=".06"/></radialGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18373a"/><stop offset="1" stop-color="#0a2023"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#247777"/><stop offset="1" stop-color="#123c42"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#79eadc" stroke-opacity=".035"/></pattern>
</defs>
<rect width="900" height="1600" fill="url(#bg)"/><rect width="900" height="1600" fill="url(#grid)"/>
