<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Map Fix Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061718}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="shell" src="play-sharp.html?v=e067844"></iframe><script>
(async()=>{const shell=document.getElementById('shell');let mapData='';try{const parts=await Promise.all(Array.from({length:10},async(_,i)=>{const n=String(i).padStart(2,'0');const r=await fetch('assets/maps/stabilizer-nexus-map-'+n+'.b64?v=mapcanvas1');if(!r.ok)throw new Error('Map '+n+' '+r.status);return(await r.text()).replace(/\s+/g,'')}));mapData='data:image/webp;base64,'+parts.join('')}catch(e){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;z-index:999;left:8px;bottom:8px;background:#300;color:#fff;padding:7px;font:12px monospace">'+e.message+'</div>');return}
function apply(){try{const d1=shell.contentDocument;if(!d1)return false;const inner=d1.getElementById('game');if(!inner)return false;const d2=inner.contentDocument;if(!d2)return false;const cv=d2.getElementById('g')||d2.querySelector('canvas');if(!cv)return false;cv.style.backgroundImage='linear-gradient(rgba(1,10,13,.08),rgba(1,10,13,.08)),url("'+mapData+'")';cv.style.backgroundSize='cover';cv.style.backgroundPosition='center';cv.style.backgroundRepeat='no-repeat';cv.style.backgroundColor='#061718';cv.dataset.mapCanvasFix='1';return true}catch(e){return false}}
shell.addEventListener('load',()=>{setTimeout(apply,300);setTimeout(apply,900);setTimeout(apply,1800)});let tries=0;const timer=setInterval(()=>{tries++;if(apply()&&tries>12)clearInterval(timer);if(tries>80)clearInterval(timer)},250)
})();
</script></body></html>
