<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive • Nexus Original Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}#host{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="host" src="play-logo-bg-test.html?v=nexus-original-test-1" allow="autoplay" title="Stabi Survive Nexus Original Test"></iframe><script>(()=>{const host=document.getElementById('host');const raw='https://raw.githubusercontent.com/Youngliee/Stabi-survive/803e3b9aee203aaa8c0a568baacf1ee52ae2f8f2/assets/maps/nexus-portrait-original-q80.webp.b64';let dataUrl='';async function load(){try{const r=await fetch(raw,{cache:'no-store'});if(!r.ok)throw new Error('map data '+r.status);const b=(await r.text()).trim();dataUrl='data:image/webp;base64,'+b;return true}catch(e){console.error(e);return false}}function apply(){try{if(!dataUrl)return false;const shell=host.contentDocument;if(!shell)return false;const game=shell.getElementById('game');if(!game)return false;const d=game.contentDocument;if(!d||!d.body)return false;d.documentElement.style.background='#031214';d.body.style.backgroundColor='#031214';d.body.style.backgroundImage='url("'+dataUrl+'")';d.body.style.backgroundSize='cover';d.body.style.backgroundPosition='center center';d.body.style.backgroundRepeat='no-repeat';d.body.style.backgroundAttachment='fixed';const c=d.querySelector('canvas');if(c){c.style.backgroundImage='url("'+dataUrl+'")';c.style.backgroundSize='cover';c.style.backgroundPosition='center';c.style.backgroundRepeat='no-repeat'}d.body.dataset.nexusOriginalTest='1';return true}catch(_){return false}}load().then(()=>{setTimeout(apply,200);setInterval(apply,500)});host.addEventListener('load',()=>setTimeout(apply,250))})();</script></body></html>
