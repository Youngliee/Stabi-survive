<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi 3D Character Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#0b3b3a 0,#04191b 38%,#021013 100%);font-family:Arial,sans-serif;color:#eafffb}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:18px;top:16px;padding:9px 12px;border:1px solid #46e9df;border-radius:10px;background:#031a1ddd;font:800 12px monospace;letter-spacing:.08em}.tag b{color:#68f4e9}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 13px;border:1px solid #2c837e;border-radius:10px;background:#031417dd;color:#9ed8d3;font:700 11px monospace;white-space:nowrap}.badge{position:absolute;right:18px;top:16px;color:#ffd86a;font:800 10px monospace;letter-spacing:.12em}</style></head><body><div class="ui"><div class="tag">STABI <b>3D TEST V2</b></div><div class="badge">CHIBI SEMI-VOXEL</div><div class="hint">Drag to rotate • Pinch / wheel to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(5.3,4.35,7.2);scene.add(new THREE.HemisphereLight(0xd9fffb,0x06151b,2.5));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-4,8,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x3cebe1,2);rim.position.set(5,4,-6);scene.add(rim);const root=new THREE.Group();scene.add(root);const SKIN=0xf3bea4,HAIR=0x0e2c83,HAIR2=0x1c43a5,CYAN=0x59cdd1,CYAN2=0x92e3e3,WHITE=0xf7f9f6,SHOE=0x54c9d2,SOLE=0xffffff,EYE=0x1c79df,DARK=0x071b51,PINK=0xe46e7e;function mat(c,r=.6){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.015,flatShading:false})}function mesh(g,m,x,y,z,sx=1,sy=1,sz=1){m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function sph(g,r,c,x,y,z,sx=1,sy=1,sz=1,seg=24){return mesh(g,new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.max(12,seg/2)),mat(c)),x,y,z,sx,sy,sz)}function box(g,w,h,d,c,x,y,z){return mesh(g,new THREE.Mesh(new THREE.BoxGeometry(w,h,d,2,2,2),mat(c)),x,y,z)}function cyl(g,rt,rb,h,c,x,y,z,rad=14){return mesh(g,new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,rad),mat(c)),x,y,z)}function makeStabi(){const g=new THREE.Group();const head=new THREE.Group();g.add(head);sph(head,.76,SKIN,0,2.5,.03,1.0,.92,.9,28);sph(head,.8,HAIR,0,2.68,-.12,1.04,.88,.92,22);for(const [x,y,z,sx,sy,sz] of [[-.48,2.65,.48,.42,.78,.3],[-.25,2.79,.52,.36,.9,.28],[0,2.83,.53,.38,.95,.28],[.25,2.79,.52,.36,.9,.28],[.48,2.65,.48,.42,.78,.3]])sph(head,.34,HAIR2,x,y,z,sx,sy,sz,14);for(const [x,z,sy] of [[-.56,-.15,1.25],[.56,-.15,1.25],[-.4,-.5,1.18],[-.13,-.56,1.28],[.14,-.56,1.28],[.4,-.5,1.18]])sph(head,.29,HAIR,x,2.48,z,.55,sy,.48,14);for(const x of[-.26,.26]){sph(head,.21,0xffffff,x,2.47,.67,1,.98,.34,24);sph(head,.15,EYE,x,2.45,.705,1,.98,.3,20);sph(head,.078,DARK,x,2.42,.73,1,.98,.28,18);sph(head,.043,0xffffff,x-.035,2.51,.747,1,.9,.22,16)}sph(head,.085,PINK,0,2.23,.705,1.28,.38,.25,18);sph(head,.078,0xf1a6ab,-.47,2.31,.62,1.2,.38,.22,16);sph(head,.078,0xf1a6ab,.47,2.31,.62,1.2,.38,.22,16);const body=new THREE.Group();g.add(body);sph(body,.62,CYAN,0,1.5,0,1.0,.74,.72,24);sph(body,.58,CYAN2,0,1.72,-.01,1.02,.22,.74,18);sph(body,.58,CYAN2,0,1.18,0,1.0,.16,.76,18);const cv=document.createElement('canvas');cv.width=cv.height=128;const cx=cv.getContext('2d');cx.clearRect(0,0,128,128);cx.fillStyle='#fff';cx.font='900 86px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('S',64,67);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const logo=new THREE.Mesh(new THREE.PlaneGeometry(.4,.47),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));mesh(body,logo,0,1.51,.47);sph(body,.62,WHITE,0,.98,0,1.03,.24,.78,20);for(const x of[-.38,-.13,.13,.38])box(body,.026,.23,.73,CYAN2,x,.98,.015);box(body,1.08,.04,.73,CYAN2,0,1.08,.02);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s] of [[armL,-1],[armR,1]]){sph(a,.22,CYAN,0,-.03,0,1,.95,.9,20);cyl(a,.145,.13,.38,CYAN,0,-.25,0,14);sph(a,.15,SKIN,0,-.49,.02,1,.92,.92,20);a.position.set(s*.61,1.57,0);a.rotation.z=s*.11;g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s] of [[legL,-1],[legR,1]]){cyl(l,.13,.12,.34,WHITE,0,-.04,0,14);sph(l,.27,SHOE,0,-.3,.1,1.35,.72,1.12,20);sph(l,.28,SOLE,0,-.42,.1,1.38,.34,1.15,20);box(l,.3,.065,.5,WHITE,0,-.23,.12);l.position.set(s*.27,.73,0);g.add(l)}g.scale.setScalar(1.03);g.userData={armL,armR,legL,legR};return g}const stabi=makeStabi();root.add(stabi);const ring=new THREE.Mesh(new THREE.RingGeometry(1.05,1.12,64),new THREE.MeshBasicMaterial({color:0x49e8df,transparent:true,opacity:.75,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;root.add(ring);const disc=new THREE.Mesh(new THREE.CircleGeometry(1.0,64),new THREE.MeshBasicMaterial({color:0x0a5352,transparent:true,opacity:.26}));disc.rotation.x=-Math.PI/2;disc.position.y=.025;root.add(disc);let drag=false,lastX=0,lastY=0,rotY=.35,targetY=.35,tilt=0,targetTilt=0,zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.012;targetTilt=Math.max(-.25,Math.min(.25,targetTilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.72,Math.min(1.3,zoom+e.deltaY*.0008))},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)zoom=Math.max(.72,Math.min(1.3,zoom-(d-pinch)*.002));pinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(!drag)targetY+=.0024;rotY+=(targetY-rotY)*.08;tilt+=(targetTilt-tilt)*.08;root.rotation.y=rotY;root.rotation.x=tilt;camera.position.set(5.3*zoom,4.35*zoom,7.2*zoom);camera.lookAt(0,1.58,0);const u=stabi.userData,sw=Math.sin(t*3.1);u.armL.rotation.x=sw*.12;u.armR.rotation.x=-sw*.12;u.legL.rotation.x=-sw*.08;u.legR.rotation.x=sw*.08;stabi.position.y=.07+Math.sin(t*2.2)*.035;ring.rotation.z=t*.4;renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);loop();</script></body></html>
