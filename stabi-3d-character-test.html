<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi 3D Character Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#0b3b3a 0,#04191b 38%,#021013 100%);font-family:Arial,sans-serif;color:#eafffb}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:18px;top:16px;padding:9px 12px;border:1px solid #46e9df;border-radius:10px;background:#031a1ddd;font:800 12px monospace;letter-spacing:.08em}.tag b{color:#68f4e9}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 13px;border:1px solid #2c837e;border-radius:10px;background:#031417dd;color:#9ed8d3;font:700 11px monospace;white-space:nowrap}.badge{position:absolute;right:18px;top:16px;color:#ffd86a;font:800 10px monospace;letter-spacing:.12em}</style></head><body><div class="ui"><div class="tag">STABI <b>3D TEST</b></div><div class="badge">SEMI-VOXEL CHIBI</div><div class="hint">Drag to rotate • Pinch / wheel to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(5.8,4.7,7.7);scene.add(new THREE.HemisphereLight(0xd9fffb,0x06151b,2.4));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-4,8,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x3cebe1,2);rim.position.set(5,4,-6);scene.add(rim);const root=new THREE.Group();scene.add(root);const SKIN=0xf2b99d,HAIR=0x102d88,HAIR2=0x1a43a9,CYAN=0x52c9cf,CYAN2=0x85e0df,WHITE=0xf5f8f5,SHOE=0x4ac7d1,SOLE=0xf9ffff,EYE=0x1778df,DARK=0x081d54,PINK=0xe27682;function mat(c,r=.62){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.02,flatShading:true})}function mesh(g,m,x,y,z,sx=1,sy=1,sz=1){m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function box(g,w,h,d,c,x,y,z,bevel=.08){const geo=new THREE.BoxGeometry(w,h,d,3,3,3);const m=new THREE.Mesh(geo,mat(c));return mesh(g,m,x,y,z)}function sph(g,r,c,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat(c));return mesh(g,m,x,y,z,sx,sy,sz)}function cyl(g,rt,rb,h,c,x,y,z,rad=10){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,rad),mat(c));return mesh(g,m,x,y,z)}function makeStabi(){const g=new THREE.Group();const head=new THREE.Group();g.add(head);sph(head,.72,SKIN,0,2.45,.02,1.02,.92,.9);sph(head,.77,HAIR,0,2.62,-.13,1.08,.9,.96);box(head,1.22,.22,.22,HAIR2,0,2.84,.42);for(const [x,y,s] of [[-.48,2.67,.85],[-.27,2.79,1],[0,2.82,1.04],[.27,2.79,1],[.48,2.67,.85]])box(head,.25,.58,.22,HAIR2,x,y,.48);for(const x of[-.25,.25]){sph(head,.19,0xffffff,x,2.45,.66,1,.95,.32);sph(head,.145,EYE,x,2.43,.69,1,.95,.3);sph(head,.073,DARK,x,2.4,.715,1,.95,.28);sph(head,.04,0xffffff,x-.035,2.49,.73,1,.9,.25)}sph(head,.09,PINK,0,2.22,.69,1.2,.35,.22);sph(head,.08,0xf0a3a9,-.46,2.28,.61,1.15,.35,.2);sph(head,.08,0xf0a3a9,.46,2.28,.61,1.15,.35,.2);const body=new THREE.Group();g.add(body);box(body,1.02,.68,.64,CYAN,0,1.48,0);box(body,1.06,.12,.66,CYAN2,0,1.79,0);box(body,.82,.14,.7,CYAN2,0,1.12,0);const cv=document.createElement('canvas');cv.width=cv.height=128;const cx=cv.getContext('2d');cx.clearRect(0,0,128,128);cx.fillStyle='#fff';cx.font='900 86px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('S',64,67);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const logo=new THREE.Mesh(new THREE.PlaneGeometry(.38,.46),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));mesh(body,logo,0,1.5,.326);box(body,1.08,.25,.72,WHITE,0,.98,0);for(const x of[-.4,-.13,.14,.41])box(body,.025,.25,.73,CYAN2,x,.98,0);box(body,1.1,.045,.735,CYAN2,0,1.08,0);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s] of [[armL,-1],[armR,1]]){sph(a,.21,CYAN,0,-.05,0,1,.95,.9);cyl(a,.16,.14,.42,CYAN,0,-.25,0,9);sph(a,.145,SKIN,0,-.5,.02,1,.9,.9);a.position.set(s*.65,1.58,0);a.rotation.z=s*.1;g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s] of [[legL,-1],[legR,1]]){cyl(l,.14,.13,.37,WHITE,0,-.04,0,9);box(l,.42,.23,.58,SHOE,0,-.32,.09);box(l,.44,.075,.6,SOLE,0,-.45,.09);box(l,.28,.07,.59,WHITE,0,-.23,.1);l.position.set(s*.28,.73,0);g.add(l)}for(const x of[-.57,.57])box(g,.16,.55,.28,HAIR,x,2.4,-.18);for(const x of[-.38,-.12,.14,.4])box(g,.25,.72,.25,HAIR,x,2.42,-.55);g.scale.setScalar(1.05);g.userData={armL,armR,legL,legR};return g}const stabi=makeStabi();root.add(stabi);const ring=new THREE.Mesh(new THREE.RingGeometry(1.05,1.12,64),new THREE.MeshBasicMaterial({color:0x49e8df,transparent:true,opacity:.75,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;root.add(ring);const disc=new THREE.Mesh(new THREE.CircleGeometry(1.0,64),new THREE.MeshBasicMaterial({color:0x0a5352,transparent:true,opacity:.26}));disc.rotation.x=-Math.PI/2;disc.position.y=.025;root.add(disc);let drag=false,lastX=0,lastY=0,rotY=.35,targetY=.35,tilt=0,targetTilt=0,zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.012;targetTilt=Math.max(-.25,Math.min(.25,targetTilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.72,Math.min(1.3,zoom+e.deltaY*.0008))},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)zoom=Math.max(.72,Math.min(1.3,zoom-(d-pinch)*.002));pinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(!drag)targetY+=.0025;rotY+=(targetY-rotY)*.08;tilt+=(targetTilt-tilt)*.08;root.rotation.y=rotY;root.rotation.x=tilt;camera.position.set(5.8*zoom,4.7*zoom,7.7*zoom);camera.lookAt(0,1.55,0);const u=stabi.userData,sw=Math.sin(t*3.1);u.armL.rotation.x=sw*.12;u.armR.rotation.x=-sw*.12;u.legL.rotation.x=-sw*.08;u.legR.rotation.x=sw*.08;stabi.position.y=.07+Math.sin(t*2.2)*.035;ring.rotation.z=t*.4;renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);loop();</script></body></html>
