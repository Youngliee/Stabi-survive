<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi 3D Character Test V4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 28%,#0b3040 0,#041723 44%,#020b12 100%);font-family:Arial,sans-serif;color:#eafffb}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:14px;top:12px;padding:9px 11px;border:1px solid #27e5dc;border-radius:9px;background:#02141bdd;font:900 11px monospace;letter-spacing:.08em}.tag b{color:#53f4e8}.badge{position:absolute;right:14px;top:12px;padding:8px 9px;border:1px solid #245e77;border-radius:8px;background:#03141ddd;color:#8bdff0;font:800 9px monospace;letter-spacing:.1em}.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 11px;border:1px solid #277f85;border-radius:8px;background:#021217dd;color:#9cd8db;font:700 10px monospace;white-space:nowrap}</style></head><body><div class="ui"><div class="tag">STABI <b>3D TEST V4</b></div><div class="badge">3/4 REFERENCE BUILD</div><div class="hint">Drag to rotate • Pinch / wheel to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);camera.position.set(6.4,4.8,8.8);scene.add(new THREE.HemisphereLight(0xe4fffd,0x031018,2.35));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-5,8,7);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x2ddfd5,1.6);rim.position.set(5,4,-5);scene.add(rim);const root=new THREE.Group();scene.add(root);const C={skin:0xf4bf9d,hair:0x082f9e,hair2:0x0b42c4,cyan:0x16bdd6,mint:0x75e3d8,white:0xf7fbfb,shoe:0x19bde1,sole:0xffffff,eye:0x1e7ee7,dark:0x061b53,pink:0xf05b69,blush:0xf4a0a5};function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.56,metalness:.01,flatShading:true})}function box(g,w,h,d,c,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function logoS(g,x,y,z,ry=0,s=.42){const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');c.clearRect(0,0,128,128);c.fillStyle='#fff';c.font='900 92px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('S',64,70);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(s,s*1.18),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.y=ry;g.add(m)}function makeStabi(){const g=new THREE.Group();const head=new THREE.Group();g.add(head);box(head,1.44,1.12,1.16,C.skin,0,2.55,.02);box(head,1.62,.28,1.28,C.hair,0,3.14,-.02);for(const x of[-.62,-.36,-.1,.18,.46,.68])box(head,.28,.62,.32,x===.18?C.hair2:C.hair,x,2.88,.51,0,0,(x*.06));for(const p of[[-.72,2.67,.1,.30,.80,.48],[-.55,2.72,-.32,.28,.90,.36],[-.28,2.76,-.50,.29,.96,.30],[0,2.78,-.55,.3,1.0,.28],[.3,2.75,-.5,.3,.94,.3],[.57,2.69,-.32,.28,.84,.36],[.73,2.64,.08,.27,.74,.44]])box(head,p[3],p[4],p[5],C.hair,p[0],p[1],p[2]);for(const x of[-.29,.29]){box(head,.28,.34,.055,0xffffff,x,2.53,.608);box(head,.19,.26,.06,C.eye,x,2.51,.64);box(head,.09,.16,.065,C.dark,x,2.47,.67);box(head,.05,.075,.07,0xffffff,x-.035,2.62,.685)}box(head,.22,.11,.05,C.pink,0,2.23,.62);box(head,.13,.045,.05,C.blush,-.48,2.34,.62);box(head,.13,.045,.05,C.blush,.48,2.34,.62);const body=new THREE.Group();g.add(body);box(body,1.04,.76,.68,C.cyan,0,1.52,0);box(body,1.08,.13,.71,C.mint,0,1.84,0);box(body,.13,.72,.70,C.mint,-.42,1.51,.01);box(body,.13,.72,.70,C.mint,.42,1.51,.01);box(body,.13,.70,.72,C.white,0,1.51,.01);logoS(body,-.23,1.55,.356,0,.34);const skirt=new THREE.Group();g.add(skirt);box(skirt,1.18,.27,.78,C.white,0,.99,0);box(skirt,1.21,.065,.80,C.mint,0,1.11,0);for(const x of[-.47,-.24,0,.24,.47])box(skirt,.025,.26,.79,C.cyan,x,.99,.01);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s] of [[armL,-1],[armR,1]]){box(a,.32,.50,.36,C.cyan,0,-.04,0);box(a,.34,.1,.38,C.mint,0,-.33,0);box(a,.24,.23,.27,C.skin,0,-.50,0);a.position.set(s*.70,1.61,0);a.rotation.z=s*.07;g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s] of [[legL,-1],[legR,1]]){box(l,.29,.36,.31,C.skin,0,.02,0);box(l,.31,.14,.34,C.white,0,-.18,0);box(l,.33,.09,.35,C.cyan,0,-.27,0);box(l,.48,.27,.67,C.shoe,0,-.43,.10);box(l,.50,.09,.69,C.sole,0,-.60,.10);box(l,.30,.07,.66,C.white,0,-.36,.11);l.position.set(s*.30,.73,0);g.add(l)}logoS(body,0,1.55,-.356,Math.PI,.46);g.userData={armL,armR,legL,legR};g.scale.setScalar(1.03);return g}const stabi=makeStabi();root.add(stabi);const ring=new THREE.Mesh(new THREE.RingGeometry(1.18,1.27,72),new THREE.MeshBasicMaterial({color:0x39e8df,transparent:true,opacity:.78,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;root.add(ring);const disc=new THREE.Mesh(new THREE.CircleGeometry(1.14,72),new THREE.MeshBasicMaterial({color:0x0b4550,transparent:true,opacity:.22}));disc.rotation.x=-Math.PI/2;disc.position.y=.02;root.add(disc);let drag=false,lastX=0,lastY=0,rotY=.68,targetY=.68,tilt=0,targetTilt=0,zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.012;targetTilt=Math.max(-.22,Math.min(.22,targetTilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.70,Math.min(1.35,zoom+e.deltaY*.0008))},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)zoom=Math.max(.70,Math.min(1.35,zoom-(d-pinch)*.002));pinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(!drag)targetY+=.0018;rotY+=(targetY-rotY)*.08;tilt+=(targetTilt-tilt)*.08;root.rotation.y=rotY;root.rotation.x=tilt;camera.position.set(6.4*zoom,4.8*zoom,8.8*zoom);camera.lookAt(0,1.62,0);const u=stabi.userData,sw=Math.sin(t*3.1);u.armL.rotation.x=sw*.08;u.armR.rotation.x=-sw*.08;u.legL.rotation.x=-sw*.055;u.legR.rotation.x=sw*.055;stabi.position.y=.06+Math.sin(t*2.1)*.025;ring.rotation.z=t*.32;renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);loop();</script></body></html>
