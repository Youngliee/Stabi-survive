<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi 3D Character Test V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#0b3040 0,#041723 42%,#020b12 100%);font-family:Arial,sans-serif;color:#eafffb}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.tag{position:absolute;left:16px;top:14px;padding:10px 12px;border:1px solid #27e5dc;border-radius:10px;background:#02141bdd;font:900 12px monospace;letter-spacing:.08em}.tag b{color:#53f4e8}.badge{position:absolute;right:16px;top:14px;padding:8px 10px;border:1px solid #245e77;border-radius:9px;background:#03141ddd;color:#8bdff0;font:800 10px monospace;letter-spacing:.12em}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 13px;border:1px solid #277f85;border-radius:9px;background:#021217dd;color:#9cd8db;font:700 11px monospace;white-space:nowrap}</style></head><body><div class="ui"><div class="tag">STABI <b>3D TEST V3</b></div><div class="badge">VOXEL CHIBI REFERENCE MATCH</div><div class="hint">Drag to rotate • Pinch / wheel to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,.1,100);camera.position.set(6.2,4.8,8.4);scene.add(new THREE.HemisphereLight(0xd9fffb,0x041017,2.3));const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(-5,8,7);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x2ddfd5,1.7);rim.position.set(5,4,-5);scene.add(rim);const root=new THREE.Group();scene.add(root);const C={skin:0xf1b89a,hair:0x102a80,hair2:0x173a9d,cyan:0x23a9c1,cyan2:0x72d3cc,white:0xf5f7f4,shoe:0x36b7cd,sole:0xffffff,eye:0x1a75dc,dark:0x07194d,pink:0xe4606e,green:0x91d55d};function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.58,metalness:.015,flatShading:true})}function box(g,w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function planeS(g,x,y,z,ry=0,scale=1){const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');c.clearRect(0,0,128,128);c.fillStyle='#fff';c.font='900 92px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('S',64,70);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(.42*scale,.5*scale),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.y=ry;g.add(m);return m}function makeStabi(){const g=new THREE.Group();const head=new THREE.Group();g.add(head);box(head,1.34,1.08,1.08,C.skin,0,2.43,.02);box(head,1.48,.26,1.17,C.hair,0,2.98,-.04);for(const p of[[-.56,2.73,.42,.3,.58,.27],[-.28,2.82,.48,.3,.7,.3],[0,2.86,.5,.3,.76,.3],[.28,2.82,.48,.3,.7,.3],[.56,2.73,.42,.3,.58,.27]])box(head,p[3],p[4],p[5],C.hair2,p[0],p[1],p[2]);for(const p of[[-.63,2.48,.03,.26,.72,.48],[.63,2.48,.03,.26,.72,.48],[-.48,2.48,-.45,.28,.74,.28],[-.18,2.5,-.53,.28,.8,.27],[.13,2.5,-.55,.28,.82,.27],[.43,2.48,-.47,.28,.76,.28]])box(head,p[3],p[4],p[5],C.hair,p[0],p[1],p[2]);for(const x of[-.27,.27]){box(head,.25,.31,.05,0xffffff,x,2.43,.566);box(head,.17,.23,.055,C.eye,x,2.42,.595);box(head,.08,.14,.06,C.dark,x,2.39,.624);box(head,.045,.065,.063,0xffffff,x-.034,2.5,.635)}box(head,.15,.075,.045,C.pink,0,2.17,.57);box(head,.11,.04,.045,0xf2a1a7,-.46,2.25,.57);box(head,.11,.04,.045,0xf2a1a7,.46,2.25,.57);const body=new THREE.Group();g.add(body);box(body,1.02,.72,.65,C.cyan,0,1.47,0);box(body,1.06,.12,.67,C.cyan2,0,1.78,0);box(body,.1,.66,.67,C.cyan2,-.39,1.47,.01);box(body,.1,.66,.67,C.cyan2,.39,1.47,.01);box(body,.12,.66,.68,C.white,0,1.47,.01);planeS(body,-.2,1.48,.333,0,.78);planeS(body,0,1.48,-.333,Math.PI,1.05);box(body,.19,.17,.13,C.green,.22,1.56,.34);const skirt=new THREE.Group();g.add(skirt);box(skirt,1.1,.24,.72,C.white,0,.98,0);box(skirt,1.14,.055,.75,C.cyan2,0,1.09,0);for(const x of[-.43,-.22,0,.22,.43])box(skirt,.026,.24,.74,C.cyan2,x,.98,.01);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s] of [[armL,-1],[armR,1]]){box(a,.31,.46,.34,C.cyan,0,-.08,0);box(a,.33,.09,.36,C.cyan2,0,-.33,0);box(a,.24,.2,.26,C.skin,0,-.48,0);a.position.set(s*.65,1.56,0);a.rotation.z=s*.08;g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s] of [[legL,-1],[legR,1]]){box(l,.28,.34,.3,C.skin,0,.02,0);box(l,.3,.13,.34,C.white,0,-.17,0);box(l,.44,.25,.62,C.shoe,0,-.38,.09);box(l,.46,.08,.64,C.sole,0,-.54,.09);box(l,.29,.08,.63,C.white,0,-.31,.1);l.position.set(s*.28,.74,0);g.add(l)}g.scale.setScalar(1.03);g.userData={armL,armR,legL,legR};return g}const stabi=makeStabi();root.add(stabi);const ring=new THREE.Mesh(new THREE.RingGeometry(1.12,1.2,72),new THREE.MeshBasicMaterial({color:0x39e8df,transparent:true,opacity:.8,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;root.add(ring);const disc=new THREE.Mesh(new THREE.CircleGeometry(1.08,72),new THREE.MeshBasicMaterial({color:0x0b4550,transparent:true,opacity:.24}));disc.rotation.x=-Math.PI/2;disc.position.y=.02;root.add(disc);let drag=false,lastX=0,lastY=0,rotY=.45,targetY=.45,tilt=0,targetTilt=0,zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.012;targetTilt=Math.max(-.22,Math.min(.22,targetTilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.72,Math.min(1.3,zoom+e.deltaY*.0008))},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)zoom=Math.max(.72,Math.min(1.3,zoom-(d-pinch)*.002));pinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(!drag)targetY+=.0022;rotY+=(targetY-rotY)*.08;tilt+=(targetTilt-tilt)*.08;root.rotation.y=rotY;root.rotation.x=tilt;camera.position.set(6.2*zoom,4.8*zoom,8.4*zoom);camera.lookAt(0,1.58,0);const u=stabi.userData,sw=Math.sin(t*3.2);u.armL.rotation.x=sw*.1;u.armR.rotation.x=-sw*.1;u.legL.rotation.x=-sw*.07;u.legR.rotation.x=sw*.07;stabi.position.y=.06+Math.sin(t*2.15)*.03;ring.rotation.z=t*.35;renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);loop();</script></body></html>
