pace=backTex.colorSpace=THREE.SRGBColorSpace;function makeStabi(){const g=new THREE.Group(),m=new THREE.SpriteMaterial({map:frontTex,transparent:false,depthTest:false,depthWrite:false,toneMapped:false}),s=new THREE.Sprite(m);s.scale.set(2.45,3.15,1);s.position.y=1.58;s.renderOrder=999;g.add(s);g.userData={sprite:s,mat:m,dir:'down'};return g}const player=makeStabi();world.add(player);function setFacing(d){player.userData.dir=d;player.userData.mat.map=d==='up'?backTex:frontTex;player.userData.mat.needsUpdate=true;player.userData.sprite.scale.x=d==='left'?-2.45:2.45}const shadow=new THREE.Mesh(new THREE.CircleGeometry(.52,18),new THREE.MeshBasicMaterial({color:0x00e5dc,transparent:true,opacity:.16}));shadow.rotation.x=-Math.PI/2;world.add(shadow);function wheel(x,z){const w=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,12),mat(0x080a0c));w.rotation.x=Math.PI/2;w.position.set(x,.24,z);return w}const hazards=[{name:'SLIPPAGE',c:0xc9363d,d:0x781823},{name:'MEV',c:0x6544af,d:0x301c61},{name:'PRICE IMPACT',c:0x118d8d,d:0x075657}];function labelTex(text){const cv=document.createElement('canvas');cv.width=512;cv.height=192;const c=cv.getContext('2d');c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.font='900 62px Arial';if(text==='PRICE IMPACT'){c.font='900 54px Arial';c.fillText('PRICE',256,63);c.fillText('IMPACT',256,132)}else c.fillText(text,256,96);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t}function label(text,w,h,z,back=false){const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:labelTex(text),transparent:true,side:THREE.DoubleSide,depthWrite:false}));p.position.z=z;if(back)p.rotation.y=Math.PI;return p}function car(row,dir,x,v,i){const def=hazards[(row+i)%3],g=new THREE.Group(),truck=def.name==='PRICE IMPACT',w=truck?3.35:2.75,d=truck?1.3:1.18;const body=box(w,.58,d,def.c);body.position.y=.51;g.add(body);const cab=box(truck?.92:1.05,truck?.76:.63,d*.86,def.d);cab.position.set(truck?dir*1.08:-dir*.18,truck?.88:1.07,0);g.add(cab);const lw=def.name==='PRICE IMPACT'?1.48:def.name==='SLIPPAGE'?1.48:1;const a=label(def.name,lw,truck?.62:.36,d*.51+.01),b=label(def.name,lw,truck?.62:.36,-d*.51-.01,true);a.position.y=b.position.y=truck?1.1:.67;g.add(a,b);for(const sx of[-1,1])for(const sz of[-1,1])g.add(wheel(sx*w*.34,sz*d*.49));g.position.set(x,.02,-row*TILE);world.add(g);cars.push({g,dir,v,half:w*.51})}let coinTexture;function usdz(){if(coinTexture)return coinTexture;const cv=document.createElement('canvas');cv.width=cv.height=256;const c=cv.getContext('2d');c.beginPath();c.arc(128,128,100,0,Math.PI*2);c.fillStyle='#5f918d';c.fill();c.fillStyle='#fff';c.font='bold 145px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('$',128,134);coinTexture=new THREE.CanvasTexture(cv);return coinTexture}function coin(r,x){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:usdz(),transparent:true}));sp.scale.set(.9,.9,1);sp.position.set(x,.7,-r*TILE);world.add(sp);coins.push({g:sp,taken:false,s:Math.random()*6})}function road(r,z){const s=box(WIDTH,.24,TILE-.03,0x061923);s.position.set(0,-.12,z);world.add(s);for(let x=-12;x<13;x+=4.2){const d=box(1.55,.024,.055,0x2d7780);d.position.set(x+(r%2?1:0),.018,z);world.add(d)}}function grass(r,z){const s=box(WIDTH,.26,TILE-.04,r%3?0x0b5b5b:0x0a5052);s.position.set(0,-.13,z);world.add(s)}function type(r){if(r<2)return'grass';const p=((r-2)%7+7)%7;return[0,1,3,4].includes(p)?'road':'grass'}function build(){cars=[];coins=[];while(world.children.length)world.remove(world.children[0]);world.add(player,shadow);for(let r=-7;r<MAX;r++){const z=-r*TILE;if(type(r)==='road'){road(r,z);const dir=r%2?1:-1,count=r<12?2:r%3===0?4:3;for(let j=0;j<count;j++)car(r,dir,(j-(count-1)/2)*10.7*dir,2.8+(r%4)*.35,j)}else{grass(r,z);for(let i=0;i<3;i++)if(Math.random()<.62)tree((Math.floor(Math.random()*9)-4)*TILE,z+(Math.random()-.5)*.7);if(r>1&&Math.random()<.52)coin(r,(Math.floor(Math.random()*9)-4)*TILE)}}}let running=fals ving=false;player.position.copy(to);collect();hit();if(queued){const q=queued;queued=null;move(q)}}}hit();if(timeLeft<=0)finish()}for(const c of coins)if(!c.taken)c.g.position.y=.7+Math.sin(now*.003+c.s)*.1;shadow.position.set(player.position.x,.02,player.position.z);camera.position.lerp(new THREE.Vector3(player.position.x+15.5,26,player.position.z+21),1-Math.exp(-dt*5));camera.lookAt(player.position.x,.35,player.position.z-7.5);hud();renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();$('play').onclick=()=>{$('start').style.display='none';reset()};$('again').onclick=reset;document.querySelectorAll('.ctrl').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)}));addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(k){e.preventDefault();move(k)}});loop(performance.now());</script></body></html>
