<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crossy Stabi Playtest</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031922;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block}#ui{position:fixed;inset:0;z-index:10;pointer-events:none}.logo{position:absolute;left:14px;top:11px;color:#fff;font-weight:1000;font-size:clamp(27px,5vw,46px);line-height:.9}.logo b{color:#49e7dd;font-style:italic}.logo small{display:block;margin-top:7px;font-size:8px;letter-spacing:3px;color:#a5eeea}.hud{position:absolute;right:11px;top:10px;display:flex;gap:7px}.pill{min-width:68px;padding:7px 10px;border:1px solid #52e7df;background:#03161ddd;border-radius:12px;text-align:center;color:white;box-shadow:0 0 18px #3ce2d733}.pill small{display:block;font-size:7px;letter-spacing:1.4px;color:#7ff3ec}.pill b{font-size:16px}.controls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:205px;height:158px;pointer-events:auto}.ctrl{position:absolute;width:60px;height:52px;border-radius:8px;border:2px solid #55777d;background:#07151c;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 4px 0 #18343a}.ctrl.up{left:72px;top:0;background:#48ded5;color:#042125;border-color:#a2fff9}.ctrl.left{left:0;top:66px}.ctrl.down{left:72px;top:66px}.ctrl.right{right:0;top:66px}.timer{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);font:900 20px monospace;color:#45ece4}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 32%,#0b5960dd,#02131bdd 70%)}.card{width:min(420px,92vw);padding:26px 20px;text-align:center;background:#061820f2;border:1px solid #39ddd5;border-radius:18px;color:white;box-shadow:0 25px 80px #000b}.card h1{font-size:40px;margin:4px 0 10px}.card h1 span{color:#4ee8df}.card p{font-size:12px;color:#bddedc;line-height:1.5}.play{padding:13px 24px;border-radius:10px;border:1px solid #9afff7;background:#4ce2d8;color:#03191c;font-weight:1000;letter-spacing:2px}.result{display:none}@media(max-width:650px){.logo{font-size:28px;left:10px}.pill{min-width:58px;padding:6px}.controls{transform:translateX(-50%) scale(.9);transform-origin:center bottom}}</style></head><body><div id="ui" style="display:none"><div class="logo">CROSSY <b>STABI</b><small>STABLECOIN FRONTIER</small></div><div class="hud"><div class="pill"><small>DISTANCE</small><b id="dist">0m</b></div><div class="pill"><small>USDZ</small><b id="coins">0</b></div></div><div class="controls"><button class="ctrl up" data-dir="up">▲</button><button class="ctrl left" data-dir="left">◀</button><button class="ctrl down" data-dir="down">▼</button><button class="ctrl right" data-dir="right">▶</button><div class="timer" id="timer">00:60</div></div></div><section id="start" class="overlay"><div class="card"><div style="font-size:9px;letter-spacing:3px;color:#7cf2eb">STABILIZER COMMUNITY MINI GAME</div><h1>CROSSY <span>STABI</span></h1><p>Dodge SLIPPAGE, MEV, and PRICE IMPACT. Collect USDZ and go as far as you can.</p><button id="play" class="play">PLAY</button></div></section><section id="result" class="overlay result"><div class="card"><h1>RUN COMPLETE</h1><p id="resultText"></p><button id="again" class="play">RUN AGAIN</button></div></section><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x031922);scene.fog=new THREE.Fog(0x031922,55,125);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);const camera=new THREE.OrthographicCamera(-18,18,11,-11,.1,220);camera.position.set(24,29,28);scene.add(new THREE.HemisphereLight(0xbafff8,0x021114,1.75));const sun=new THREE.DirectionalLight(0xd2fffa,2.25);sun.position.set(-20,38,24);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-34;sun.shadow.camera.right=34;sun.shadow.camera.top=34;sun.shadow.camera.bottom=-34;scene.add(sun);const rim=new THREE.DirectionalLight(0x16cfc9,.8);rim.position.set(25,15,-20);scene.add(rim);const world=new THREE.Group();scene.add(world);const TILE=3.15,HALF=4,WIDTH=28.35,MAX=120;let cars=[],coins=[];function mat(c,r=.7,m=0,e=0,ei=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,flatShading:true,emissive:e,emissiveIntensity:ei})}function box(w,h,d,c,r=.7,m=0,e=0,ei=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,r,m,e,ei));o.castShadow=true;o.receiveShadow=true;return o}function tree(x,z,p=false){const g=new THREE.Group(),tr=box(.24,.86,.24,0x163137);tr.position.y=.43;g.add(tr);if(p){for(let i=0;i<3;i++){const q=new THREE.Mesh(new THREE.ConeGeometry(.66-i*.12,1.02,6),mat(i%2?0x087376:0x0a8585));q.position.y=.9+i*.45;q.castShadow=true;g.add(q)}}else{const q=new THREE.Mesh(new THREE.DodecahedronGeometry(.66,0),mat(0x0d7776));q.position.y=1.28;q.castShadow=true;g.add(q)}g.position.set(x,0,z);world.add(g)}function textSprite(t){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const c=cv.getContext('2d');c.font='900 58px Arial';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.shadowColor='#000';c.shadowBlur=8;c.fillText(t,256,66);const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(t.length>8?2.6:2.05,.52,1);return s}function makeStabi(){const g=new THREE.Group(),navy=0x172a78,navy2=0x2840a2,cyan=0x52c7ec,mint=0x8cf0c7,white=0xf8fbff,skin=0xffd2b5,blue=0x138cff,pink=0xff7895;const torso=box(.72,.62,.48,cyan);torso.position.y=.98;g.add(torso);const trim=box(.76,.08,.5,mint);trim.position.y=.69;g.add(trim);const stripe=box(.14,.56,.035,white);stripe.position.set(0,.98,.26);g.add(stripe);const badge=box(.12,.17,.03,white);badge.position.set(-.2,1.02,.27);g.add(badge);const bow=new THREE.Group();const k=box(.09,.09,.07,mint),bl=box(.16,.12,.06,mint),br=bl.clone();bl.position.x=-.12;br.position.x=.12;bow.add(k,bl,br);bow.position.set(0,1.25,.29);g.add(bow);const head=box(.78,.72,.68,skin);head.position.y=1.7;g.add(head);for(const x of [-.17,.17]){const ew=box(.18,.2,.03,white);ew.position.set(x,1.72,.355);g.add(ew);const ir=box(.1,.15,.035,blue);ir.position.set(x,1.71,.375);g.add(ir);const hi=box(.035,.04,.04,0xb9f5ff);hi.position.set(x+.02,1.76,.395);g.add(hi)}const bl1=box(.065,.035,.02,pink),bl2=bl1.clone();bl1.position.set(-.29,1.56,.36);bl2.position.set(.29,1.56,.36);g.add(bl1,bl2);const mouth=box(.15,.06,.025,0xb52b48);mouth.position.set(0,1.53,.37);g.add(mouth);const top=box(.86,.22,.74,navy);top.position.y=2.1;g.add(top);for(let i=-2;i<=2;i++){const b=box(.15,.34,.1,i%2?navy2:navy);b.position.set(i*.145,1.91,.38);g.add(b)}for(const s of [-1,1]){const side=box(.17,.52,.55,navy);side.position.set(s*.42,1.78,-.02);g.add(side)}const skirt=new THREE.Group();for(let i=-2;i<=2;i++){const p=box(.19,.26,.54,i%2?0xe7efff:white);p.position.set(i*.15,.53,0);skirt.add(p);const q=box(.19,.04,.56,mint);q.position.set(i*.15,.4,0);skirt.add(q)}g.add(skirt);const armL=new THREE.Group(),armR=new THREE.Group();for(const [a,s] of [[armL,-1],[armR,1]]){const sl=box(.22,.43,.26,cyan);sl.position.y=-.1;a.add(sl);const cuff=box(.24,.07,.28,mint);cuff.position.y=-.31;a.add(cuff);const hand=box(.18,.18,.19,skin);hand.position.y=-.43;a.add(hand);a.position.set(s*.49,1.12,0);g.add(a)}const legL=new THREE.Group(),legR=new THREE.Group();for(const [l,s] of [[legL,-1],[legR,1]]){const sock=box(.19,.32,.2,white);sock.position.y=-.18;l.add(sock);const stripe2=box(.21,.045,.22,mint);stripe2.position.y=-.08;l.add(stripe2);const shoe=box(.29,.17,.4,0x2fa6dc);shoe.position.set(0,-.39,.06);l.add(shoe);const sole=box(.31,.055,.42,white);sole.position.set(0,-.49,.06);l.add(sole);l.position.set(s*.19,.36,0);g.add(l)}g.scale.setScalar(.82);g.userData={armL,armR,legL,legR,head,torso};return g}const player=makeStabi();world.add(player);const pshadow=new THREE.Mesh(new THREE.CircleGeometry(.47,18),new THREE.MeshBasicMaterial({color:0x00e5dc,transparent:true,opacity:.14,depthWrite:false}));pshadow.rotation.x=-Math.PI/2;pshadow.position.y=.02;world.add(pshadow);function wheel(x,z,r=.22){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.16,12),mat(0x080a0c,.86));t.rotation.x=Math.PI/2;g.add(t);const h=new THREE.Mesh(new THREE.CylinderGeometry(r*.45,r*.45,.17,10),mat(0x8aa1a5,.35,.7));h.rotation.x=Math.PI/2;g.add(h);g.position.set(x,.24,z);return g}const hazards=[{name:'SLIPPAGE',c:0xc9363d,d:0x781823},{name:'MEV',c:0x6544af,d:0x301c61},{name:'PRICE IMPACT',c:0x118d8d,d:0x075657}];function car(row,dir,x,v,i){const def=hazards[(row+i)%3],g=new THREE.Group(),truck=def.name==='PRICE IMPACT',w=truck?3.25:2.7,d=truck?1.28:1.18;const body=box(w,.58,d,def.c,.42,.1);body.position.y=.51;g.add(body);if(truck){const cargo=box(1.75,.98,d*.93,def.c,.5,.05);cargo.position.set(-dir*.42,1.06,0);g.add(cargo);const cab=box(.9,.75,d*.88,def.d,.38,.1);cab.position.set(dir*1.05,.87,0);g.add(cab)}else{const hood=box(.78,.13,d*.92,def.c,.4,.08);hood.position.set(dir*.78,.8,0);g.add(hood);const cab=box(1.05,.63,d*.84,def.d,.38,.1);cab.position.set(-dir*.18,1.07,0);g.add(cab);const roof=box(.82,.08,d*.72,0x11151a,.3,.15);roof.position.set(-dir*.2,1.41,0);g.add(roof)}const wind=box(.055,.34,d*.65,0x9cf9f5,.16,.18,0x2ce7df,.5);wind.position.set(dir*(truck?1.45:.48),truck?.96:1.08,0);g.add(wind);const label=textSprite(def.name);label.position.set(0,truck?1.24:1.1,d*.58);g.add(label);const wheels=[];for(const sx of [-1,1])for(const sz of [-1,1]){const wh=wheel(sx*w*.34,sz*d*.49,truck?.24:.22);g.add(wh);wheels.push(wh)}for(const side of [-1,1]){const lamp=box(.055,.16,.2,0xb7ffff,.2,0,0x33ffff,1);lamp.position.set(dir*w*.51,.58,side*d*.27);g.add(lamp)}g.position.set(x,.02,-row*TILE);world.add(g);cars.push({g,dir,v,half:w*.51,wheels})}let coinTex;function usdz(){if(coinTex)return coinTex;const cv=document.createElement('canvas');cv.width=cv.height=256;const c=cv.getContext('2d');c.clearRect(0,0,256,256);c.beginPath();c.arc(128,128,100,0,Math.PI*2);c.fillStyle='#5f918d';c.fill();c.fillStyle='#fff';c.font='bold 145px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('$',128,134);coinTex=new THREE.CanvasTexture(cv);coinTex.colorSpace=THREE.SRGBColorSpace;return coinTex}function coin(row,x){const g=new THREE.Group(),sp=new THREE.Sprite(new THREE.SpriteMaterial({map:usdz(),transparent:true,depthWrite:false}));sp.scale.set(1,1,1);sp.position.y=.72;g.add(sp);g.position.set(x,0,-row*TILE);world.add(g);coins.push({g,sp,taken:false,s:Math.random()*6.28})}function road(row,z){const s=box(WIDTH,.24,TILE-.03,[0x061721,0x071c27,0x08222d][Math.abs(row)%3],.97);s.position.set(0,-.12,z);world.add(s);for(const side of [-1,1]){const curb=box(WIDTH,.08,.08,0x3c7d80,.7);curb.position.set(0,.02,z+side*TILE*.46);world.add(curb)}for(let x=-12;x<13;x+=4.2){const dash=box(1.55,.024,.055,0x2d7780,.5,0,0x0c4d53,.2);dash.position.set(x+(row%2?1:0),.018,z);world.add(dash)}}function grass(row,z){const s=box(WIDTH,.26,TILE-.04,row%3?0x0b5b5b:0x0a5052,.92,0,0x063739,.07);s.position.set(0,-.13,z);world.add(s)}function type(r){if(r<2)return'grass';const p=((r-2)%7+7)%7;return[0,1,3,4].includes(p)?'road':'grass'}function build(){cars=[];coins=[];while(world.children.length)world.remove(world.children[0]);world.add(player,pshadow);for(let r=-7;r<MAX;r++){const z=-r*TILE;if(type(r)==='road'){road(r,z);const dir=r%2?1:-1,count=r<12?2:r%3===0?4:3;for(let j=0;j<count;j++)car(r,dir,(j-(count-1)/2)*10.7*dir,2.8+(r%4)*.35+Math.max(0,r-2)*.015,j)}else{grass(r,z);for(let i=0;i<3;i++)if(Math.random()<.68){const x=(Math.floor(Math.random()*9)-4)*TILE+(Math.random()-.5)*.45;if(!(Math.abs(x)<1.2&&r<4))tree(x,z+(Math.random()-.5)*.7,Math.random()<.52)}if(r>1&&Math.random()<.52)coin(r,(Math.floor(Math.random()*9)-4)*TILE)}}}let running=false,ended=false,timeLeft=60,startTime=0,last=performance.now(),gx=0,gr=0,maxRow=0,moving=false,queued=null,hopStart=0,from=new THREE.Vector3(),to=new THREE.Vector3(),cc=0;function hud(){$('dist').textContent=maxRow*3+'m';$('coins').textContent=cc;$('timer').textContent='00:'+String(Math.max(0,Math.ceil(timeLeft))).padStart(2,'0')}function face(x,z){const dx=x-player.position.x,dz=z-player.position.z;if(Math.abs(dx)+Math.abs(dz)>.001)player.rotation.y=Math.atan2(dx,dz)}function reset(){build();gx=gr=maxRow=cc=0;timeLeft=60;moving=false;queued=null;ended=false;running=true;startTime=performance.now();player.position.set(0,.2,0);face(0,-TILE);$('result').style.display='none';$('ui').style.display='block';hud()}function move(d){if(!running||ended)return;if(moving){queued=d;return}let nx=gx,nr=gr;if(d==='up')nr++;if(d==='down')nr--;if(d==='left')nx--;if(d==='right')nx++;if(nx<-HALF||nx>HALF||nr<0)return;gx=nx;gr=nr;maxRow=Math.max(maxRow,gr);moving=true;hopStart=performance.now();from.copy(player.position);to.set(gx*TILE,.2,-gr*TILE);face(to.x,to.z);hud()}function boost(){return 1+Math.min(1.8,Math.floor(maxRow/9)*.12)}function hit(){for(const c of cars)if(Math.abs(c.g.position.z-player.position.z)<.72&&Math.abs(c.g.position.x-player.position.x)<c.half+.28&&player.position.y<.75){finish();return}}function collect(){for(const c of coins)if(!c.taken&&Math.abs(c.g.position.z-player.position.z)<.65&&Math.abs(c.g.position.x-player.position.x)<.62){c.taken=true;c.g.visible=false;cc++;hud()}}function finish(){if(ended)return;ended=true;running=false;$('resultText').textContent='Distance: '+maxRow*3+'m • USDZ: '+cc;setTimeout(()=>$('result').style.display='flex',100)}function loop(now){requestAnimationFrame(loop);const dt=Math.min(.034,(now-last)/1000||.016);last=now;if(running){timeLeft=Math.max(0,60-(now-startTime)/1000);const b=boost();for(const c of cars){const v=c.v*b;c.g.position.x+=v*dt*c.dir;for(const w of c.wheels)w.rotation.z-=v*dt*c.dir*1.7;if(c.g.position.x>WIDTH*.75)c.g.position.x=-WIDTH*.75;if(c.g.position.x<-WIDTH*.75)c.g.position.x=WIDTH*.75}if(moving){const dur=Math.max(125,178-Math.min(50,maxRow*.7)),p=Math.min(1,(now-hopStart)/dur),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;player.position.lerpVectors(from,to,s);player.position.y=.2+Math.sin(Math.PI*p)*.62;const sw=Math.sin(p*Math.PI*2),u=player.userData;u.armL.rotation.x=sw*.48;u.armR.rotation.x=-sw*.48;u.legL.rotation.x=-sw*.38;u.legR.rotation.x=sw*.38;if(p>=1){moving=false;player.position.copy(to);u.armL.rotation.x=u.armR.rotation.x=u.legL.rotation.x=u.legR.rotation.x=0;collect();hit();if(queued&&!ended){const q=queued;queued=null;move(q)}}}hit();if(timeLeft<=0)finish()}for(const c of coins)if(!c.taken){c.g.position.y=Math.sin(now*.003+c.s)*.1;const p=1+Math.sin(now*.006+c.s)*.06;c.sp.scale.set(p,p,1)}pshadow.position.set(player.position.x,.02,player.position.z);const target=new THREE.Vector3(player.position.x+15.5,26,player.position.z+21);camera.position.lerp(target,1-Math.exp(-dt*5));camera.lookAt(player.position.x,.35,player.position.z-7.5);hud();renderer.render(scene,camera)}function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}resize();build();requestAnimationFrame(loop);$('play').onclick=()=>{$('start').style.display='none';reset()};$('again').onclick=reset;document.querySelectorAll('.ctrl').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)}));addEventListener('keydown',e=>{if(['ArrowUp','KeyW','Space'].includes(e.code))move('up');if(['ArrowDown','KeyS'].includes(e.code))move('down');if(['ArrowLeft','KeyA'].includes(e.code))move('left');if(['ArrowRight','KeyD'].includes(e.code))move('right')});let sx=0,sy=0,sw=false;renderer.domElement.addEventListener('pointerdown',e=>{if(!running)return;sx=e.clientX;sy=e.clientY;sw=true});renderer.domElement.addEventListener('pointerup',e=>{if(!sw||!running)return;sw=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<24)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?'right':'left'):move(dy>0?'down':'up')});addEventListener('resize',resize)</script></body></html>
