<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive HD Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;font-family:Arial,sans-serif;color:#fff}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;gap:7px;justify-content:space-between;pointer-events:none}.box{background:#041b1ddd;border:1px solid #48d9cf;border-radius:11px;padding:7px 9px;font-weight:900;font-size:13px}.hp{width:160px}.bar{height:7px;margin-top:5px;background:#243236;border-radius:99px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#59e4b5}.panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#031113ed}.card{width:min(92vw,460px);padding:24px;border:1px solid #4adbd2;border-radius:20px;background:#082428;text-align:center}.logo{width:70px;height:70px;object-fit:contain}.btn{width:100%;padding:12px;border:0;border-radius:11px;background:#63ddd5;color:#052022;font-size:16px;font-weight:900}.hidden{display:none!important}.controls{position:fixed;z-index:8;left:14px;right:14px;bottom:14px;display:none;justify-content:space-between;align-items:end}.dpad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:4px}.c{width:54px;height:54px;border:1px solid #52dcd3;border-radius:14px;background:#06191ccd;color:#fff;font-size:22px;touch-action:none}.dash{width:74px;height:74px;border-radius:50%;font-size:12px}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.box{font-size:11px}.hp{width:120px}}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">USDZ <span id="coinv">0</span></div><div class="box"><span id="timev">0</span>s</div><div class="box">KO <span id="killv">0</span></div></div><section id="start" class="panel"><div class="card"><img class="logo" src="assets/logo.webp"><h1>STABI SURVIVE HD</h1><p>HD player test. Enemy and boss remain unchanged for comparison.</p><button id="playBtn" class="btn">PLAY HD TEST</button></div></section><section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="againBtn" class="btn">RUN AGAIN</button></div></section><div class="controls"><div class="dpad"><span></span><button class="c" data-k="up">▲</button><span></span><button class="c" data-k="left">◀</button><span></span><button class="c" data-k="right">▶</button><span></span><button class="c" data-k="down">▼</button><span></span></div><button id="dashBtn" class="c dash">DASH</button></div><script>(()=>{const $=id=>document.getElementById(id),cv=$('g'),ctx=cv.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const W=()=>cv.width/DPR,H=()=>cv.height/DPR;const paths={p:'assets/sprites/player/stabi-sword-hd.webp',e:'assets/atlases/red-slime-atlas.webp',b:'assets/atlases/mech-boss-atlas.webp',coin:'assets/coin.webp'};const img={};function load(k,src){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>{img[k]=i;ok()};i.onerror=()=>no(new Error(src));i.src=src})}Promise.all(Object.entries(paths).map(([k,v])=>load(k,v))).catch(console.error);let running=false,dying=false,last=0,t=0,spawnT=0,coinT=0,bossed=false,keys={up:0,down:0,left:0,right:0},en=[],coins=[],bosses=[],slashes=[];const p={x:300,y:300,r:25,hp:100,coin:0,kills:0,speed:220,dir:'down',inv:0,dash:0,atk:0,cd:0,anim:0,deathT:0};const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){t=spawnT=coinT=0;bossed=false;dying=false;en=[];coins=[];bosses=[];slashes=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',inv:0,dash:0,atk:0,cd:0,anim:0,deathT:0});hud()}function edge(){const q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-45]:q===1?[W()+45,r*H()]:q===2?[r*W(),H()+45]:[-45,r*H()]}function spawnEnemy(){const [x,y]=edge();en.push({x,y,r:24,hp:38,s:72+Math.min(t*.7,46),anim:Math.random()*6,hurt:0,dead:0,atk:0,flip:false})}function spawnCoin(x,y){coins.push({x,y,a:Math.random()*6.2})}function spawnBoss(){bosses.push({x:W()/2,y:-100,r:58,hp:360,s:48,anim:0,hurt:0,dead:0,atk:0,flip:false});bossed=true}function nearest(){return [...en,...bosses].filter(m=>!m.dead&&m.hp>0).sort((a,b)=>dist(p,a)-dist(p,b))[0]}function hitPulse(){if(p.cd>0||dying)return;const n=nearest();if(!n||dist(p,n)>125)return;const dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.atk=.42;p.cd=.64;slashes.push({x:p.x,y:p.y,dir:p.dir,a:0});for(const m of [...en,...bosses])if(!m.dead&&dist(p,m)<132){m.hp-=bosses.includes(m)?36:28;m.hurt=.22;if(m.hp<=0){m.dead=.7;m.anim=0;p.kills++;if(Math.random()<.8)spawnCoin(m.x,m.y)}}}function update(dt){if(dying){p.deathT+=dt;p.anim+=dt*7;if(p.deathT>.9)end();return}t+=dt;spawnT+=dt;coinT+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.atk=Math.max(0,p.atk-dt);p.cd=Math.max(0,p.cd-dt);p.anim+=dt*8;let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');const sp=p.speed*(p.dash?2:1);p.x+=dx/l*sp*dt;p.y+=dy/l*sp*dt}p.x=Math.max(40,Math.min(W()-40,p.x));p.y=Math.max(72,Math.min(H()-40,p.y));hitPulse();if(spawnT>Math.max(.55,1.25-t*.012)){spawnT=0;spawnEnemy()}if(coinT>2.6){coinT=0;if(coins.length<6)spawnCoin(60+Math.random()*(W()-120),90+Math.random()*(H()-150))}if(t>30&&!bossed)spawnBoss();for(const m of [...en,...bosses]){m.anim+=dt*7;m.atk=Math.max(0,m.atk-dt);if(m.dead>0){m.dead-=dt;continue}m.hurt=Math.max(0,m.hurt-dt);const dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.flip=dx<0;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(dist(p,m)<p.r+m.r&&p.inv<=0){p.hp-=bosses.includes(m)?24:11;p.inv=.65;m.atk=.35}}en=en.filter(m=>m.hp>0||m.dead>0);bosses=bosses.filter(m=>m.hp>0||m.dead>0);for(let i=coins.length-1;i>=0;i--){coins[i].a+=dt*5;if(dist(p,coins[i])<42){p.coin++;coins.splice(i,1)}}for(let i=slashes.length-1;i>=0;i--){slashes[i].a+=dt*10;if(slashes[i].a>8)slashes.splice(i,1)}hud();if(p.hp<=0){p.hp=0;dying=true;p.anim=0;p.deathT=0}}function hud(){$('hpv').textContent=Math.max(0,Math.ceil(p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('timev').textContent=Math.floor(t);$('killv').textContent=p.kills}function cell(im,c,r,cellSize,x,y,w,h,a=1,flip=false){if(!im||!im.complete)return;ctx.save();ctx.globalAlpha=a;if(flip){ctx.translate(x+w,0);ctx.scale(-1,1);x=0}ctx.drawImage(im,c*cellSize,r*cellSize,cellSize,cellSize,x,y,w,h);ctx.restore()}function bg(){ctx.fillStyle='#0b292a';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#174344';for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}}function drawMob(m,isBoss){const im=isBoss?img.b:img.e,cs=isBoss?20:16,size=isBoss?118:64,row=m.dead>0?4:m.hurt>0?3:m.atk>0?2:1,frames=row===1?8:row===2?6:row===3?4:6,fr=Math.floor(m.anim)%frames;cell(im,fr,row,cs,m.x-size/2,m.y-size/2,size,size,m.hurt>0?.65:1,m.flip)}function drawPlayerHD(){const im=img.p;if(!im||!im.complete||!im.naturalWidth)return;const cols=4,rows=4,sw=im.naturalWidth/cols,sh=im.naturalHeight/rows;const moving=keys.up||keys.down||keys.left||keys.right;const frame=moving?Math.floor(p.anim)%4:0;const rowMap={down:0,up:1,left:2,right:3};const row=rowMap[p.dir]??0;ctx.save();ctx.imageSmoothingEnabled=true;ctx.globalAlpha=p.inv>0&&Math.floor(p.inv*18)%2?.35:1;const size=118;ctx.drawImage(im,frame*sw,row*sh,sw,sh,p.x-size/2,p.y-size/2-8,size,size);ctx.restore()}function drawSlashes(){for(const s of slashes){const life=Math.max(0,1-s.a/8);ctx.save();ctx.translate(s.x,s.y);const ang=s.dir==='right'?0:s.dir==='down'?Math.PI/2:s.dir==='left'?Math.PI:-Math.PI/2;ctx.rotate(ang);ctx.strokeStyle=`rgba(130,255,240,${life})`;ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,72,-.65,.65);ctx.stroke();ctx.restore()}}function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();for(const q of coins){const yy=q.y+Math.sin(q.a)*3;ctx.drawImage(img.coin,q.x-15,yy-15,30,30)}for(const m of en)drawMob(m,false);for(const m of bosses)drawMob(m,true);drawSlashes();drawPlayerHD();if(bossed&&!dying){ctx.fillStyle='#ffaaa3';ctx.textAlign='center';ctx.font='900 18px Arial';ctx.fillText('BOSS WAVE',W()/2,55)}}function loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function startGame(){$('start').classList.add('hidden');$('over').classList.add('hidden');reset();running=true;last=0;requestAnimationFrame(loop)}function end(){if(!running)return;running=false;$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}$('playBtn').onclick=startGame;$('againBtn').onclick=startGame;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dashBtn').onpointerdown=e=>{e.preventDefault();p.dash=.18};draw()})();</script></body></html>
