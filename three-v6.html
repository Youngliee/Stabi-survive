<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive V6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071512;color:#effffb;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}.screen{position:fixed;inset:0;z-index:30}.landing{background:radial-gradient(circle at 68% 38%,#174b43,#0a2722 38%,#050d0c 75%);padding:6vh 7vw;display:flex;align-items:center}.landcopy{width:60%;z-index:2}.eyebrow{font-size:10px;letter-spacing:5px;color:#72d9c9}.landing h1{font-size:clamp(44px,8vw,100px);line-height:.82;margin:18px 0}.landing h1 span{color:#67d8c7}.landing p{max-width:480px;color:#a8c8c2;font-size:13px;line-height:1.6}.play,.enter{border:1px solid #8df4e3;background:#70daca;color:#061411;border-radius:5px;padding:14px 28px;font-weight:900;letter-spacing:2px}.orb{position:absolute;right:7vw;top:50%;transform:translateY(-50%);width:34vw;height:34vw;border:1px solid #63d8c744;border-radius:50%;box-shadow:0 0 90px #52cdbb33,inset 0 0 80px #52cdbb18}.orb:after{content:'';position:absolute;inset:27%;border-radius:50%;background:#5f918d;box-shadow:0 0 55px #69dfcd}.load{display:none;background:radial-gradient(circle at 25% 45%,#17453e,#0b211d 42%,#06110f);grid-template-columns:40% 60%;padding:5vh 5vw}.model{display:flex;align-items:center;justify-content:center}.stabiBig{width:170px;height:250px;position:relative}.stabiBig .body{position:absolute;left:39px;top:92px;width:92px;height:130px;border-radius:48px;background:#5f918d}.stabiBig .head{position:absolute;left:35px;top:35px;width:100px;height:90px;border-radius:50%;background:#effffb}.stabiBig .halo{position:absolute;left:20px;top:10px;width:130px;height:42px;border:5px solid #77ead8;border-radius:50%}.panel{align-self:center;max-width:580px}.sub{color:#74d8c9;font-size:10px;letter-spacing:3px}.panel h2{font-size:34px;margin:7px 0}.desc{font-size:11px;color:#9ebcb7}.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.class{background:#102a26;border:1px solid #315e57;color:#bcd7d2;border-radius:7px;padding:9px 7px;font-size:9px;text-align:left}.class b{display:block;color:#fff}.class.on{border-color:#7df0df;background:#153b35}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:15px}.stat{font-size:8px;color:#91aaa6}.bar{height:4px;background:#1d3934;margin-top:4px}.bar i{display:block;height:100%;background:#71dccc}.gameui{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}.hud{position:absolute;left:12px;top:12px;display:flex;gap:6px}.pill,.quest,.ultmeter{background:#071b18dd;border:1px solid #4e8b82;border-radius:7px;padding:7px 9px;font-size:9px}.quest{position:absolute;left:50%;transform:translateX(-50%);top:12px}.ultmeter{position:absolute;right:12px;top:12px;width:110px}.actions{pointer-events:auto;position:absolute;right:14px;bottom:14px;width:210px;height:180px}.btn{position:absolute;border-radius:50%;border:1px solid #7ce6d5;background:#0b2925e8;color:#fff;font-size:8px;font-weight:bold}.btn:active{transform:scale(.92)}.basic{width:76px;height:76px;right:0;bottom:0;background:#18443d}.dash{width:52px;height:52px;right:82px;bottom:4px}.jump{width:52px;height:52px;right:0;bottom:84px}.skill{width:58px;height:58px;right:62px;bottom:70px}.ultimate{width:62px;height:62px;right:132px;bottom:65px;border-color:#e5d56f}.stick{display:none;position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid #8be7d966;background:#09231f55}.stick.on{display:block}.knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#71dccc}.toast{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:#071b18dd;padding:7px 12px;border:1px solid #70dccc;border-radius:8px;opacity:0}.toast.on{opacity:1}@media(max-width:700px){.landing{padding:6vw}.landing h1{font-size:12vw}.landing p{font-size:10px}.load{grid-template-columns:35% 65%;padding:3vh 3vw}.stabiBig{transform:scale(.58)}.panel h2{font-size:20px}.classes{grid-template-columns:repeat(2,1fr);gap:5px;margin:9px 0}.class{padding:6px}.quest{top:45px;font-size:7px}}</style></head><body><section class="screen landing" id="landing"><div class="landcopy"><div class="eyebrow">STABILIZER // SURVIVAL PROTOCOL</div><h1>STABI<br><span>SURVIVE</span></h1><p>Explore the Stability Frontier, defeat anomalies and protect USDZ nodes.</p><button class="play" id="play">PLAY NOW</button></div><div class="orb"></div></section><section class="screen load" id="load"><div class="model"><div class="stabiBig"><div class="halo"></div><div class="body"></div><div class="head"></div></div></div><div class="panel"><div class="sub">SELECT STABI LOADOUT</div><h2 id="classTitle">ANCHOR</h2><div class="desc" id="desc">High defense stabilizer.</div><div class="classes"><button class="class on" data-name="ANCHOR" data-stats="70,45,45,95"><b>ANCHOR</b>Defense</button><button class="class" data-name="SURVEYOR" data-stats="45,90,70,45"><b>SURVEYOR</b>Mobility</button><button class="class" data-name="RESONANT" data-stats="65,55,95,50"><b>RESONANT</b>Range</button><button class="class" data-name="FRACTURE" data-stats="95,60,45,40"><b>FRACTURE</b>Power</button><button class="class" data-name="ROUTER" data-stats="65,75,65,60"><b>ROUTER</b>Balanced</button><button class="class" data-name="KEEPER" data-stats="55,45,65,90"><b>KEEPER</b>Support</button></div><div class="stats"><div class="stat">POWER<div class="bar"><i id="s0" style="width:70%"></i></div></div><div class="stat">SPEED<div class="bar"><i id="s1" style="width:45%"></i></div></div><div class="stat">RANGE<div class="bar"><i id="s2" style="width:45%"></i></div></div><div class="stat">DEFENSE<div class="bar"><i id="s3" style="width:95%"></i></div></div></div><button class="enter" id="enter">ENTER THE FRONTIER</button></div></section><div class="gameui" id="gameui"><div class="hud"><div class="pill">HP <b id="hp">100</b></div><div class="pill">ENERGY <b id="energy">100</b></div><div class="pill">USDZ <b id="usdz">0</b></div></div><div class="quest">LEFT // MOVE &nbsp; • &nbsp; RIGHT DRAG // CAMERA</div><div class="ultmeter">ULT <b id="ultText">0%</b><div class="bar"><i id="ultBar" style="width:0%"></i></div></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn ultimate" id="ultimate">ULT</button><button class="btn skill" id="skill">SKILL</button><button class="btn jump" id="jump">JUMP</button><button class="btn dash" id="dash">DASH</button><button class="btn basic" id="attack">ATTACK</button></div><div class="toast" id="toast"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=x=>document.getElementById(x);let selected='ANCHOR';$('play').onclick=()=>{$('landing').style.display='none';$('load').style.display='grid'};document.querySelectorAll('.class').forEach(b=>b.onclick=()=>{document.querySelectorAll('.class').forEach(x=>x.classList.remove('on'));b.classList.add('on');selected=b.dataset.name;$('classTitle').textContent=selected;b.dataset.stats.split(',').forEach((v,i)=>$('s'+i).style.width=v+'%')});const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc5b0);scene.fog=new THREE.Fog(0x9fc5b0,55,125);const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,220),ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.4));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xfff4d8,0x365046,2.7));const sun=new THREE.DirectionalLight(0xffe0a8,2);sun.position.set(-20,35,15);scene.add(sun);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(190,190),new THREE.MeshStandardMaterial({color:0x78976b}));ground.rotation.x=-Math.PI/2;world.add(ground);const obs=[];function prop(x,z,s,rock){let m;if(rock){m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),new THREE.MeshStandardMaterial({color:0x687168}));m.position.y=s*.55}else{m=new THREE.Group();let tr=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.24*s,1.8*s,6),new THREE.MeshStandardMaterial({color:0x684c34})),le=new THREE.Mesh(new THREE.IcosahedronGeometry(s,1),new THREE.MeshStandardMaterial({color:0x356748}));tr.position.y=.9*s;le.position.y=2*s;m.add(tr,le)}m.position.x=x;m.position.z=z;world.add(m);obs.push({x,z,r:s*.55})}for(let i=0;i<90;i++){let x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;if(Math.hypot(x,z-18)<8)continue;prop(x,z,.6+Math.random()*.8,i%3===0)}function makeStabi(){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.75,5,10),new THREE.MeshStandardMaterial({color:0x5f918d})),head=new THREE.Mesh(new THREE.SphereGeometry(.56,14,10),new THREE.MeshStandardMaterial({color:0xf5fffd})),halo=new THREE.Mesh(new THREE.TorusGeometry(.68,.05,7,20),new THREE.MeshStandardMaterial({color:0x7de8d7,emissive:0x42a99b,emissiveIntensity:1.5}));body.position.y=1;head.position.y=2;head.scale.y=.88;halo.position.y=2.62;halo.rotation.x=Math.PI/2;g.add(body,head,halo);return g}const player=makeStabi();player.position.set(0,0,18);world.add(player);const enemies=[];for(let i=0;i<12;i++){let a=Math.random()*6.28,r=16+Math.random()*48,mat=new THREE.MeshStandardMaterial({color:[0xe25d68,0x8967d5,0xd99b48][i%3],emissive:0x21090d}),m=new THREE.Mesh(new THREE.IcosahedronGeometry(.8,1),mat);m.position.set(Math.cos(a)*r,.8,Math.sin(a)*r);world.add(m);enemies.push({m,mat,hp:100,alive:true})}let started=false,last=0,energy=100,usd=0,ult=0,dashT=0,jumpY=0,jumpV=0,skillCd=0,attackCd=0,ultCd=0,yaw=.45,pitch=.72,camDist=27,joy={id:null,x:0,y:0,cx:0,cy:0},lookTouch={id:null,x:0,y:0};const stick=$('stick'),knob=$('knob'),toast=$('toast');function say(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),550)}function resetJoy(){joy.id=null;joy.x=joy.y=0;stick.classList.remove('on');knob.style.transform='translate(0,0)'}function updJoy(e){let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,34/d);dx*=k;dy*=k;joy.x=dx/34;joy.y=dy/34;knob.style.transform=`translate(${dx}px,${dy}px)`}document.addEventListener('pointerdown',e=>{if(!started||e.target.closest('.actions'))return;if(e.clientX<innerWidth*.42&&e.clientY>innerHeight*.58&&joy.id===null){e.preventDefault();joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;stick.style.left=joy.cx-55+'px';stick.style.top=joy.cy-55+'px';stick.classList.add('on');updJoy(e)}else if(e.clientX>innerWidth*.48&&lookTouch.id===null){e.preventDefault();lookTouch={id:e.pointerId,x:e.clientX,y:e.clientY}}},{passive:false});document.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();updJoy(e)}else if(e.pointerId===lookTouch.id){e.preventDefault();let dx=e.clientX-lookTouch.x,dy=e.clientY-lookTouch.y;lookTouch.x=e.clientX;lookTouch.y=e.clientY;yaw-=dx*.007;pitch=Math.max(.32,Math.min(1.18,pitch+dy*.005))}},{passive:false});['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerId===joy.id)resetJoy();if(e.pointerId===lookTouch.id)lookTouch.id=null}));$('enter').onclick=()=>{$('load').style.display='none';$('gameui').style.display='block';started=true;last=performance.now();say(selected+' ONLINE')};function pulse(radius,color,damage){let ring=new THREE.Mesh(new THREE.RingGeometry(.6,1,32),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.copy(player.position);ring.position.y=.08;world.add(ring);let n=0,q=setInterval(()=>{ring.scale.setScalar(1+n*radius/10);ring.material.opacity-=.08;if(++n>10){clearInterval(q);world.remove(ring)}},24);enemies.forEach(e=>{if(e.alive&&e.m.position.distanceTo(player.position)<radius){e.hp-=damage;e.mat.emissive.setHex(0xffffff);setTimeout(()=>e.alive&&e.mat.emissive.setHex(0x21090d),80);if(e.hp<=0){e.alive=false;world.remove(e.m);usd+=2;ult=Math.min(100,ult+20)}}})}function slash(){if(attackCd>0)return;attackCd=.32;let dir=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));enemies.forEach(e=>{if(e.alive){let v=e.m.position.clone().sub(player.position);if(v.length()<3.3&&v.normalize().dot(dir)>.05){e.hp-=35;ult=Math.min(100,ult+12);if(e.hp<=0){e.alive=false;world.remove(e.m);usd+=2}}}});pulse(2.2,0xbfffee,0)}$('attack').onclick=e=>{e.stopPropagation();slash()};$('dash').onclick=e=>{e.stopPropagation();if(energy>=15){energy-=15;dashT=.28;say('DASH')}};$('jump').onclick=e=>{e.stopPropagation();if(jumpY===0){jumpV=7;say('JUMP')}};$('skill').onclick=e=>{e.stopPropagation();if(skillCd<=0&&energy>=25){energy-=25;skillCd=4;pulse(6,0x69e6d2,45);ult=Math.min(100,ult+8);say('STABILITY PULSE')}};$('ultimate').onclick=e=>{e.stopPropagation();if(ult>=100&&ultCd<=0){ult=0;ultCd=2;pulse(11,0xffe36d,100);say('ZERO-SLIPPAGE BURST')}else say('ULT '+Math.floor(ult)+'%')};function blocked(x,z){return Math.abs(x)>90||Math.abs(z)>90||obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.35)}function loop(t){requestAnimationFrame(loop);if(!started){ren.render(scene,cam);return}let dt=Math.min(.033,(t-last)/1000||.016);last=t;attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);ultCd=Math.max(0,ultCd-dt);dashT=Math.max(0,dashT-dt);energy=Math.min(100,energy+8*dt);if(jumpV||jumpY){jumpV-=16*dt;jumpY+=jumpV*dt;if(jumpY<=0){jumpY=0;jumpV=0}}player.position.y=jumpY;let x=joy.x,z=joy.y,l=Math.hypot(x,z);if(l>.08){x/=l;z/=l;let fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),mv=right.multiplyScalar(x).add(fwd.multiplyScalar(z)).normalize(),sp=5.6*(dashT?2.4:1),nx=player.position.x+mv.x*sp*dt,nz=player.position.z+mv.z*sp*dt;if(!blocked(nx,nz)){player.position.x=nx;player.position.z=nz}player.rotation.y=Math.atan2(mv.x,mv.z)}let h=Math.cos(pitch)*camDist,v=Math.sin(pitch)*camDist,desired=new THREE.Vector3(player.position.x+Math.sin(yaw)*h,player.position.y+v+1.2,player.position.z+Math.cos(yaw)*h);cam.position.lerp(desired,1-Math.exp(-dt*8));cam.lookAt(player.position.x,player.position.y+1.1,player.position.z);$('energy').textContent=Math.floor(energy);$('usdz').textContent=usd;$('ultText').textContent=Math.floor(ult)+'%';$('ultBar').style.width=ult+'%';ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)})</script></body></html>
