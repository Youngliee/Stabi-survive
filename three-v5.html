<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive V5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081916;color:#eafffb;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}.load{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 25% 45%,#17453e 0,#0b211d 40%,#06110f 100%);display:grid;grid-template-columns:45% 55%;padding:5vh 5vw}.brand{position:absolute;left:5vw;top:4vh;font-size:11px;letter-spacing:4px;color:#78d9ca}.model{display:flex;align-items:center;justify-content:center}.stabiBig{width:170px;height:250px;position:relative;filter:drop-shadow(0 0 25px #55cbb655)}.stabiBig .body{position:absolute;left:39px;top:92px;width:92px;height:130px;border-radius:48px;background:linear-gradient(145deg,#76b7af,#345f5a)}.stabiBig .head{position:absolute;left:35px;top:35px;width:100px;height:90px;border-radius:50%;background:#effffb}.stabiBig .halo{position:absolute;left:20px;top:10px;width:130px;height:42px;border:5px solid #77ead8;border-radius:50%;box-shadow:0 0 20px #55d8c5}.panel{align-self:center;max-width:570px}.panel h1{font-size:34px;margin:0 0 5px}.sub{color:#74d8c9;font-size:11px;letter-spacing:2px}.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 18px}.class{background:#102a26;border:1px solid #315e57;color:#cde9e4;border-radius:8px;padding:11px 7px;font-size:10px;text-align:left}.class.on{border-color:#7df0df;background:#153b35;box-shadow:0 0 12px #5dd7c433}.class b{display:block;color:white;margin-bottom:3px}.desc{font-size:11px;color:#9ebcb7;min-height:32px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:15px 0}.stat{font-size:9px;color:#91aaa6}.bar{height:4px;background:#1d3934;margin-top:4px}.bar i{display:block;height:100%;background:#71dccc}.enter{margin-top:16px;border:1px solid #83eadb;background:#6fd7c7;color:#061713;border-radius:6px;padding:13px 24px;font-weight:bold;letter-spacing:1px}.gameui{position:fixed;inset:0;pointer-events:none;display:none}.hud{position:absolute;left:12px;top:12px;display:flex;gap:6px}.pill,.quest,.stability{background:#071b18dd;border:1px solid #4e8b82;border-radius:7px;padding:7px 9px;font-size:10px}.quest{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center}.stability{position:absolute;right:12px;top:12px;width:100px}.actions{pointer-events:auto;position:absolute;right:16px;bottom:18px;display:flex;gap:9px;align-items:flex-end}.btn{width:60px;height:60px;border-radius:50%;border:1px solid #7ce6d5;background:#0b2925dd;color:#fff;font-size:9px;font-weight:bold}.primary{width:78px;height:78px}.stick{display:none;position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid #8be7d966;background:#09231f55}.stick.on{display:block}.knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#71dccc}.toast{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:#071b18dd;padding:7px 12px;border:1px solid #70dccc;border-radius:8px;opacity:0}.toast.on{opacity:1}@media(max-width:700px){.load{grid-template-columns:38% 62%;padding:3vh 3vw}.stabiBig{transform:scale(.65)}.panel h1{font-size:22px}.classes{grid-template-columns:repeat(2,1fr);margin:12px 0}.class{padding:7px 5px}.stats{margin:8px 0}.quest{top:45px;font-size:8px}}</style></head><body><div class="load" id="load"><div class="brand">STABILIZER // FRONTIER</div><div class="model"><div class="stabiBig"><div class="halo"></div><div class="body"></div><div class="head"></div></div></div><div class="panel"><div class="sub">SELECT STABI LOADOUT</div><h1 id="classTitle">ANCHOR</h1><div class="desc" id="desc">High defense stabilizer built to hold unstable zones.</div><div class="classes" id="classes"><button class="class on" data-name="ANCHOR" data-desc="High defense stabilizer built to hold unstable zones." data-stats="70,45,45,95"><b>ANCHOR</b>Defense</button><button class="class" data-name="SURVEYOR" data-desc="Fast explorer specialized in locating Stability Shards." data-stats="45,90,70,45"><b>SURVEYOR</b>Mobility</button><button class="class" data-name="RESONANT" data-desc="Amplifies stabilization pulses across a wider area." data-stats="65,55,95,50"><b>RESONANT</b>Range</button><button class="class" data-name="FRACTURE" data-desc="Aggressive unit that breaks hostile anomalies quickly." data-stats="95,60,45,40"><b>FRACTURE</b>Power</button><button class="class" data-name="ROUTER" data-desc="Balanced unit optimized for efficient frontier traversal." data-stats="65,75,65,60"><b>ROUTER</b>Balanced</button><button class="class" data-name="KEEPER" data-desc="Durable support unit for protecting Stability Nodes." data-stats="55,45,65,90"><b>KEEPER</b>Support</button></div><div class="stats"><div class="stat">POWER<div class="bar"><i id="s0" style="width:70%"></i></div></div><div class="stat">SPEED<div class="bar"><i id="s1" style="width:45%"></i></div></div><div class="stat">RANGE<div class="bar"><i id="s2" style="width:45%"></i></div></div><div class="stat">DEFENSE<div class="bar"><i id="s3" style="width:95%"></i></div></div></div><button class="enter" id="enter">ENTER THE FRONTIER</button></div></div><div class="gameui" id="gameui"><div class="hud"><div class="pill">HP <b id="hp">100</b></div><div class="pill">ENERGY <b id="energy">100</b></div><div class="pill">USDZ <b id="usdz">0</b></div></div><div class="quest">OBJECTIVE // STABILIZE FRONTIER NODES</div><div class="stability">STABILITY 76%<div class="bar"><i style="width:76%"></i></div></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="dash">DASH</button><button class="btn primary" id="attack">STABILIZE</button></div><div class="toast" id="toast"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';let selected='ANCHOR';document.querySelectorAll('.class').forEach(b=>b.onclick=()=>{document.querySelectorAll('.class').forEach(x=>x.classList.remove('on'));b.classList.add('on');selected=b.dataset.name;classTitle.textContent=selected;desc.textContent=b.dataset.desc;b.dataset.stats.split(',').forEach((v,i)=>document.getElementById('s'+i).style.width=v+'%')});const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc5b0);scene.fog=new THREE.Fog(0x9fc5b0,55,115);const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200),ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.4));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xfff4d8,0x3b5548,2.6));const sun=new THREE.DirectionalLight(0xffe0a8,2.1);sun.position.set(-20,35,15);scene.add(sun);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x78976b,roughness:1}));ground.rotation.x=-Math.PI/2;world.add(ground);const pathMat=new THREE.MeshStandardMaterial({color:0xbba77e});[[0,0,10,170],[0,-12,155,9],[-34,28,55,7],[32,25,48,7]].forEach(a=>{let m=new THREE.Mesh(new THREE.BoxGeometry(a[2],.03,a[3]),pathMat);m.position.set(a[0],.02,a[1]);world.add(m)});const obs=[];function rock(x,z,s){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),new THREE.MeshStandardMaterial({color:0x697269}));m.scale.y=.7;m.position.set(x,s*.55,z);world.add(m);obs.push({x,z,r:s*.65})}function tree(x,z,s){let g=new THREE.Group(),a=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.25*s,1.8*s,6),new THREE.MeshStandardMaterial({color:0x684c34})),b=new THREE.Mesh(new THREE.IcosahedronGeometry(1*s,1),new THREE.MeshStandardMaterial({color:0x356748}));a.position.y=.9*s;b.position.y=2*s;g.add(a,b);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:.5*s})}for(let i=0;i<100;i++){let x=(Math.random()-.5)*160,z=(Math.random()-.5)*160;if(Math.abs(x)<9||Math.abs(z+12)<8)continue;(i%3?tree:rock)(x,z,.55+Math.random()*.8)}function stabi(){let g=new THREE.Group(),t=new THREE.MeshStandardMaterial({color:0x5f918d}),w=new THREE.MeshStandardMaterial({color:0xf5fffd});let body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.75,5,10),t);body.position.y=1;let head=new THREE.Mesh(new THREE.SphereGeometry(.56,14,10),w);head.scale.y=.88;head.position.y=2;let halo=new THREE.Mesh(new THREE.TorusGeometry(.68,.05,7,20),new THREE.MeshStandardMaterial({color:0x7de8d7,emissive:0x42a99b,emissiveIntensity:1.5}));halo.rotation.x=Math.PI/2;halo.position.y=2.62;g.add(body,head,halo);return g}const player=stabi();player.position.set(0,0,18);world.add(player);const nodes=[];function node(x,z){let m=new THREE.Mesh(new THREE.OctahedronGeometry(.75),new THREE.MeshStandardMaterial({color:0x72e2d1,emissive:0x2b998c,emissiveIntensity:1.3}));m.position.set(x,.9,z);world.add(m);nodes.push({m,hp:3})}[[7,1],[-12,-14],[18,-22],[-22,22],[30,9],[-31,-28]].forEach(p=>node(...p));const enemies=[];function enemy(x,z,c=0xe25d68){let mat=new THREE.MeshStandardMaterial({color:c,emissive:0x2a1117}),m=new THREE.Mesh(new THREE.IcosahedronGeometry(.8,1),mat);m.position.set(x,.8,z);world.add(m);enemies.push({m,mat,hp:90})}for(let i=0;i<10;i++){let a=Math.random()*6.28,r=20+Math.random()*40;enemy(Math.cos(a)*r,Math.sin(a)*r,[0xe25d68,0x8967d5,0xd99b48][i%3])}let started=false,last=0,hpv=100,energyv=100,usd=0,dashv=0,cd=0,joy={id:null,x:0,y:0,cx:0,cy:0};const stick=document.getElementById('stick'),knob=document.getElementById('knob'),toast=document.getElementById('toast');function say(x){toast.textContent=x;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),600)}function reset(){joy.id=null;joy.x=joy.y=0;stick.classList.remove('on');knob.style.transform='translate(0,0)'}function upd(e){let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,34/d);dx*=k;dy*=k;joy.x=dx/34;joy.y=dy/34;knob.style.transform=`translate(${dx}px,${dy}px)`}document.addEventListener('pointerdown',e=>{if(!started||joy.id!==null||e.target.closest('.actions')||e.clientX>innerWidth*.4||e.clientY<innerHeight*.6)return;e.preventDefault();joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;stick.style.left=joy.cx-55+'px';stick.style.top=joy.cy-55+'px';stick.classList.add('on');upd(e)},{passive:false});document.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();upd(e)}},{passive:false});['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerId===joy.id)reset()}));enter.onclick=()=>{load.style.display='none';gameui.style.display='block';started=true;last=performance.now();say(selected+' ONLINE')};dash.onclick=e=>{e.stopPropagation();if(energyv>=18){energyv-=18;dashv=.25}};function pulse(){let m=new THREE.Mesh(new THREE.RingGeometry(.5,1,28),new THREE.MeshBasicMaterial({color:0x79ead8,transparent:true,opacity:.9,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.copy(player.position);m.position.y=.08;world.add(m);let n=0,q=setInterval(()=>{m.scale.setScalar(1+n*.25);m.material.opacity-=.09;if(++n>9){clearInterval(q);world.remove(m)}},24)};attack.onclick=e=>{e.stopPropagation();if(cd>0)return;cd=.35;pulse();let hit=0;nodes.forEach(n=>{if(n.hp>0&&n.m.position.distanceTo(player.position)<5){n.hp--;hit++;n.m.scale.multiplyScalar(.88);if(!n.hp){world.remove(n.m);usd+=5;say('+5 USDZ')}}});enemies.forEach(n=>{if(n.hp>0&&n.m.position.distanceTo(player.position)<5){n.hp-=40;hit++;n.mat.emissive.setHex(0xffffff);setTimeout(()=>n.mat.emissive.setHex(0x2a1117),90)}});if(!hit)say('NO TARGET')};function blocked(x,z){return Math.abs(x)>86||Math.abs(z)>86||obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.4)}function alerp(a,b,t){let d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*t}const off=new THREE.Vector3(10,27,20),want=new THREE.Vector3(),look=new THREE.Vector3();cam.position.copy(player.position).add(off);cam.lookAt(player.position.x,.8,player.position.z-1);function loop(t){requestAnimationFrame(loop);if(!started){ren.render(scene,cam);return}let dt=Math.min(.033,(t-last)/1000||.016);last=t;cd=Math.max(0,cd-dt);dashv=Math.max(0,dashv-dt);energyv=Math.min(100,energyv+7*dt);let x=joy.x,z=joy.y,l=Math.hypot(x,z);if(l>.08){x/=l;z/=l;let sp=5.5*(dashv?2.2:1),nx=player.position.x+x*sp*dt,nz=player.position.z+z*sp*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=alerp(player.rotation.y,Math.atan2(x,z),Math.min(1,dt*11))}nodes.forEach(n=>{if(n.hp){n.m.rotation.y+=dt*1.4;n.m.position.y=.9+Math.sin(t*.003+n.m.position.x)*.1}});for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.hp<=0){world.remove(e.m);enemies.splice(i,1);usd+=3;continue}let v=new THREE.Vector3().subVectors(player.position,e.m.position);v.y=0;let d=v.length();if(d<13&&d>1.4)e.m.position.addScaledVector(v.normalize(),1.8*dt);else if(d<=1.4)hpv=Math.max(0,hpv-9*dt)}hp.textContent=Math.ceil(hpv);energy.textContent=Math.ceil(energyv);usdz.textContent=usd;want.copy(player.position).add(off);cam.position.lerp(want,1-Math.exp(-dt*5));look.copy(player.position);cam.lookAt(look.x,.9,look.z-1);ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);reset()});</script></body></html>
