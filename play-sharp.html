<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061718;color:#fff;font-family:Arial,sans-serif}#host{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}.loader{position:fixed;z-index:999;inset:0;display:grid;place-items:center;padding:18px;background:linear-gradient(rgba(3,17,18,.94),rgba(3,17,18,.94)),linear-gradient(#143e40 1px,transparent 1px),linear-gradient(90deg,#143e40 1px,transparent 1px),#08292a;background-size:auto,52px 52px,52px 52px,auto}.loader.hidden{display:none}.card{width:min(92vw,420px);padding:22px;background:#09282b;border:1px solid #54ded5;border-radius:18px;text-align:center;box-shadow:0 0 28px rgba(84,222,213,.12)}h1{margin:0 0 12px;font-size:28px}p{margin:0 0 16px;color:#d5efed;font-size:14px;line-height:1.45}.status{font-size:12px;color:#7fe3dc;margin:12px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-weight:900;letter-spacing:.5px}#pct{color:#dffffb;font-size:16px}.track{height:12px;padding:1px;border:1px solid #55ddd5;border-radius:99px;background:#123436;overflow:hidden}#fill{display:block;width:0;height:100%;border-radius:99px;background:#63ddd5;box-shadow:0 0 12px #63ddd577;transition:width .18s ease}.btn{width:100%;border:0;border-radius:12px;padding:12px 16px;background:#63ddd5;color:#062022;font-weight:900;font-size:16px;touch-action:manipulation}.btn:disabled{opacity:.42}.small{margin-top:10px;font:11px monospace;color:#85aaa7}#ready{display:none;margin:12px 0 4px;color:#9efff6;font-weight:900}</style></head><body><iframe id="host" src="play-game-shell.html?v=20260904-boss15-crisp1" title="Stabi Survive"></iframe><section id="loader" class="loader"><div class="card"><h1>STABI SURVIVE</h1><p>Survive to Level 15 and defeat the Final MEV Boss.</p><div class="status"><div class="row"><span id="label">LOADING ASSETS</span><b id="pct">0%</b></div><div class="track"><i id="fill"></i></div></div><div id="ready">READY ✓</div><button id="play" class="btn" disabled>PLAY</button><div class="small">STABI SURVIVE</div></div></section><script>(()=>{const host=document.getElementById('host'),loader=document.getElementById('loader'),label=document.getElementById('label'),pct=document.getElementById('pct'),fill=document.getElementById('fill'),ready=document.getElementById('ready'),play=document.getElementById('play');let p=0,done=false,errored=false;function stage(v){if(v<18)return'LOADING CORE';if(v<38)return'LOADING STABI';if(v<58)return'STABI ANIMATIONS';if(v<72)return'SLIPPAGE SPRITES';if(v<84)return'MEV ASSETS';if(v<92)return'FINAL BOSS';if(v<97)return'ULTIMATE + HUD';return'FINALIZING'}function render(){pct.textContent=Math.floor(p)+'%';fill.style.width=p+'%';if(!done&&!errored)label.textContent=stage(p)}function nested(){try{const wd=host.contentDocument;if(!wd)return null;const game=wd.getElementById('game');if(!game)return null;const d=game.contentDocument;if(!d)return null;return{d,play:d.getElementById('play'),status:d.getElementById('status')}}catch(e){return null}}function check(){const n=nested();if(n?.status&&/^Asset error:/i.test(n.status.textContent||'')){errored=true;label.textContent='ASSET ERROR';pct.textContent=Math.floor(p)+'%';play.disabled=true;return}if(n?.play&&!n.play.disabled){done=true;p=100;render();label.textContent='READY';ready.style.display='block';play.disabled=false;clearInterval(timer)}}host.addEventListener('load',()=>{p=Math.max(p,12);render();setTimeout(check,150)});const timer=setInterval(()=>{if(done||errored)return check();if(p<30)p+=2;else if(p<70)p+=1.2;else if(p<90)p+=.7;else if(p<98)p+=.25;if(p>98)p=98;render();check()},120);function start(e){if(e){e.preventDefault();e.stopPropagation()}if(!done)return;const n=nested();if(n?.play&&!n.play.disabled){n.play.click();loader.classList.add('hidden')}}play.addEventListener('click',start,{passive:false});play.addEventListener('touchend',start,{passive:false});render()})();</script></body></html>
