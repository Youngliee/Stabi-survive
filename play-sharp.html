<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Joystick</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516}iframe{width:100%;height:100%;border:0;display:block}#joyZone{position:fixed;left:0;bottom:0;width:45vw;height:45vh;z-index:30;touch-action:none;display:none}#joyBase{position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid rgba(92,233,222,.55);background:rgba(4,27,29,.42);box-shadow:0 0 24px rgba(82,220,211,.14);transform:translate(-50%,-50%);display:none;pointer-events:none}#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(99,221,213,.82);border:2px solid rgba(220,255,252,.8);box-shadow:0 0 18px rgba(99,221,213,.35);transform:translate(-50%,-50%)}@media(max-width:800px),(pointer:coarse){#joyZone{display:block}}</style></head><body><iframe id="game" src="play-fixed.html?v=151e208" title="Stabi Survive"></iframe><div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div><script>(()=>{const f=document.getElementById('game'),zone=document.getElementById('joyZone'),base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');let active=false,pid=null,cx=0,cy=0,state={up:false,down:false,left:false,right:false};const keyMap={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};function emit(dir,on){if(state[dir]===on)return;state[dir]=on;try{f.contentWindow.dispatchEvent(new KeyboardEvent(on?'keydown':'keyup',{key:keyMap[dir],bubbles:true,cancelable:true}))}catch(e){}}function clear(){for(const k of Object.keys(state))emit(k,false);knob.style.transform='translate(-50%,-50%)'}function move(x,y){let dx=x-cx,dy=y-cy;const max=40,dist=Math.hypot(dx,dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const dead=10;emit('left',dx<-dead);emit('right',dx>dead);emit('up',dy<-dead);emit('down',dy>dead)}function start(e){if(active)return;active=true;pid=e.pointerId;zone.setPointerCapture(pid);const r=zone.getBoundingClientRect();cx=e.clientX-r.left;cy=e.clientY-r.top;base.style.left=cx+'px';base.style.top=cy+'px';base.style.display='block';move(e.clientX-r.left,e.clientY-r.top)}function drag(e){if(!active||e.pointerId!==pid)return;const r=zone.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top)}function end(e){if(!active||e.pointerId!==pid)return;active=false;pid=null;clear();base.style.display='none'}zone.addEventListener('pointerdown',e=>{e.preventDefault();start(e)});zone.addEventListener('pointermove',e=>{e.preventDefault();drag(e)});zone.addEventListener('pointerup',e=>{e.preventDefault();end(e)});zone.addEventListener('pointercancel',end);f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='@media(max-width:800px),(pointer:coarse){.dpad{display:none!important}.controls{left:auto!important;right:14px!important;justify-content:flex-end!important;pointer-events:none}.dash{pointer-events:auto}}';d.head.appendChild(style)}catch(e){}})})();</script></body></html>
