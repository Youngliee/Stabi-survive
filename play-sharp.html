.style.display='none'}function progression(totalXp){let level=1,spent=0,need=6;while(totalXp>=spent+need&&level<10){spent+=need;level++;need=6+(level-1)*3}return{level,current:totalXp-spent,need}}function flashLevel(level){levelNumber.textContent=level;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),920)}function syncProgress(){try{const d=f.contentDocument;if(!d)return;const k=parseInt((d.getElementById('killv')||{}).textContent||'0',10)||0;const sec=parseInt((d.getElementById('timev')||{}).textContent||'0',10)||0;const totalXp=k*2+Math.floor(sec/10);const p=progression(totalXp);lvlEl.textContent=p.level;xpEl.textContent=p.level>=10?'MAX':p.current;needEl.textContent=p.level>=10?'MAX':p.need;fill.style.width=p.level>=10?'100%':Math.max(0,Math.min(100,p.current/p.need*100))+'%';if(p.level>lastLevel){lastLevel=p.level;flashLevel(p.level)}if(sec===0&&k===0)lastLevel=1}catch(e){}}zone.addEventListener('pointerdown',e=>{e.preventDefault();start(e)});zone.addEventListener('pointermove',e=>{e.preventDefault();drag(e)});zone.addEventListener('pointerup',e=>{e.preventDefault();end(e)});zone.addEventListener('pointercancel',end);f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='@media(max-width:800px),(pointer:coarse){.pad,.dpad{display:none!important}.controls{left:auto!important;right:12px!important;justify-content:flex-end!important;pointer-events:none}.right{pointer-events:auto}.dash,#dash,#ultimate{pointer-events:auto}}';d.head.appendChild(style)}catch(e){}});setInterval(syncProgress,200)})();</script></body></html>
