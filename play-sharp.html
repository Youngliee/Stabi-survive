<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Level 10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516}iframe{width:100%;height:100%;border:0;display:block}#joyZone{position:fixed;left:0;bottom:0;width:45vw;height:45vh;z-index:30;touch-action:none;display:none}#joyBase{position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid rgba(92,233,222,.55);background:rgba(4,27,29,.42);box-shadow:0 0 24px rgba(82,220,211,.14);transform:translate(-50%,-50%);display:none;pointer-events:none}#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(99,221,213,.82);border:2px solid rgba(220,255,252,.8);box-shadow:0 0 18px rgba(99,221,213,.35);transform:translate(-50%,-50%)}#levelHud{position:fixed;z-index:35;top:55px;left:50%;transform:translateX(-50%);width:min(300px,68vw);padding:7px 10px;border:1px solid rgba(80,225,214,.55);border-radius:12px;background:rgba(4,27,29,.82);color:#fff;font:800 11px Arial,sans-serif;pointer-events:none;box-shadow:0 0 18px rgba(58,220,208,.1)}#levelLine{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}#xpTrack{height:7px;border-radius:99px;overflow:hidden;background:#193638}#xpFill{height:100%;width:0;background:#63ddd5;transition:width .18s linear}#levelFlash{position:fixed;z-index:40;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);padding:12px 18px;border:1px solid #72eee4;border-radius:14px;background:rgba(4,27,29,.9);color:#dffffb;font:900 22px Arial,sans-serif;opacity:0;pointer-events:none;transition:.2s}#levelFlash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}@media(max-width:800px),(pointer:coarse){#joyZone{display:block}#levelHud{top:52px;width:min(280px,66vw);font-size:10px}}</style></head><body><iframe id="game" src="play-fixed.html?v=final-assets-1" title="Stabi Survive"></iframe><div id="levelHud"><div id="levelLine"><span>LVL <b id="lvl">1</b></span><span>XP <b id="xp">0</b>/<b id="need">6</b></span></div><div id="xpTrack"><div id="xpFill"></div></div></div><div id="levelFlash">LEVEL UP!</div><div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div><script>(()=>{const f=document.getElementById('game'),zone=document.getElementById('joyZone'),base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob'),lvlEl=document.getElementById('lvl'),xpEl=document.getElementById('xp'),needEl=document.getElementById('need'),fill=document.getElementById('xpFill'),flash=document.getElementById('levelFlash');let active=false,pid=null,cx=0,cy=0,state={up:false,down:false,left:false,right:false},lastLevel=1;const keyMap={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};function emit(dir,on){if(state[dir]===on)return;state[dir]=on;try{f.contentWindow.dispatchEvent(new KeyboardEvent(on?'keydown':'keyup',{key:keyMap[dir],bubbles:true,cancelable:true}))}catch(e){}}function clear(){for(const k of Object.keys(state))emit(k,false);knob.style.transform='translate(-50%,-50%)'}function move(x,y){let dx=x-cx,dy=y-cy;const max=40,dist=Math.hypot(dx,dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const dead=10;emit('left',dx<-dead);emit('right',dx>dead);emit('up',dy<-dead);emit('down',dy>dead)}function start(e){if(active)return;active=true;pid=e.pointerId;zone.setPointerCapture(pid);const r=zone.getBoundingClientRect();cx=e.clientX-r.left;cy=e.clientY-r.top;base.style.left=cx+'px';base.style.top=cy+'px';base.style.display='block';move(e.clientX-r.left,e.clientY-r.top)}function drag(e){if(!active||e.pointerId!==pid)return;const r=zone.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top)}function end(e){if(!active||e.pointerId!==pid)return;active=false;pid=null;clear();base.style.display='none'}function progression(totalXp){let level=1,spent=0,need=6;while(totalXp>=spent+need&&level<10){spent+=need;level++;need=6+(level-1)*3}return{level,current:totalXp-spent,need}}function flashLevel(){flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),900)}function syncProgress(){try{const d=f.contentDocument;if(!d)return;const k=parseInt((d.getElementById('killv')||{}).textContent||'0',10)||0;const sec=parseInt((d.getElementById('timev')||{}).textContent||'0',10)||0;const totalXp=k*2+Math.floor(sec/10);const p=progression(totalXp);lvlEl.textContent=p.level;xpEl.textContent=p.level>=10?'MAX':p.current;needEl.textContent=p.level>=10?'MAX':p.need;fill.style.width=p.level>=10?'100%':Math.max(0,Math.min(100,p.current/p.need*100))+'%';if(p.level>lastLevel){lastLevel=p.level;flashLevel()}if(sec===0&&k===0)lastLevel=1}catch(e){}}zone.addEventListener('pointerdown',e=>{e.preventDefault();start(e)});zone.addEventListener('pointermove',e=>{e.preventDefault();drag(e)});zone.addEventListener('pointerup',e=>{e.preventDefault();end(e)});zone.addEventListener('pointercancel',end);f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='@media(max-width:800px),(pointer:coarse){.dpad{display:none!important}.controls{left:auto!important;right:14px!important;justify-content:flex-end!important;pointer-events:none}.dash{pointer-events:auto}}';d.head.appendChild(style)}catch(e){}});setInterval(syncProgress,200)})();</script></body></html>
