<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Level 15</title><style>

#levelFlash::before{content:"";position:absolute;z-index:-2;width:188px;height:188px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(110,255,241,.22) 0 4deg,transparent 4deg 12deg);mask-image:radial-gradient(circle,black 0 30%,transparent 72%);-webkit-mask-image:radial-gradient(circle,black 0 30%,transparent 72%);animation:spinRays 2.8s linear infinite}
#levelFlash::after{content:"✦  ◆  ✦  ◆  ✦";position:absolute;top:10px;left:0;right:0;text-align:center;color:#93fff5;font:900 13px Arial,sans-serif;letter-spacing:13px;text-shadow:0 0 8px #54eadf,0 0 16px #54eadf;opacity:.9}
#levelFlash.show{animation:levelPop .85s ease-out both}.levelBanner{position:relative;min-width:190px;padding:8px 24px;text-align:center;color:#eafffd;font:900 clamp(18px,4.5vw,26px) Arial,sans-serif;letter-spacing:1px;text-shadow:0 2px 0 #0a605d,0 0 10px rgba(204,255,251,.8);background:linear-gradient(180deg,#7efff4 0%,#1ec6bd 48%,#0e817d 100%);border:2px solid #bafff9;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);box-shadow:0 0 12px rgba(72,238,225,.7),0 0 28px rgba(45,205,196,.35)}
.levelNumber{margin-top:-2px;color:#dffffb;font:900 clamp(48px,13vw,76px) Arial,sans-serif;line-height:.95;text-shadow:0 3px 0 #0a5451,0 0 9px #66f2e7,0 0 24px rgba(75,235,222,.72)}.levelSub{margin-top:2px;color:#8cf7ee;font:900 9px Arial,sans-serif;letter-spacing:3px;text-shadow:0 0 8px rgba(77,237,225,.7)}

@media(max-width:800px),(pointer:coarse){#joyZone{display:block}#levelHud{top:76px;width:min(260px,62vw);font-size:9px}#levelHud.bossActive{top:112px}#levelFlash{top:61%;width:min(280px,72vw);height:142px}.levelBanner{min-width:174px;padding:7px 20px}#levelFlash::before{width:170px;height:170px}}
</style></head><body>
<iframe id="game" src="play-fixed.html?v=95605c4b" title="Stabi Survive"></iframe>
<div id="levelHud"><div id="levelLine"><span>LVL <b id="lvl">1</b></span><span>XP <b id="xp">0</b>/<b id="need">6</b></span></div><div id="xpTrack"><div id="xpFill"></div></div></div>
<div id="levelFlash"><div class="levelBanner">LEVEL UP!</div><div id="levelNumber" class="levelNumber">2</div><div class="levelSub">STABILITY BOOST</div></div>
<div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
<script>(()=>{const f=document.getElementById('game'),zone=document.getElementById('joyZone'),base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob'),lvlEl=document.getElementById('lvl'),xpEl=document.getElementById('xp'),needEl=document.getElementById('need'),fill=document.getElementById('xpFill'),flash=document.getElementById('levelFlash'),levelNumber=document.getElementById('levelNumber'),levelHud=document.getElementById('levelHud');let active=false,pid=null,cx=0,cy=0,state={up:false,down:false,left:false,right:false},lastLevel=1;const keyMap={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};
function emit(dir,on){if(state[dir]===on)return;state[dir]=on;try{f.contentWindow.dispatchEvent(new KeyboardEvent(on?'keydown':'keyup',{key:keyMap[dir],bubbles:true,cancelable:true}))}catch(e){}}
function clear(){for(const k of Object.keys(state))emit(k,false);knob.style.transform='translate(-50%,-50%)'}
function move(x,y){let dx=x-cx,dy=y-cy;const max=40,dist=Math.hypot(dx,dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const dead=10;emit('left',dx<-dead);emit('right',dx>dead);emit('up',dy<-dead);emit('down',dy>dead)}
function start(e){if(active)return;active=true;pid=e.pointerId;zone.setPointerCapture(pid);const r=zone.getBoundingClientRect();cx=e.clientX-r.left;cy=e.clientY-r.top;base.style.left=cx+'px';base.style.top=cy+'px';base.style.display='block';move(cx,cy)}
function drag(e){if(!active||e.pointerId!==pid)return;const r=zone.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top)}
function end(e){if(!active||e.pointerId!==pid)return;active=false;pid=null;clear();base.style.display='none'}
function progression(totalXp){let level=1,spent=0,need=6;while(totalXp>=spent+need&&level<15){spent+=need;level++;need=6+(level-1)*3}return{level,current:totalXp-spent,need}}
function flashLevel(level){levelNumber.textContent=level;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),870)}
function coinSvg(){return '<span class="usdzCoinIcon" aria-hidden="true"><svg viewBox="0 0 32 32"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86fff4"/><stop offset=".55" stop-color="#36d8cd"/><stop offset="1" stop-color="#159f9a"/></linearGradient></defs><circle cx="16" cy="16" r="14" fill="url(#cg)" stroke="#c8fffa" stroke-width="1.4"/><path d="M18.8 8.6c-1.2-.8-4.9-1-6.2.5-1.5 1.7-.4 3.8 2.7 4.6l1.6.4c3.4.9 4.4 3.2 2.7 5.1-1.6 1.8-5.8 1.8-8.2.2M15.8 6.7v18.6" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/></svg></span>'}
function installIframeUI(){try{const d=f.contentDocument;if(!d)return;let style=d.getElementById('wrapperUiStyle');if(!style){style=d.createElement('style');style.id='wrapperUiStyle';style.textContent='.usdzCoinHud{display:flex!important;align-items:center!important;justify-content:center!important;gap:6px!important;min-width:58px!important;padding:5px 8px!important}.usdzCoinIcon{display:block;width:22px;height:22px;filter:drop-shadow(0 0 5px rgba(64,239,225,.45))}.usdzCoinIcon svg{display:block;width:100%;height:100%}.usdzCoinHud #coinv{font-size:13px!important;color:#eafffd!important;text-shadow:0 0 6px rgba(91,239,229,.5)!important}@media(max-width:800px),(pointer:coarse){.pad,.dpad{display:none!important}.controls{left:auto!important;right:12px!important;justify-content:flex-end!important;pointer-events:none}.right{pointer-events:auto}.dash,#dash,#ultimate{pointer-events:auto}.usdzCoinHud{min-width:50px!important;padding:4px 6px!important;gap:4px!important}.usdzCoinIcon{width:19px;height:19px}.usdzCoinHud #coinv{font-size:10px!important}}';d.head.appendChild(style)}const coinv=d.getElementById('coinv');if(coinv){const box=coinv.closest('.box');if(box&&!box.classList.contains('usdzCoinHud')){const n=coinv.textContent||'0';box.classList.add('usdzCoinHud');box.innerHTML=coinSvg()+'<span id="coinv">'+n+'</span>'}}}catch(e){}}
function syncProgress(){try{const d=f.contentDocument;if(!d)return;installIframeUI();const k=parseInt((d.getElementById('killv')||{}).textContent||'0',10)||0,sec=parseInt((d.getElementById('timev')||{}).textContent||'0',10)||0,coreXp=parseInt((d.getElementById('xpv')||{}).textContent||'',10),totalXp=Number.isFinite(coreXp)?coreXp:k*2+Math.floor(sec/10),p=progression(totalXp);lvlEl.textContent=p.level;xpEl.textContent=p.level>=15?'MAX':p.current;needEl.textContent=p.level>=15?'MAX':p.need;fill.style.width=p.level>=15?'100%':Math.max(0,Math.min(100,p.current/p.need*100))+'%';if(p.level>lastLevel){lastLevel=p.level;flashLevel(p.level)}if(sec===0&&k===0)lastLevel=1;const bb=d.getElementById('bossbar');const bossActive=!!(bb&&getComputedStyle(bb).display!=='none');levelHud.classList.toggle('bossActive',bossActive)}catch(e){}}
zone.addEventListener('pointerdown',e=>{e.preventDefault();start(e)});zone.addEventListener('pointermove',e=>{e.preventDefault();drag(e)});zone.addEventListener('pointerup',e=>{e.preventDefault();end(e)});zone.addEventListener('pointercancel',end);f.addEventListener('load',()=>{installIframeUI();syncProgress()});setInterval(syncProgress,180)})();</script></body></html>
