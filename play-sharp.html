<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Sharp</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game" src="play-fixed.html" title="Stabi Survive"></iframe><script>(()=>{const f=document.getElementById('game');function sharpen(){try{const d=f.contentDocument;if(!d)return;const c=d.getElementById('g');if(!c)return;const x=c.getContext('2d');x.imageSmoothingEnabled=false;if('webkitImageSmoothingEnabled'in x)x.webkitImageSmoothingEnabled=false;if('mozImageSmoothingEnabled'in x)x.mozImageSmoothingEnabled=false;c.style.imageRendering='pixelated';const sharpenAgain=()=>{x.imageSmoothingEnabled=false;requestAnimationFrame(sharpenAgain)};requestAnimationFrame(sharpenAgain)}catch(e){}}f.addEventListener('load',sharpen);})();</script></body></html>
