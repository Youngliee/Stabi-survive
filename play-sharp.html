<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive Map Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061718}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="play-fixed.html?v=20260903mapcanvas2" title="Stabi Survive"></iframe><script>(async()=>{const f=document.getElementById('game');let mapData='';try{const parts=await Promise.all(Array.from({length:10},async(_,i)=>{const n=String(i).padStart(2,'0'),r=await fetch('assets/maps/stabilizer-nexus-map-'+n+'.b64?v=mapcanvas2');if(!r.ok)throw new Error('Map '+n+': '+r.status);return(await r.text()).replace(/\s+/g,'')}));mapData='data:image/webp;base64,'+parts.join('')}catch(e){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;z-index:999;left:8px;bottom:8px;background:#400;color:#fff;padding:8px;font:12px monospace">'+e.message+'</div>');return}function apply(){try{const d=f.contentDocument;if(!d)return false;const cv=d.getElementById('g')||d.querySelector('canvas');if(!cv)return false;cv.style.backgroundImage='linear-gradient(rgba(1,10,13,.08),rgba(1,10,13,.08)),url("'+mapData+'")';cv.style.backgroundSize='cover';cv.style.backgroundPosition='center';cv.style.backgroundRepeat='no-repeat';cv.style.backgroundColor='#061718';cv.dataset.mapCanvasFix='2';return true}catch(e){return false}}f.addEventListener('load',()=>{setTimeout(apply,150);setTimeout(apply,500);setTimeout(apply,1200)});let tries=0,t=setInterval(()=>{tries++;if(apply()&&tries>8)clearInterval(t);if(tries>60)clearInterval(t)},200)})();</script></body></html>
