<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stabi Survive V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#94b89a;font-family:system-ui;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}.top{position:absolute;left:10px;top:10px;display:flex;gap:6px}.pill,.quest{background:#102d28dd;border:1px solid #82dfcf88;border-radius:11px;padding:7px 10px;font-size:11px}.quest{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center}.map{position:absolute;right:12px;top:12px;width:82px;height:82px;border-radius:50%;background:#173b32cc;border:2px solid #8ce6d788}.map:before{content:'▲';position:absolute;left:34px;top:30px}.actions{pointer-events:auto;position:absolute;right:18px;bottom:22px;display:flex;gap:9px;align-items:end}.btn{touch-action:none;border:1px solid #8fffee88;background:#0c302bdd;color:#fff;border-radius:50%;width:62px;height:62px;font-size:10px;font-weight:900}.atk{width:80px;height:80px;border-color:#ffe36a;color:#ffe36a}.interact{border-color:#9fd7ff}.stick{display:none;position:fixed;width:116px;height:116px;border-radius:50%;background:#0c302b66;border:2px solid #b7fff566;z-index:4}.stick.on{display:block}.knob{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:#79e1d1}.start{pointer-events:auto;position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#0c2623ee}.card{text-align:center}.card h1{margin:0;color:#7de3d3;font-size:40px}.card button{border:0;border-radius:12px;padding:13px 22px;background:#78dfcf;font-weight:900}.toast{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);background:#0b2723dd;border:1px solid #8ce6d7;border-radius:12px;padding:9px 13px;opacity:0}.toast.on{opacity:1}.npcmsg{position:absolute;left:50%;bottom:125px;transform:translateX(-50%);width:min(88%,380px);background:#0c2824ee;border:1px solid #83e0d0;border-radius:14px;padding:12px;display:none;font-size:12px}.npcmsg.on{display:block}@media(max-width:600px){.pill{font-size:9px;padding:5px 7px}.quest{top:45px;font-size:10px}}</style></head><body><div class="start" id="start"><div class="card"><h1>STABI SURVIVE</h1><p>THE STABILIZER FRONTIER • V3</p><button id="go">ENTER FRONTIER</button></div></div><div id="ui"><div class="top"><div class="pill">❤ <b id="hp">100</b></div><div class="pill">USDZ <b id="coin">0</b></div><div class="pill">RELAY <b id="relay">0/3</b></div></div><div class="quest" id="quest">FIRST SIGNAL • Find the Nodekeeper</div><div class="map"></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn interact" id="interact">INTERACT</button><button class="btn" id="dash">DASH</button><button class="btn atk" id="attack">✦<br>STABILIZE</button></div><div class="toast" id="toast"></div><div class="npcmsg" id="npcmsg"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc4a2);scene.fog=new THREE.Fog(0x9bc4a2,45,105);const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,200),ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.4));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xfff9e8,0x48634e,2.5));const sun=new THREE.DirectionalLight(0xffe7ba,2.4);sun.position.set(-18,30,15);scene.add(sun);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x7fa66f}));ground.rotation.x=-Math.PI/2;world.add(ground);const pathMat=new THREE.MeshStandardMaterial({color:0xc8b58e});[[0,0,9,130],[0,-4,120,8],[-28,20,42,6],[29,-25,45,6]].forEach(a=>{const q=new THREE.Mesh(new THREE.BoxGeometry(a[2],.04,a[3]),pathMat);q.position.set(a[0],.025,a[1]);world.add(q)});const obs=[];function tree(x,z,s=.9){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.3*s,1.8*s,6),new THREE.MeshStandardMaterial({color:0x6b4c32}));tr.position.y=.9*s;g.add(tr);const l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1*s,1),new THREE.MeshStandardMaterial({color:0x356b45}));l.position.y=2.2*s;g.add(l);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:.55*s})}for(let i=0;i<125;i++){const x=(Math.random()-.5)*135,z=(Math.random()-.5)*135;if(Math.abs(x)<7||Math.abs(z+4)<7)continue;tree(x,z,.6+Math.random()*.65)}function house(x,z){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(5,3,4),new THREE.MeshStandardMaterial({color:0x506f60}));b.position.y=1.5;g.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(3.7,2,4),new THREE.MeshStandardMaterial({color:0x7e5944}));r.position.y=3.8;r.rotation.y=Math.PI/4;g.add(r);g.position.set(x,0,z);world.add(g);obs.push({x,z,r:3})}house(-16,-13);house(18,15);function makeStabi(){const g=new THREE.Group(),teal=new THREE.MeshStandardMaterial({color:0x5f918d}),white=new THREE.MeshStandardMaterial({color:0xf4fffd});const b=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.7,5,10),teal);b.position.y=1;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.55,14,10),white);h.scale.y=.88;h.position.y=1.95;g.add(h);const halo=new THREE.Mesh(new THREE.TorusGeometry(.68,.05,7,20),new THREE.MeshStandardMaterial({color:0x8ff8e8,emissive:0x55cbbb,emissiveIntensity:1.5}));halo.rotation.x=Math.PI/2;halo.position.y=2.58;g.add(halo);return g}const player=makeStabi();player.position.set(0,0,10);world.add(player);const enemies=[];function spawnEnemy(x,z,type=0){const colors=[0xe65b6c,0x9567dd,0x4ba9c8],mat=new THREE.MeshStandardMaterial({color:colors[type],emissive:0x241020,emissiveIntensity:.3}),g=new THREE.Group(),b=new THREE.Mesh(new THREE.IcosahedronGeometry(type===2?.9:.65,1),mat);b.position.y=.8;g.add(b);g.position.set(x,0,z);world.add(g);enemies.push({g,hp:type===2?160:90,s:type===0?3.1:2.1,dead:0,mat})}for(let i=0;i<12;i++){const a=Math.random()*6.28,r=15+Math.random()*38;spawnEnemy(Math.cos(a)*r,Math.sin(a)*r,i%3)}const relays=[];function addRelay(x,z){const g=new THREE.Group(),base=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.4,.5,8),new THREE.MeshStandardMaterial({color:0x304a46})),core=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,3.2,8),new THREE.MeshStandardMaterial({color:0x35514d,emissive:0}));base.position.y=.25;core.position.y=1.9;g.add(base,core);g.position.set(x,0,z);world.add(g);relays.push({g,core,on:false})}addRelay(0,-25);addRelay(31,2);addRelay(-31,26);const npc=new THREE.Group(),nb=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.8,4,8),new THREE.MeshStandardMaterial({color:0xd9c074}));nb.position.y=1;npc.add(nb);npc.position.set(-9,0,-8);world.add(npc);let joy={x:0,y:0,id:null,cx:0,cy:0},started=false,last=0,dash=0,attackCd=0,hp=100,coins=0,relayCount=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob'),toast=document.getElementById('toast'),msg=document.getElementById('npcmsg');function toastMsg(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),650)}function resetJoy(){joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)';stick.classList.remove('on')}function upd(e){const max=35;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,max/d);dx*=k;dy*=k;joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}function inJoystickZone(e){return e.clientX<=innerWidth*.42&&e.clientY>=innerHeight*.58}document.addEventListener('pointerdown',e=>{if(!started||joy.id!==null||e.target.closest('.actions,.start')||!inJoystickZone(e))return;e.preventDefault();joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;stick.style.left=joy.cx-58+'px';stick.style.top=joy.cy-58+'px';stick.classList.add('on');upd(e)},{passive:false});document.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();upd(e)}},{passive:false});['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerId===joy.id)resetJoy()}));window.addEventListener('blur',resetJoy);document.getElementById('dash').onpointerdown=e=>{e.preventDefault();e.stopPropagation();dash=.3};function pulse(){const m=new THREE.Mesh(new THREE.RingGeometry(.7,1,28),new THREE.MeshBasicMaterial({color:0x8ff8e8,transparent:true,opacity:.8,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.copy(player.position);m.position.y=.08;world.add(m);let n=0,id=setInterval(()=>{n++;m.scale.setScalar(1+n*.22);m.material.opacity-=.08;if(n>9){clearInterval(id);world.remove(m)}},25)}document.getElementById('attack').onpointerdown=e=>{e.preventDefault();e.stopPropagation();if(attackCd>0)return;attackCd=.38;pulse();let hits=0;enemies.forEach(en=>{if(!en.dead&&en.g.position.distanceTo(player.position)<5.2){en.hp-=45;hits++;en.mat.emissive.setHex(0xffffff);setTimeout(()=>en.mat.emissive.setHex(0x241020),100)}});toastMsg(hits?`STABILIZED ×${hits}`:'MISS')};document.getElementById('interact').onpointerdown=e=>{e.preventDefault();e.stopPropagation();if(npc.position.distanceTo(player.position)<4){msg.innerHTML='<b>NODEKEEPER</b><br>Activate all Stabilizer Relays and clear hostile anomalies.';msg.classList.add('on');document.getElementById('quest').textContent='FIRST SIGNAL • Activate Stabilizer Relays';setTimeout(()=>msg.classList.remove('on'),2400);return}let hit=false;relays.forEach(r=>{if(!r.on&&r.g.position.distanceTo(player.position)<4){r.on=true;hit=true;relayCount++;r.core.material.color.setHex(0x72e0cf);r.core.material.emissive.setHex(0x3cb8a6);r.core.material.emissiveIntensity=1.5;document.getElementById('relay').textContent=relayCount+'/3';toastMsg('RELAY ACTIVATED')}});if(!hit)toastMsg('Nothing to interact with')};document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';started=true;last=performance.now()};function blocked(x,z){return Math.abs(x)>70||Math.abs(z)>70||obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.5)}function angleLerp(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI)%(Math.PI*2)-Math.PI;return a+d*t}const FP_EYE_HEIGHT=2.05,FP_LOOK_DISTANCE=12,cameraDesired=new THREE.Vector3(),cameraTarget=new THREE.Vector3();function updateFirstPersonCamera(dt){const yaw=player.rotation.y;cameraDesired.set(player.position.x,FP_EYE_HEIGHT,player.position.z);const follow=1-Math.exp(-dt*16);cam.position.lerp(cameraDesired,follow);cameraTarget.set(player.position.x+Math.sin(yaw)*FP_LOOK_DISTANCE,1.65,player.position.z+Math.cos(yaw)*FP_LOOK_DISTANCE);cam.lookAt(cameraTarget);player.visible=false}cam.position.set(player.position.x,FP_EYE_HEIGHT,player.position.z);cam.lookAt(player.position.x,1.65,player.position.z+FP_LOOK_DISTANCE);function loop(t){requestAnimationFrame(loop);if(!started){player.visible=true;ren.render(scene,cam);return}const dt=Math.min(.033,(t-last)/1000||.016);last=t;dash=Math.max(0,dash-dt);attackCd=Math.max(0,attackCd-dt);let mx=joy.x,mz=joy.y;if(Math.hypot(mx,mz)>.08){const l=Math.hypot(mx,mz);mx/=l;mz/=l;const moveYaw=Math.atan2(mx,mz),sp=5.7*(dash>0?2.5:1),nx=player.position.x+mx*sp*dt,nz=player.position.z+mz*sp*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=angleLerp(player.rotation.y,moveYaw,Math.min(1,dt*12))}for(let i=enemies.length-1;i>=0;i--){const en=enemies[i];if(en.hp<=0&&!en.dead){en.dead=.35;coins+=3;toastMsg('+3 USDZ')}if(en.dead){en.dead-=dt;en.g.scale.multiplyScalar(.94);if(en.dead<=0){world.remove(en.g);enemies.splice(i,1)}continue}const v=new THREE.Vector3().subVectors(player.position,en.g.position);v.y=0;const d=v.length();if(d<15&&d>1.2){v.normalize();en.g.position.addScaledVector(v,en.s*dt)}else if(d<=1.2)hp=Math.max(0,hp-11*dt)}document.getElementById('hp').textContent=Math.ceil(hp);document.getElementById('coin').textContent=coins;if(relayCount===3)document.getElementById('quest').textContent='FRONTIER RESTORED • Clear remaining anomalies';updateFirstPersonCamera(dt);ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);resetJoy()});</script></body></html>
