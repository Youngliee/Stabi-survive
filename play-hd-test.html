<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi Survive HD Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}.box{background:#041b1ddd;border:1px solid #48d9cf;border-radius:11px;padding:7px 9px;font-weight:900;font-size:12px}.hp{width:150px}.bar{height:7px;margin-top:5px;background:#243236;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#59e4b5}.panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#031113ed}.card{width:min(92vw,430px);padding:24px;border:1px solid #4adbd2;border-radius:20px;background:#082428;text-align:center}.logo{width:68px;height:68px;object-fit:contain}.btn{width:100%;padding:12px;border:0;border-radius:11px;background:#63ddd5;color:#052022;font-size:16px;font-weight:900}.hidden{display:none!important}.status{font-size:12px;color:#74dad4;margin:8px 0}.controls{position:fixed;z-index:8;left:14px;right:14px;bottom:14px;display:none;justify-content:space-between;align-items:end}.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px}.c{width:52px;height:52px;border:1px solid #52dcd3;border-radius:14px;background:#06191cdd;color:#fff;font-size:22px;touch-action:none}.dash{width:72px;height:72px;border-radius:50%;font-size:12px}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.box{font-size:10px;padding:6px}.hp{width:112px}}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="box hp">HP <span id="hpv">100</span><div class="bar"><i id="hpb"></i></div></div><div class="box">USDZ <span id="coinv">0</span></div><div class="box"><span id="timev">0</span>s</div><div class="box">KO <span id="killv">0</span></div></div><section id="start" class="panel"><div class="card"><img class="logo" src="assets/logo.webp"><h1>STABI SURVIVE HD</h1><p>Test player sprite HD baru. Enemy dan boss sementara tetap aset lama.</p><div id="status" class="status">Loading HD Stabi…</div><button id="play" class="btn" disabled>PLAY TEST</button></div></section><section id="over" class="panel hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="again" class="btn">RUN AGAIN</button></div></section><div class="controls"><div class="dpad"><span></span><button class="c" data-k="up">▲</button><span></span><button class="c" data-k="left">◀</button><span></span><button class="c" data-k="right">▶</button><span></span><button class="c" data-k="down">▼</button><span></span></div><button id="dash" class="c dash">DASH</button></div><script>(()=>{const $=id=>document.getElementById(id),cv=$('g'),ctx=cv.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const W=()=>cv.width/DPR,H=()=>cv.height/DPR;const paths={p:'assets/sprites/player/stabi-sword-hd.webp',e:'assets/sprites/enemies/red-slime-sprites.webp',b:'assets/sprites/boss/mech-boss-sprites.webp',coin:'assets/coin.webp'},img={};function load(k,s){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>{img[k]=i;ok()};i.onerror=()=>no(new Error(s));i.src=s+'?v=hd1'})}Promise.all(Object.entries(paths).map(([k,s])=>load(k,s))).then(()=>{$('status').textContent='HD Stabi ready ✓';$('play').disabled=false}).catch(e=>$('status').textContent='Asset error: '+e.message);const keys={up:0,down:0,left:0,right:0};let running=false,last=0,t=0,spawnT=0,bossed=false,en=[],boss=[],coins=[],slashes=[];const p={x:300,y:300,r:25,hp:100,coin:0,kills:0,speed:220,dir:'down',inv:0,dash:0,atk:0,cd:0,anim:0};const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){t=spawnT=0;bossed=false;en=[];boss=[];coins=[];slashes=[];Object.assign(p,{x:W()/2,y:H()/2,hp:100,coin:0,kills:0,dir:'down',inv:0,dash:0,atk:0,cd:0,anim:0});hud()}function edge(){const q=Math.floor(Math.random()*4),r=Math.random();return q===0?[r*W(),-45]:q===1?[W()+45,r*H()]:q===2?[r*W(),H()+45]:[-45,r*H()]}function spawnEnemy(){const [x,y]=edge();en.push({x,y,r:24,hp:40,s:75+Math.min(t*.7,45),anim:Math.random()*4})}function spawnBoss(){boss=[{x:W()/2,y:-90,r:55,hp:320,s:48,anim:0}];bossed=true}function nearest(){return [...en,...boss].filter(m=>m.hp>0).sort((a,b)=>dist(p,a)-dist(p,b))[0]}function attack(){if(p.cd>0)return;const n=nearest();if(!n||dist(p,n)>128)return;const dx=n.x-p.x,dy=n.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.atk=.22;p.cd=.55;slashes.push({x:p.x,y:p.y,a:Math.atan2(dy,dx),t:0});for(const m of [...en,...boss])if(dist(p,m)<132){m.hp-=boss.includes(m)?34:30;if(m.hp<=0){p.kills++;if(Math.random()<.8)coins.push({x:m.x,y:m.y,a:0})}}}function update(dt){t+=dt;spawnT+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.atk=Math.max(0,p.atk-dt);p.cd=Math.max(0,p.cd-dt);p.anim+=dt*7;let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');const s=p.speed*(p.dash?2:1);p.x+=dx/l*s*dt;p.y+=dy/l*s*dt}p.x=Math.max(40,Math.min(W()-40,p.x));p.y=Math.max(70,Math.min(H()-40,p.y));attack();if(spawnT>Math.max(.6,1.25-t*.012)){spawnT=0;spawnEnemy()}if(t>30&&!bossed)spawnBoss();for(const m of [...en,...boss]){m.anim+=dt*6;if(m.hp<=0)continue;const dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*m.s*dt;m.y+=dy/l*m.s*dt;if(dist(p,m)<p.r+m.r&&p.inv<=0){p.hp-=boss.includes(m)?22:10;p.inv=.6}}en=en.filter(m=>m.hp>0);boss=boss.filter(m=>m.hp>0);for(let i=coins.length-1;i>=0;i--){coins[i].a+=dt*5;if(dist(p,coins[i])<42){p.coin++;coins.splice(i,1)}}for(let i=slashes.length-1;i>=0;i--){slashes[i].t+=dt;if(slashes[i].t>.18)slashes.splice(i,1)}if(p.hp<=0)end();hud()}function hud(){$('hpv').textContent=Math.max(0,Math.ceil(p.hp));$('hpb').style.width=Math.max(0,p.hp)+'%';$('coinv').textContent=p.coin;$('timev').textContent=Math.floor(t);$('killv').textContent=p.kills}function bg(){ctx.fillStyle='#0b292a';ctx.fillRect(0,0,W(),H());ctx.strokeStyle='#174344';for(let x=0;x<W();x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke()}for(let y=0;y<H();y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke()}}function drawGridSprite(im,x,y,row,col,size){if(!im||!im.complete)return;const sw=im.naturalWidth/4,sh=im.naturalHeight/4;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,col*sw,row*sh,sw,sh,Math.round(x-size/2),Math.round(y-size/2),size,size);ctx.restore()}function drawPlayer(){const rowMap={down:0,up:1,left:2,right:3};const moving=keys.up||keys.down||keys.left||keys.right;const col=moving?Math.floor(p.anim)%4:0;ctx.save();ctx.globalAlpha=p.inv>0&&Math.floor(p.inv*16)%2?.4:1;drawGridSprite(img.p,p.x,p.y,rowMap[p.dir]??0,col,108);ctx.restore()}function drawMob(m,isBoss){if(!m||!m.hp)return;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const size=isBoss?112:60;ctx.drawImage(isBoss?img.b:img.e,m.x-size/2,m.y-size/2,size,size);ctx.restore();if(isBoss){ctx.fillStyle='#300';ctx.fillRect(m.x-50,m.y-70,100,7);ctx.fillStyle='#ef564b';ctx.fillRect(m.x-50,m.y-70,100*m.hp/320,7)}}function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();for(const q of coins){const yy=q.y+Math.sin(q.a)*3;ctx.drawImage(img.coin,q.x-15,yy-15,30,30)}for(const m of en)drawMob(m,false);for(const m of boss)drawMob(m,true);for(const s of slashes){const a=1-s.t/.18;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle=`rgba(130,255,235,${a})`;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,72,-.6,.6);ctx.stroke();ctx.restore()}drawPlayer();if(bossed){ctx.fillStyle='#ffaaa3';ctx.font='900 18px Arial';ctx.textAlign='center';ctx.fillText('BOSS WAVE',W()/2,55)}}function loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}function start(){$('start').classList.add('hidden');$('over').classList.add('hidden');reset();running=true;last=0;requestAnimationFrame(loop)}function end(){if(!running)return;running=false;$('result').innerHTML=`Survived: ${Math.floor(t)}s<br>KO: ${p.kills}<br>USDZ: ${p.coin}`;$('over').classList.remove('hidden')}$('play').onclick=start;$('again').onclick=start;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k===' ')p.dash=.18});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});$('dash').onpointerdown=e=>{e.preventDefault();p.dash=.18};draw()})();</script></body></html>
