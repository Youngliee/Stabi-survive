<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Stabi 128 DPR1 Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061516;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}#tag{position:fixed;top:10px;left:10px;z-index:3;background:#052625dd;border:1px solid #55d8cf;border-radius:12px;padding:8px 10px;font-weight:900;font-size:12px}#hint{position:fixed;top:10px;right:10px;z-index:3;background:#052625dd;border:1px solid #55d8cf;border-radius:12px;padding:8px 10px;font-size:11px}#pad{position:fixed;bottom:16px;left:16px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;z-index:4}button{border:1px solid #55d8cf;background:#082c2bdf;color:#fff;border-radius:13px;font-size:20px;touch-action:none}@media(pointer:fine){#pad{opacity:.5}}</style></head><body><canvas id="c"></canvas><div id="tag">A • 128 source • DPR 1</div><div id="hint">128px display • WASD / arrows</div><div id="pad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><span></span><button data-k="right">▶</button><span></span><button data-k="down">▼</button><span></span></div><script>(()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d'),DPR=1;function resize(){cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR)}addEventListener('resize',resize);resize();const img={},keys={up:0,down:0,left:0,right:0};function load(k,s){const i=new Image();i.src=s;img[k]=i}load('idle','assets/sprites/player/stabi-idle-128.webp?v=dpr1');load('walk','assets/sprites/player/stabi-walk-128.webp?v=dpr1');const p={x:innerWidth/2,y:innerHeight/2,dir:'down',t:0};function update(dt){p.t+=dt;let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy)||1;if(dx||dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');p.x+=dx/l*180*dt;p.y+=dy/l*180*dt}p.x=Math.max(64,Math.min(innerWidth-64,p.x));p.y=Math.max(80,Math.min(innerHeight-64,p.y))}function bg(){ctx.fillStyle='#082a2b';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.strokeStyle='#164240';ctx.lineWidth=1;for(let x=0;x<innerWidth;x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,innerHeight);ctx.stroke()}for(let y=0;y<innerHeight;y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke()}}function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);bg();const moving=keys.up||keys.down||keys.left||keys.right;const im=moving?img.walk:img.idle;if(im&&im.complete&&im.naturalWidth){const col=(moving?{down:0,left:1,right:3,up:4}:{down:0,left:1,right:2,up:3})[p.dir];const fr=Math.floor(p.t*5)%2;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,col*160,fr*160,160,160,Math.round(p.x-64),Math.round(p.y-72),128,128);ctx.restore()}requestAnimationFrame(loop)}let last=0;function loop(ts){if(!last)last=ts;const dt=Math.min(.033,(ts-last)/1000);last=ts;update(dt);draw()}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}});requestAnimationFrame(loop)})();</script></body></html>
