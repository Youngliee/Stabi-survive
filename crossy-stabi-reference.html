function collect(){for(const c of coins)if(!c.taken&&Math.abs(c.g.position.z-player.position.z)<.72&&Math.abs(c.g.position.x-player.position.x)<.68){c.taken=true;c.g.visible=false;cc++;hud()}}
function finish(time,hazard=''){if(ended)return;ended=true;running=false;$('resultTitle').textContent=time?'TIME CLEARED':'FRONTIER HIT';$('resultText').textContent=(hazard?hazard+' caught Stabi. • ':'')+'Distance: '+Math.max(0,maxRow*3)+'m • USDZ: '+cc;setTimeout(()=>$('result').style.display='flex',120)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.034,(now-last)/1000||.016);last=now;if(running){timeLeft=Math.max(0,60-(now-startTime)/1000);const b=boost();for(const c of cars){const v=c.v*b;c.g.position.x+=v*dt*c.dir;c.g.position.y=.02+Math.sin(now*.004+c.phase)*.018;for(const w of c.wheels)w.rotation.z-=v*dt*c.dir*1.7;if(c.g.position.x>WIDTH*.76)c.g.position.x=-WIDTH*.76;if(c.g.position.x<-WIDTH*.76)c.g.position.x=WIDTH*.76}if(moving){const dur=Math.max(122,176-Math.min(54,maxRow*.85)),p=Math.min(1,(now-hopStart)/dur),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;player.position.lerpVectors(from,to,s);player.position.y=.25+Math.sin(Math.PI*p)*.82;const sw=Math.sin(p*Math.PI*2),u=player.userData;u.armL.rotation.x=sw*.52;u.armR.rotation.x=-sw*.52;u.legL.rotation.x=-sw*.42;u.legR.rotation.x=sw*.42;u.torso.scale.y=1+Math.sin(Math.PI*p)*.05;if(p>=1){moving=false;player.position.copy(to);u.armL.rotation.x=u.armR.rotation.x=u.legL.rotation.x=u.legR.rotation.x=0;u.torso.scale.set(1,1,1);collect();hit();if(queued&&!ended){const q=queued;queued=null;move(q)}}}hit();if(timeLeft<=0)finish(true)}else{player.userData.head.rotation.z=Math.sin(now*.0035)*.012}for(const c of coins)if(!c.taken){c.g.position.y=Math.sin(now*.003+c.seed)*.12;const p=1+Math.sin(now*.006+c.seed)*.07;c.sp.scale.set(1.12*p,1.12*p,1)}pshadow.position.set(player.position.x,.02,player.position.z);const target=new THREE.Vector3(player.position.x+15.5,26,player.position.z+21);camera.position.lerp(target,1-Math.exp(-dt*5));camera.lookAt(player.position.x,.35,player.position.z-7.5);hud();renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=innerWidth<innerHeight?16.5:12.5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}
resize();build();requestAnimationFrame(loop);$('play').onclick=()=>{$('start').style.display='none';reset()};$('again').onclick=reset;document.querySelectorAll('.ctrl').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)}));addEventListener('keydown',e=>{if(['ArrowUp','KeyW','Space'].includes(e.code))move('up');if(['ArrowDown','KeyS'].includes(e.code))move('down');if(['ArrowLeft','KeyA'].includes(e.code))move('left');if(['ArrowRight','KeyD'].includes(e.code))move('right')});let sx=0,sy=0,sw=false;renderer.domElement.addEventListener('pointerdown',e=>{if(!running)return;sx=e.clientX;sy=e.clientY;sw=true});renderer.domElement.addEventListener('pointerup',e=>{if(!sw||!running)return;sw=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<24)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?'right':'left'):move(dy>0?'down':'up')});addEventListener('resize',resize)
</script>
