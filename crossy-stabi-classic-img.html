er.position);to.set(gridX*TILE,1.4,-gridRow*TILE);hud()}function boost(){return 1+Math.min(1.9,Math.floor(maxRow/9)*.14)}function collision(){if(!running||ended)return;for(const c of cars){if(Math.abs(c.g.position.z-player.position.z)<.75&&Math.abs(c.g.position.x-player.position.x)<c.half+.3){finish('HIT');return}}}function collect(){for(const p of pickups)if(!p.taken&&Math.abs(p.g.position.z-player.position.z)<.7&&Math.abs(p.g.position.x-player.position.x)<.6){p.taken=true;p.g.visible=false;coinCount++;hud()}}function finish(reason){if(ended)return;ended=true;running=false;$('rt').textContent=reason==='TIME'?'TIME CLEARED':'FRONTIER HIT';$('rr').textContent='Distance '+Math.max(0,maxRow*3)+'m • USDZ '+coinCount;setTimeout(()=>$('result').style.display='flex',100)}function updateCars(dt){const b=boost();for(const c of cars){c.g.position.x+=c.speed*b*dt*c.dir;const lim=WIDTH*.72;if(c.dir>0&&c.g.position.x>lim)c.g.position.x=-lim;if(c.dir<0&&c.g.position.x<-lim)c.g.position.x=lim}}function updatePlayer(now){if(moving){const dur=Math.max(120,178-Math.min(55,maxRow*.9)),p=Math.min(1,(now-hopStart)/dur),s=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;player.position.lerpVectors(from,to,s);player.position.y=1.4+Math.sin(Math.PI*p)*.75;player.material.rotation=Math.sin(p*Math.PI)*.04;if(p>=1){moving=false;player.position.copy(to);player.material.rotation=0;collect();collision();if(queued&&!ended){const q=queued;queued=null;move(q)}}}shadow.position.set(player.position.x,.02,player.position.z)}function updatePickups(dt,now){for(const p of pickups){if(p.taken)continue;p.g.rotation.y+=dt*2;p.g.position.y=Math.sin(now*.003+p.seed)*.1}}function resizeCamera(){const aspect=innerWidth/innerHeight,view=innerWidth<innerHeight?16.5:12.5;camera.left=-view*aspect;camera.right=view*aspect;camera.top=view;camera.bottom=-view;camera.updateProjectionMatrix()}resizeCamera();function cam(dt){const t=new THREE.Vector3(player.position.x+15.5,26,player.position.z+21);camera.position.lerp(t,1-Math.exp(-dt*
